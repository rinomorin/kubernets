<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Build and IPA checklist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --ok: #2e7d32;
      --warn: #9e9e9e;
      --accent: #1976d2;
      --bg: #f7f7f9;
      --card: #ffffff;
      --border: #e0e0e0;
      --muted: #616161;
      --fail: #c62828;
    }
    body {
      margin: 0; padding: 2rem; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
    }
    header {
      display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; margin: 0; }
    .source {
      font-size: 0.95rem; color: var(--muted);
    }
    .summary {
      margin: 0.5rem 0 1rem; font-size: 0.95rem; color: var(--muted);
    }
    .grid {
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
    .stage {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .stage header {
      background: #f0f4ff; border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center;
    }
    .stage h2 {
      font-size: 1rem; font-weight: 600; color: #0d47a1; margin: 0;
      text-transform: capitalize;
    }
    .count {
      font-size: 0.85rem; color: var(--muted);
    }
    .items {
      padding: 0.75rem 1rem;
    }
    .item {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0;
    }
    .item input[type="checkbox"] {
      width: 1rem; height: 1rem; accent-color: var(--accent);
    }
    .done { color: var(--ok); }
    .todo { color: var(--warn); }
    .fail { color: var(--fail); }
    .footer {
      margin-top: 1rem; font-size: 0.85rem; color: var(--muted);
    }
    .error {
      padding: 0.75rem 1rem; background: #fff3f3; border: 1px solid #ffcdd2; color: #b71c1c; border-radius: 8px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Build and IPA checklist</h1>
    <div class="source" aria-live="polite">Source: checklist.xml</div>
  </header>
  <p class="summary" id="overallSummary">Loading checklist…</p>
  <div id="errors" role="alert" aria-live="assertive"></div>
  <section class="grid" id="grid" aria-live="polite"></section>
  <p class="footer">Read-only view. Edit the XML to update status.</p>

  <script>
    // Config: XML filename
    const XML_URL = 'file:///opt/dev/projects/kubernets/checklist.xml';

    // Utility: text normalization
    const pretty = s => (s || '').trim();

    // Fetch + parse XML
    async function loadXML(url) {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error(`Failed to load XML: ${res.status} ${res.statusText}`);
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text, 'application/xml');
      const parseError = doc.querySelector('parsererror');
      if (parseError) throw new Error('Invalid XML format');
      return doc;
    }

    // Build stage card
    function renderStage(stageEl) {
      const name = pretty(stageEl.getAttribute('name') || stageEl.tagName.toLowerCase());
      const items = [...stageEl.querySelectorAll('item')].map(itemEl => ({
        label: pretty(itemEl.getAttribute('label') || itemEl.textContent),
        status: pretty(itemEl.getAttribute('status') || 'unknown').toLowerCase()
      }));

      const doneCount = items.filter(i => i.status === 'complete' || i.status === 'done' || i.status === 'true').length;
      const total = items.length;

      const stage = document.createElement('div');
      stage.className = 'stage';
      stage.innerHTML = `
        <header>
          <h2>${name}</h2>
          <span class="count">${doneCount}/${total} complete</span>
        </header>
        <div class="items"></div>
      `;
      const list = stage.querySelector('.items');

      for (const i of items) {
        const row = document.createElement('div');
        row.className = 'item';
        const checked =
          i.status === 'complete' || i.status === 'done' || i.status === 'true';
        const statusClass = checked ? 'done' :
                            i.status === 'failed' ? 'fail' : 'todo';

        row.innerHTML = `
          <input type="checkbox" ${checked ? 'checked' : ''} disabled aria-label="${i.label}">
          <span class="${statusClass}">${i.label}</span>
        `;
        list.appendChild(row);
      }
      return { node: stage, doneCount, total };
    }

    // Overall summary
    function setOverallSummary(stages) {
      const totals = stages.reduce((acc, s) => {
        acc.done += s.doneCount;
        acc.total += s.total;
        return acc;
      }, { done: 0, total: 0 });

      const percent = totals.total ? Math.round((totals.done / totals.total) * 100) : 0;
      const msg = `${totals.done}/${totals.total} items complete (${percent}%)`;
      document.getElementById('overallSummary').textContent = msg;
    }

    // Render all
    async function main() {
      try {
        const xml = await loadXML(XML_URL);
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        // Stages are any <stage> elements under the root
        const stages = [...xml.querySelectorAll('stage')].map(renderStage);
        if (stages.length === 0) {
          throw new Error('No <stage> elements found in XML.');
        }

        for (const s of stages) grid.appendChild(s.node);
        setOverallSummary(stages);
      } catch (err) {
        document.getElementById('errors').innerHTML =
          `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
        document.getElementById('overallSummary').textContent = 'Unable to load checklist.';
      }
    }

    main();
  </script>
</body>
</html>
