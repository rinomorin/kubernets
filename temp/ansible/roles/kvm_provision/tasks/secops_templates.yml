          --skip-rule xccdf_org.ssgproject.content_rule_package_openldap-clients_removed \
          --skip-rule xccdf_org.ssgproject.content_rule_service_rpcbind_disabled \
          --skip-rule xccdf_org.ssgproject.content_rule_sshd_disable_gssapi_auth \
          --remediate \
        /usr/share/xml/scap/ssg/content/ssg-rl9-ds.xml > /var/log/oscap.log
      when:
        - cis_check.stdout == "built"
        - (oscap_log_content.stdout | int) > 2


    - name: Run helper oscap initial scan (Final)
      ignore_errors: true
      failed_when: false
      vars:
        ansible_user: "{{ admin_id  }}"
        ansible_ssh_pass: "{{ admin_set }}"
        ansible_host: "{{ vm_fqdn }}"
      delegate_to: "{{ vm_host }}"
      shell: |
        /usr/bin/oscap xccdf eval \
          --profile xccdf_org.ssgproject.content_profile_cis \
          --report /root/rocky9-cis2-report2.html \
          --skip-rule xccdf_org.ssgproject.content_rule_sudo_require_authentication \
          --skip-rule xccdf_org.ssgproject.content_rule_grub2_password \
          --skip-rule xccdf_org.ssgproject.content_rule_package_openldap-clients_removed \
          --skip-rule xccdf_org.ssgproject.content_rule_service_rpcbind_disabled \
            --skip-rule xccdf_org.ssgproject.content_rule_sshd_disable_gssapi_auth \
          /usr/share/xml/scap/ssg/content/ssg-rl9-ds.xml > /var/log/oscap.log
      when:
        - cis_check.stdout == "built"
        - (oscap_log_content.stdout | int) > 2
  when: "'helper_nodes' in group_names"

- name:   load oscap log fail count if exists
  become: true
  delegate_to: "{{ vm_host }}"
  vars:
    ansible_user: "{{ admin_id }}"
    ansible_ssh_pass: "{{ admin_set }}"
    ansible_host: "{{ vm_fqdn }}"
  shell: |
    if [ -f /var/log/oscap.log ]; then
      grep "Result[[:space:]]\+fail" /var/log/oscap.log|wc -l
    else
      echo -1
    fi
  register: oscap_log_content
  changed_when: false
  failed_when: false
  
- name: Show oscap log content
  debug:
    msg: "oscap_log_content is {{ oscap_log_content.stdout }}"
    
- name: violation default 
  set_fact:
    violation: 0
    cis2_scan: "scanned"

- name: set oscap log content to 0 if no log found
  set_fact:
    violation: -1
  when: oscap_log_content.stdout == "no oscap log found"

- name: set oscap log content to 0 if no log found
  set_fact:
    violation: "{{ (oscap_log_content.stdout | int) }}"
  when: (oscap_log_content.stdout | int) > 0

- name: show oscap log content
  debug:
    msg: "oscap_log_content is {{ violation }}"

- name: Set build Stage (pass compliant)
  set_fact:
    vm_build_state: "compliant"
    vm_build_stage: "compliant"
  when:
    - cis2_scan == "scanned" 
    - violation == 0
  
- name: Set build Stage (pass with findings)
  set_fact:
    vm_build_state: "non-compliant"
    vm_build_stage: "pass with {{ violation }} findings"
  when:
    - cis2_scan == "scanned" 
    - violation|int >= 1 and violation|int <= 2

- name: Set build Stage (fail non-compliant)
  set_fact:
    vm_build_state: "non-compliant"
    vm_build_stage: "failed with {{ violation }} findings"
  when:
    - cis2_scan == "scanned" 
    - violation|int >= 3

- name: Set build Stage (fail non-compliant)
  set_fact:
    vm_build_state: "non-compliant"
    vm_build_stage: "failed to run oscap"
  when:
    - cis2_scan == "scanned" 
    - violation|int == -1
