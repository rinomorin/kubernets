# role/ipa_setup/tasks/main.yml
- name: set ipa systems (masters)
  set_fact:
    ipa_master: "{{ groups['ca'][0] }}"
    ipa_master_ip: "{{ hostvars[groups['ca'][0]].ansible_host }}"
  run_once: true
  delegate_to: localhost

- name: Set ipa intermediate system globally
  set_fact:
    ipa_ca_intermediate: "{{ groups['ca_intermediate'][0] }}"
    ipa_ca_intermediate_ip: "{{ hostvars[groups['ca_intermediate'][0]].ansible_host }}"
  run_once: true
  delegate_to: localhost

- name: set ipa ca
  block:
    - name: current IPA 
      debug: msg="{{ inventory_hostname }} ipa_role is {{ ipa_role }}"

    - name: Include install.yml
      import_tasks: install.yml

    - name: configure ipa ca
      import_tasks: ipa_ca.yml

    # - name: configure certificates
    #   import_tasks: configure_certificates.yml
    
    # - name: configure dns
    #   import_tasks: configure_dns.yml

    # - name: configure dhcp
    #   import_tasks: configure_dhcp.yml

    # - name: configure ntp
    #   import_tasks: configure_ntp.yml

    # - name: configure krb5
    #   import_tasks: configure_krb5.yml

    # - name: finalize ipa ca
    #   import_tasks: finalize_ipa.yml

  when: 
    - "'ca' in group_names"
    - vm_build_state == "scanned" or vm_build_state == "non-compliant" or vm_build_state == "compliant"

# role/ipa_setup/tasks/main.yml
- name: set ipa ca_intermediate
  block:
    - name: Addin IPA 
      debug: msg="{{ inventory_hostname }} ipa_role is intermediate"

    - name: Include install.yml
      import_tasks: install.yml

    - name: Prep for ca intermediate
      import_tasks: ipa_ca_intermediate.yml


  when: 
    - "'ca_intermediate' in group_names"
    - vm_build_state == "scanned" or vm_build_state == "non-compliant" or vm_build_state == "compliant"

