- name: Configure resolv.conf to use IPA DNS
  become: yes
  copy:
    dest: /etc/resolv.conf
    content: |
      search {{ ipa_domain }}
      nameserver {{ ipa_master_ip }}
      nameserver {{ ipa_second_ip }}
    owner: root
    group: root
    mode: '0644'
  when: "'helpers' in group_names"

- name: Configure resolv.conf to use IPA DNS
  become: yes
  copy:
    dest: /etc/resolv.conf
    content: |
      search {{ cloud_zone }}
      nameserver {{ ipa_master_ip }}
      nameserver {{ ipa_second_ip }}
    owner: root
    group: root
    mode: '0644'
  when: "'control_nodes' in group_names"

- name: create repo
  become: true
  shell: |
    # Define versions
    KUBERNETES_VERSION=v1.34
    CRIO_VERSION=v1.34

    # Kubernetes repo
    cat <<EOF > /etc/yum.repos.d/kubernetes.repo
    [kubernetes]
    name=Kubernetes
    baseurl=https://pkgs.k8s.io/core:/stable:/$KUBERNETES_VERSION/rpm/
    enabled=1
    gpgcheck=1
    gpgkey=https://pkgs.k8s.io/core:/stable:/$KUBERNETES_VERSION/rpm/repodata/repomd.xml.key
    EOF

    # CRI-O repo
    cat <<EOF > /etc/yum.repos.d/cri-o.repo
    [cri-o]
    name=CRI-O
    baseurl=https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$CRIO_VERSION/rpm/
    enabled=1
    gpgcheck=1
    gpgkey=https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$CRIO_VERSION/rpm/repodata/repomd.xml.key
    EOF
  register: add_repo
  when: "'helpers' in group_names or 'cluster_nodes' in group_names"


- name: Disable swap
  become: true
  command: swapoff -a

- name: Remove swap entry from fstab
  become: true
  replace:
    path: /etc/fstab
    regexp: '^\s*([^#].*swap.*)$'
    replace: '# \1'

- name: Load kernel modules
  become: true
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Configure sysctl for Kubernetes networking
  become: true
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables=1
      net.bridge.bridge-nf-call-ip6tables=1
      net.ipv4.ip_forward=1
  notify: Reload sysctl
- name: Install podman components
  become: true
  yum:
    name:
      - podman
      - cri-o

- name: Install Kubernetes components
  become: true
  yum:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    # disable_excludes: kubernetes
    # update_cache: yes

