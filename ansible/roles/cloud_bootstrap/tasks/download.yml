- name: Ensure Flatcar staging directory exists
  become: yes
  become_user: "{{ cloud_helper_user }}"
  ansible.builtin.file:
    path: "{{ cloud_helper_workdir }}/flatcar"
    state: directory
    mode: '0755'

- name: Download Flatcar QEMU image
  become: yes
  become_user: "{{ cloud_helper_user }}"
  shell: |
    set -e
    cd "{{ cloud_helper_workdir }}/flatcar"
    curl -L "{{ flatcar_qemu_image_url }}" -o flatcar_production_qemu_image.img.bz2
    bunzip2 -f flatcar_production_qemu_image.img.bz2
  args:
    creates: "{{ cloud_helper_workdir }}/flatcar/{{ flatcar_qemu_image_name }}"

- name: Convert Flatcar image to qcow2 (if needed)
  become: yes
  become_user: "{{ cloud_helper_user }}"
  shell: |
    set -e
    cd "{{ cloud_helper_workdir }}/flatcar"
    qemu-img convert -f raw -O qcow2 "{{ flatcar_qemu_image_name }}" "{{ flatcar_qemu_qcow2_name }}"
  args:
    creates: "{{ cloud_helper_workdir }}/flatcar/{{ flatcar_qemu_qcow2_name }}"
