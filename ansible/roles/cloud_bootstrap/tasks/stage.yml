- name: Identify latest Flatcar image
  become: no
  ansible.builtin.find:
    paths: "{{ cloud_helper_workdir }}/flatcar"
    patterns: "{{ flatcar_qemu_qcow2_name }}"
  register: flatcar_find

- name: Set latest Flatcar image fact
  ansible.builtin.set_fact:
    latest_flatcar_img: "{{ flatcar_find.files | sort(attribute='mtime') | last }}"
  when: flatcar_find.matched > 0
