---
- name: Ensure ignition output directory exists
  become: false
  file:
    path: "{{ cloud_helper_workdir }}/ignition"
    state: directory
    mode: '0755'

- name: Ensure kubeadm output directory exists
  become: false
  file:
    path: "{{ cloud_helper_workdir }}/kubeadm"
    state: directory
    mode: '0755'

- name: set_new version
  ansible.builtin.set_fact:
    kubernetes_version_tmp: "{{ lookup('env', 'kubetnet_version') | default(kubernetes_version) }}"   
    api_vip_tmp: "{{ lookup('env', 'api_vip') | default(api_vip) }}"
# 1. Render kubeadm config
# -----------------------------
- name: Render kubeadm config for control nodes
  become: false
  template:
    src: "kubeadm-config.yaml.j2"
    dest: "{{ cloud_helper_workdir }}/kubeadm/{{ item }}-kubeadm.yaml"
  loop: "{{ groups['control_nodes'] }}"
  vars:
    hostname: "{{ hostvars[item].hostname }}"
    node_ip: "{{ hostvars[item].node_ip }}"
    api_vip: "{{ api_vip_tmp }}"
    kubernetes_version: "{{ kubernetes_version_tmp }}"

# -----------------------------
# 2. Render Ignition for control nodes
# -----------------------------
- name: Render Ignition for control nodes
  become: false
  template:
    src: "ignition/control-node.ign.j2"
    dest: "{{ cloud_helper_workdir }}/ignition/{{ item }}.ign"
    mode: '0644'
  loop: "{{ groups['control_nodes'] }}"
  vars:
    hostname: "{{ hostvars[item].hostname }}"
    keepalived_vrid: 51
    node_ip: "{{ hostvars[item].node_ip }}"
    provider_ip: "{{ hostvars[item].provider_ip }}"
    provision_ip: "{{ hostvars[item].provision_ip }}"
    keepalived_state: "{{ hostvars[item].keepalived_state }}"
    keepalived_priority: "{{ hostvars[item].keepalived_priority }}"
    kubeadm_config: "{{ lookup('file', cloud_helper_workdir + '/kubeadm/' + item + '-kubeadm.yaml') }}"
    ssh_public_key_path: "{{ lookup('env', 'SSH_PUB_KEY') | default('~/.ssh/id_rsa.pub', true) }}"

# 3. Render Ignition for worker nodes
# -----------------------------
- name: Render Ignition for worker nodes
  become: false
  template:
    src: "ignition/worker-node.ign.j2"
    dest: "{{ cloud_helper_workdir }}/ignition/{{ item }}.ign"
    mode: '0644'
  loop: "{{ groups['worker_nodes'] }}"
  vars:
    hostname: "{{ hostvars[item].hostname }}"
    node_ip: "{{ hostvars[item].node_ip }}"
    provider_ip: "{{ hostvars[item].provider_ip }}"
    provision_ip: "{{ hostvars[item].provision_ip }}"
    ssh_public_key_path: "{{ lookup('env', 'SSH_PUB_KEY') | default('~/.ssh/id_rsa.pub', true) }}"
