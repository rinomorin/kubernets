- name: Copy base image to staging and KVM host
  become: yes
  become_user: "{{ cloud_helper_user }}"
  shell: |
    cp -f {{ latest_fcos_img.path }} {{ cloud_helper_workdir }}/fcos/fcos-base.qcow2
    ssh {{ kvm_host }} "mkdir -p {{ staging_dir }}"
    scp {{ latest_fcos_img.path }} {{ kvm_host }}:{{ staging_dir }}/fcos-base.qcow2
  run_once: true

- name: Transfer ignition files
  become: yes
  become_user: "{{ cloud_helper_user }}"
  shell: |
    scp {{ cloud_helper_workdir }}/ignition/{{ item }}.ign {{ kvm_host }}:{{ staging_dir }}/{{ item }}.ign
  loop: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"
