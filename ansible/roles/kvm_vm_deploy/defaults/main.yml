# roles/vm/defaults/main.yml
vm_host: "{{ lookup('env','VM_HOST') | default(omit, true) }}" #
vm_virt_options: "{{ lookup('env','VM_VIRT_OPTIONS') | default({'name': inventory_hostname.split('.')[0], 'graphics':'none','disk_type':'sata','console':'noautoconsole'}, true) }}"
vm_type: "{{ lookup('env','VM_TYPE') | default('vms', true) }}"
vm_iso: "{{ lookup('env','VM_ISO') | default(omit, true) }}"   # required
vm_osvariant: "{{ lookup('env','VM_OSVARIANT') | default('rock9', true) }}"
vm_platform: "{{ lookup('env','VM_PLATFORM') | default('linux', true) }}"
vm_purpose: "{{ lookup('env','VM_PURPOSE') | default('server', true) }}"
vm_mem: "{{ lookup('env','VM_MEM') | default(4086, true) }}"
vm_cpu: "{{ lookup('env','VM_CPU') | default(2, true) }}"
vm_disk_count: "{{ lookup('env','VM_DISK_COUNT') | default(1, true) }}"
vm_disk_size: "{{ lookup('env','VM_DISK_SIZE') | default(50, true) }}"
vm_network: "{{ lookup('env','VM_NETWORK') | default(['default'], true) }}"
vm_ip: "{{ lookup('env','VM_IP') | default(['dhcp'], true) }}"
vm_mask: "{{ lookup('env','VM_MASK') | default([''], true) }}"
vm_gate: "{{ lookup('env','VM_GATE') | default([''], true) }}"
vm_domain: "{{ lookup('env','VM_DOMAIN') | default(['example.com'], true) }}"
vm_segment: "{{ lookup('env','VM_SEGMENT') | default([''], true) }}"
os_user: "{{ lookup('env','OS_USER') | default(['sysadmin','secops'], true) }}"
os_passwd: "{{ lookup('env','OS_PASSWD') | default(['randomg','ramdom'], true) }}"
os_secure: "{{ lookup('env','OS_SECURE') | default(['default'], true) }}"

# default stages
build_loops: "{{ bl|default(120)}}"
existing_vms: false
kvm_delegate: "{{ kvm_name | default((kvm | default(['kvmdc01.morinsoft.ca']))[0]) }}"
vm_build_stage: "unknown"
vm_build_state: "undefined"
vm_timeout: 0

# default system info
vcpu: 2
ram: 4096
iso: "/var/lib/libvirt/images/Rocky-9.6-x86_64-boot.iso"
# iso: "/var/lib/libvirt/images/Rocky-9.6-x86_64-dvd.iso"
default_network: "default"
os_variant: "rocky9"
shutdown_max_timeout: 1800

# default IDs
default_secops_id: "{{ lookup('vars', 'secops_id') | default('secops', true) }}"
default_secops_pwd: "{{ secops_pwd }}"
default_ansible_id: "secops"
default_ansible_pwd: "{{ lookup('env', 'secops_pwd') }}"
secops_id: "{{ default_secops_id }}"
secops_pwd: "{{ secops_pwd }}"
admin_id: "{{ lookup('env', 'admin_id') }}"
admin_set: "{{ lookup('env', 'admin_set') }}"
default_user_passwords: >-
  {{
    {
      (default_secops_id | default('secops')): default_secops_pwd,
      (default_ansible_id | default('awx_automate')): default_ansible_pwd,
      (admin_id | default('sysadmin')): admin_set
    }
  }}


# groups we put sysadmin in temporory for setup
sa_group: "sysadmin"
secure_group: "{{ default_secops_id| default('secops') }}"
awx_group: "awx_automate"
sa_group_members: "{{ [admin_id | default('sysadmin')] }}"
secure_group_members: "{{ [secure_group | default('secops')] }}"
awx_group_members: ["secops","sysadmin"]


members_map: >-
  {{
    {
      sa_group: sa_group_members,
      secure_group: secure_group_members,
      awx_group: awx_group_members
    }
  }}
  


account_name2: "{{ account_name | default('MorinSoft')}}"
ACCOUNT: "{{ account_name2 }}"

sa_templates:
  - "010_STD_ALIAS_DFLT"
  - "010_STD_NEG_DFLT"
  - "010_STD_SA_DFLT"

secure_templates:
  - "123_AE_ACCOUNT_DFLT"

awx_templates:
  - "124_AWX_ACCOUNT_DFLT"


# group list for validation
default_groups: [ "{{ sa_group }}", "{{ secure_group }}", "{{ awx_group }}" ]
resolved_sa_group: "{{ sa_group | default('sysadmin') }}"
resolved_secure_group: "{{ secure_group | default(default_secops_id) }}"
resolved_awx_group: "{{ awx_group | default(default_ansible_id) }}"

template_map: >-
  {{
    {
      resolved_sa_group: sa_templates,
      resolved_secure_group: secure_templates,
      resolved_awx_group: awx_templates
    }
  }}

