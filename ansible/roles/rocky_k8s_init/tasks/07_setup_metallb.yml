---
- name: Allow MetalLB Memberlist traffic
  delegate_to: localhost
  vars:
    ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o LogLevel=ERROR -i {{ ssh_key_path }}"
  shell: |
    ssh {{ ssh_opts }} core@{{ hostvars[item].provision_ip }} "
      sudo firewall-cmd --zone=public --add-port=7946/udp --permanent;
      sudo firewall-cmd --zone=public --add-port=7946/tcp --permanent;
      sudo firewall-cmd --reload"
  loop: "{{ groups['cluster_nodes'] }}"
  run_once: true

- name: 7.1 - Enable Strict ARP in Kube-Proxy (Required for MetalLB)
  shell: |
    kubectl get configmap kube-proxy -n kube-system -o yaml | \
    sed 's/strictARP: false/strictARP: true/' | \
    kubectl apply -f - -n kube-system
  delegate_to: localhost
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- name: 7.2 - Install MetalLB Manifests
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"
  command: "kubectl apply -f {{ item }} --validate=false"
  loop:
    - https://raw.githubusercontent.com/metallb/metallb/v0.14.3/config/manifests/metallb-native.yaml
  delegate_to: localhost

- name: 7.2b - Give the API a moment to breathe
  pause:
    seconds: 10

- name: 7.3 - Wait for MetalLB Controller to exist and be Ready
  shell: "kubectl get pods -n metallb-system -l app=metallb,component=controller -o jsonpath='{.items[0].status.phase}'"
  register: mlb_check
  until: mlb_check.stdout == "Running"
  retries: 20
  delay: 10
  delegate_to: localhost
  failed_when: false # Prevents crashing if the pod isn't created in the first 1 second
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- debug:
    msg: "MetalLB_vip {{ metallb_vip }}"

- name: 7.4 - Configure MetalLB IP Pool and L2 Advertisement
  shell: |
    cat <<EOF | kubectl apply -f -
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: first-pool
      namespace: metallb-system
    spec:
      addresses:
      - {{ metallb_vip }}-{{ metallb_vip }}
    ---
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: example-ad
      namespace: metallb-system
    spec:
      ipAddressPools:
      - first-pool
    EOF
  delegate_to: localhost
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- name: 7.5 - Expose Nginx Smoke Test via MetalLB
  shell: |
    cat <<EOF | kubectl apply -f -
    apiVersion: v1
    kind: Service
    metadata:
      name: nginx-lb
    spec:
      selector:
        app: nginx
      ports:
        - protocol: TCP
          port: 80
          targetPort: 80
      type: LoadBalancer
      loadBalancerIP: {{ metallb_vip }}
    EOF
  delegate_to: localhost
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"