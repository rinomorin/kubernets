- name: 6.1.0 - Check if Ingress Controller Namespace exists
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ ansible_user_id }}/.kube/config"
  ansible.builtin.shell: |
    kubectl get namespace ingress-nginx --no-headers
  register: ingress_ns_check
  failed_when: false
  changed_when: false

- name: Setup kubeconfig for core user
  become: yes
  block:
    - name: Create .kube directory
      shell: |
        mkdir -p /home/core/.kube
        chown core:core /home/core/.kube
        chmod 750 /home/core/.kube

    - name: Copy admin.conf to user home
      shell: |
        sudo cp -f /etc/kubernetes/admin.conf /home/core/.kube/config
        sudo chown core:core /home/core/.kube/config
        sudo chmod 600 /home/core/.kube/config  

  when: "'control_nodes' in group_names"

- name: 6.1.1 - Deploy NGINX Ingress Controller
  shell: |
    kubectl apply --validate=false -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/baremetal/deploy.yaml
  run_once: true
  delegate_to: localhost
  environment:
    KUBECONFIG: "/home/core/.kube/config" 
  register: ingress_result
  until: ingress_result.rc == 0
  retries: 5
  delay: 15


- name: 6.1.2 - Ensure MetalLB Pool is expanded and advertised
  run_once: true
  delegate_to: localhost
  environment:
    KUBECONFIG: "/home/core/.kube/config"
  shell: |
    # 1. Patch the existing pool to the full range
    kubectl patch ipaddresspool first-pool -n metallb-system --type merge \
      -p '{"spec":{"addresses":["10.0.0.200-10.0.0.210"]}}'
    
    # 2. Ensure the L2 Advertisement exists for this pool
    cat <<EOF | kubectl apply -f -
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: {{ c_zone.split('.')[-2] }}-l2-ad
      namespace: metallb-system
    spec:
      ipAddressPools:
      - first-pool
    EOF
  register: metallb_fix
  failed_when: 
    - metallb_fix.rc != 0 
    - "'not found' not in metallb_fix.stderr" # Don't fail if we need to create it instead

- name: 6.1.3 - Remove Squatter Services & Configure Controller
  run_once: true
  delegate_to: localhost
  environment:
    KUBECONFIG: "/home/core/.kube/config"
  shell: |
    # Remove the conflicting nginx-lb service if it exists
    kubectl delete svc nginx-lb -n default --ignore-not-found
    
    # Enable Proxy Protocol (Fixed quotes and brackets)
    kubectl patch configmap ingress-nginx-controller -n ingress-nginx --type merge \
      -p "{\"data\":{\"use-proxy-protocol\":\"true\",\"real-ip-header\":\"proxy_protocol\",\"set-real-ip-from\":\"{{ (ingress_vip.split('.')[:3] | join('.')) }}.0/24\"}}"
    
    # Bind Controller to VIP
    kubectl patch svc ingress-nginx-controller -n ingress-nginx \
      -p '{"spec":{"type":"LoadBalancer","loadBalancerIP":"10.0.0.200","externalTrafficPolicy":"Local"}}'

- name: 6.1.4 - Restart Controller and Deploy Test Application
  run_once: true
  delegate_to: localhost
  environment:
    KUBECONFIG: "/home/core/.kube/config"
  shell: |
    # Restart to pick up Proxy Protocol
    kubectl rollout restart deployment ingress-nginx-controller -n ingress-nginx
    kubectl rollout status deployment ingress-nginx-controller -n ingress-nginx
    
    # Deploy Test App (The "Home" for the traffic)
    kubectl create deployment nginx-stable --image=nginx -n default --dry-run=client -o yaml | kubectl apply -f -
    kubectl expose deployment nginx-stable --name=nginx-svc --port=80 -n default --dry-run=client -o yaml | kubectl apply -f -
    
    # Deploy the Routing (The Ingress)
    cat <<EOF | kubectl apply -f -
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: {{ c_zone.split('.')[-2] }}-ingress
      namespace: default
    spec:
      ingressClassName: nginx
      tls:
      - hosts:
        - nginx.{{ c_zone }}
        secretName: {{ c_zone.split('.')[-2] }}-tls-cert
      rules:
      - host: "nginx.{{ c_zone}}"
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-svc
                port:
                  number: 80
    EOF

- name: 6.1.5 - Final Connectivity Check
  run_once: true
  delegate_to: localhost
  ansible.builtin.shell: "curl -kI https://nginx.{{ c_zone }}"
  register: final_curl
  retries: 5
  delay: 5
  until: "'200' in final_curl.stdout"

