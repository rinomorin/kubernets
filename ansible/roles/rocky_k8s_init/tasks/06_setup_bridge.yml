      - "STAGE 1 COMPLETE: HTTPS INGRESS & PROXY PROTOCOL ACTIVE"
      - "---------------------------------------------------------------"
      - "VIP Address: 10.0.0.200"
      - "External URL: https://nginx.{{ cloud_zone }}"
      - "HAProxy Config: Must use 'send-proxy-v2' on port 443"
      - ""
      - "DEPLOYMENT TEMPLATE (HTTPS):"
      - "apiVersion: networking.k8s.io/v1"
      - "kind: Ingress"
