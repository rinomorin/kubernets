- name: 6.1.0 - Check if Ingress Controller Namespace exists
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ ansible_user_id }}/.kube/config"
  ansible.builtin.shell: |
    kubectl get namespace ingress-nginx --no-headers
  register: ingress_ns_check
  failed_when: false
  changed_when: false

- name: Setup kubeconfig for core user
  become: yes
  block:
    - name: Create .kube directory
      shell: |
        mkdir -p /home/core/.kube
        chown core:core /home/core/.kube
        chmod 750 /home/core/.kube

    - name: Copy admin.conf to user home
      shell: |
        sudo cp -f /etc/kubernetes/admin.conf /home/core/.kube/config
        sudo chown core:core /home/core/.kube/config
        sudo chmod 600 /home/core/.kube/config  

  when: "'control_nodes' in group_names"

- name: 6.1.1 - Deploy NGINX Ingress Controller
  shell: |
    kubectl apply --validate=false -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/baremetal/deploy.yaml
  run_once: true
  delegate_to: msrlv9mast01
  environment:
    KUBECONFIG: "/home/core/.kube/config" 
  register: ingress_result
  until: ingress_result.rc == 0
  retries: 5
  delay: 15


- name: 6.1.2 - Ensure MetalLB Pool is expanded and advertised
  run_once: true
  delegate_to: msrlv9mast01
  environment:
    KUBECONFIG: "/home/core/.kube/config"
  shell: |
    # 1. Patch the existing pool to the full range
    kubectl patch ipaddresspool first-pool -n metallb-system --type merge \
      -p '{"spec":{"addresses":["10.0.0.200-10.0.0.210"]}}'
    
    # 2. Ensure the L2 Advertisement exists for this pool
    cat <<EOF | kubectl apply -f -
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: morinsoft-l2-ad
      namespace: metallb-system
    spec:
      ipAddressPools:
      - first-pool
    EOF
  register: metallb_fix
  failed_when: 
    - metallb_fix.rc != 0 
    - "'not found' not in metallb_fix.stderr" # Don't fail if we need to create it instead

- name: 6.1.3 - Clean up conflicting services (Squatters)
  run_once: true
  delegate_to: msrlv9mast01
  environment:
    KUBECONFIG: "/home/core/.kube/config"
  shell: "kubectl delete svc nginx-lb -n default --ignore-not-found"

- name: 6.1.4 - Patch NGINX ConfigMap for Proxy Protocol
  run_once: true
  delegate_to: msrlv9mast01
  environment:
    KUBECONFIG: "/home/core/.kube/config"
  shell: |
    kubectl patch configmap ingress-nginx-controller -n ingress-nginx --type merge \
    -p '{"data":{"use-proxy-protocol":"true","real-ip-header":"proxy_protocol","set-real-ip-from":"192.168.100.0/24"}}'

- name: 6.1.5 - Bind Ingress Controller to VIP 10.0.0.200
  run_once: true
  delegate_to: msrlv9mast01
  environment:
    KUBECONFIG: "/home/core/.kube/config"
  shell: |
    kubectl patch svc ingress-nginx-controller -n ingress-nginx \
    -p '{"spec":{"type":"LoadBalancer","loadBalancerIP":"10.0.0.200","externalTrafficPolicy":"Local"}}'

- name: 6.1.6 - Restart NGINX to apply Proxy Protocol settings
  run_once: true
  delegate_to: msrlv9mast01
  environment:
    KUBECONFIG: "/home/core/.kube/config"
  shell: |
    kubectl rollout restart deployment ingress-nginx-controller -n ingress-nginx
    kubectl rollout status deployment ingress-nginx-controller -n ingress-nginx

- name: 6.1.7 - Ingress Deployment Summary
  run_once: true
  delegate_to: localhost
  ansible.builtin.debug:
    msg: 
      - "---------------------------------------------------------------"
      - "STAGE 1 COMPLETE: HTTPS INGRESS & PROXY PROTOCOL ACTIVE"
      - "---------------------------------------------------------------"
      - "VIP Address: 10.0.0.200"
      - "External URL: https://nginx.{{ cloud_zone }}"
      - "HAProxy Config: Must use 'send-proxy-v2' on port 443"
      - ""
      - "DEPLOYMENT TEMPLATE (HTTPS):"
      - "apiVersion: networking.k8s.io/v1"
      - "kind: Ingress"
      - "metadata:"
      - "  name: [app-name]-ingress"
      - "spec:"
      - "  ingressClassName: nginx"
      - "  tls:"
      - "  - hosts: ['nginx.{{ cloud_zone }}']"
      - "    secretName: morinsoft-tls-cert"
      - "  rules:"
      - "  - host: 'nginx.{{ cloud_zone }}'"
      - "    http:"
      - "      paths:"
      - "      - path: /"
      - "        pathType: Prefix"
      - "        backend:"
      - "          service:"
      - "            name: [service-name]"
      - "            port:"
      - "              number: 80"
      - "---------------------------------------------------------------"