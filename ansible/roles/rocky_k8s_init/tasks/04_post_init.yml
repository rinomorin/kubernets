# 1. Pull directly to the final destination
# 1. Fetch the config
- name: 4.1 - Fetch admin.conf to local kubeconfig
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ lookup('env', 'USER') }}/.kube/config"
    flat: yes
  when: inventory_hostname == groups['control_nodes'][0]

# 2. Fix permissions locally
- name: 4.2 - Fix local kubeconfig permissions
  delegate_to: localhost
  run_once: true
  file:
    path: "/home/{{ lookup('env', 'USER') }}/.kube/config"
    owner: "{{ lookup('env', 'USER') }}"
    mode: '0600'
    state: file

- name: 4.2.5 - Give the Cluster 6 minutes to finish its morning coffee
  pause:
    minutes: 6
  run_once: true

- name: 4.3 - Apply Flannel Pod Network (Validated)
  command: "kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"
  delegate_to: localhost
  run_once: true
  register: flannel_apply
  until: flannel_apply.rc == 0
  retries: 5
  delay: 10

- name: 4.4 - Verify Nodes are transitioning to Ready
  delegate_to: localhost
  run_once: true
  shell: "kubectl get nodes"
  register: final_nodes
  changed_when: false

- name: 4.5 - Show Cluster Status
  debug:
    var: nodes_ready.stdout_lines
  run_once: true

