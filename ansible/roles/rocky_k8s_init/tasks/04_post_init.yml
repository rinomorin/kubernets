# 1. Pull directly to the final destination
# 1. Fetch the config
- name: 4.1 - Fetch admin.conf to local kubeconfig
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ lookup('env', 'USER') }}/.kube/config"
    flat: yes
  when: inventory_hostname == groups['control_nodes'][0]

# 2. Fix permissions locally
- name: 4.2 - Fix local kubeconfig permissions
  delegate_to: localhost
  run_once: true
  file:
    path: "/home/{{ lookup('env', 'USER') }}/.kube/config"
    owner: "{{ lookup('env', 'USER') }}"
    mode: '0600'
    state: file

- name: 4.3 - Apply Flannel Pod Network (The 'Enabler')
  command: >
    kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml 
    --validate=false
  delegate_to: localhost
  run_once: true
  register: flannel_result
  until: flannel_result.rc == 0
  retries: 15
  delay: 10

# 2. Now verify that the cluster is actually healthy
- name: 4.4 - Verify Cluster Health
  delegate_to: localhost
  run_once: true
  shell: "kubectl get --raw '/healthz'"
  register: health_check
  until: health_check.stdout == "ok"
  retries: 20
  delay: 10
- name: 4.5 - Show Cluster Status
  debug:
    var: nodes_ready.stdout_lines
  run_once: true

# 5. Apply Flannel CNI to allow Nodes to reach 'Ready' state
- name: 4.6 - Apply Flannel Pod Network
  command: "kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"
  delegate_to: helper
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

# 6. Wait for Nodes to transition to 'Ready'
- name: 4.7 - Wait for all nodes to be Ready
  shell: "kubectl get nodes | grep -v STATUS | grep -v 'NotReady' | wc -l"
  delegate_to: helper
  register: ready_count
  until: ready_count.stdout | trim | int == (groups['cluster_nodes'] | length - 1) 
  retries: 24
  delay: 10
  run_once: true
  # Note: we subtract 1 from the group length because 'helper' is in 'cluster_nodes' 
  # but is not a K8s node.