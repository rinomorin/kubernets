- name: 5.0 - Ensure KUBECONFIG is present on localhost
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: yes
  delegate_to: "{{ groups['control_nodes'][0] }}"

- name: 5.1 - Deploy Nginx Smoke Test
  command: "kubectl apply -f https://k8s.io/examples/controllers/nginx-deployment.yaml --validate=false"
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- name: 5.1.5 - Wait for Deployment API to be recognized
  shell: "kubectl get deployment nginx-deployment"
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"
  register: deploy_check
  until: deploy_check.rc == 0
  retries: 20
  delay: 10

- name: 5.2 - Scale Deployment
  command: "kubectl scale deployment nginx-deployment --replicas=2"
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- name: 5.3 - Wait for Nginx Pods to reach Running
  shell: "kubectl get pods -l app=nginx -o jsonpath='{.items[?(@.status.phase==\"Running\")].metadata.name}' | wc -w"
  delegate_to: localhost
  register: pod_count
  until: pod_count.stdout | trim | int == 2
  retries: 30
  delay: 10
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- name: Ensure IP Forwarding is enabled in the kernel
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-k8s-networking.conf
    reload: yes
  loop:
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }

- name: Open Firewall for CNI Traffic
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
  loop:
    - 8472/udp   # Flannel VXLAN
    - 4789/udp   # Calico VXLAN / Geneve
    - 179/tcp    # Calico BGP
    - 10250/tcp  # Kubelet API
    - 6443/tcp   # API Server (on Masters)

- name: Reload Firewalld to apply changes
  service:
    name: firewalld
    state: reloaded

- name: Restart CNI Pods to force re-peering
  shell: |
    kubectl delete pods -n kube-system -l k8s-app=flannel --force --grace-period=0 || \
    kubectl delete pods -n kube-system -l k8s-app=calico-node --force --grace-period=0
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  ignore_errors: true

- name: "5.4 - Verify Pod Networking (The Black Hole Test)"
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"
  shell: |
    {% raw %}
    # 1. Get the first pod name
    FIRST_POD=$(kubectl get pods -l app=nginx -o jsonpath='{.items[0].metadata.name}' --ignore-not-found)
    
    # 2. Get the last pod IP (the target)
    LAST_IP=$(kubectl get pods -l app=nginx -o jsonpath='{.items[-1].status.podIP}' --ignore-not-found)
    
    if [ -n "$FIRST_POD" ] && [ -n "$LAST_IP" ]; then
      echo "Testing Connectivity: $FIRST_POD -> http://$LAST_IP:80"
      
      # Use curl instead of ping. Nginx images almost always have curl or we use stdout check.
      # --connect-timeout 2 ensures we don't hang forever if there's a black hole.
      kubectl exec "$FIRST_POD" -- curl -s --connect-timeout 2 "http://$LAST_IP" > /dev/null
    else
      echo "Failed to retrieve Pod information."
      exit 1
    fi
    {% endraw %}
  delegate_to: localhost
  register: networking_test
  retries: 3
  delay: 5
  until: networking_test.rc == 0
  run_once: true