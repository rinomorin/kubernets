- name: 5.0 - Ensure KUBECONFIG is present on localhost
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: yes
  delegate_to: "{{ groups['control_nodes'][0] }}"

- name: 5.1 - Deploy Nginx Smoke Test
  command: "kubectl apply -f https://k8s.io/examples/controllers/nginx-deployment.yaml --validate=false"
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- name: 5.1.5 - Wait for Deployment API to be recognized
  shell: "kubectl get deployment nginx-deployment"
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"
  register: deploy_check
  until: deploy_check.rc == 0
  retries: 20
  delay: 10

- name: 5.2 - Scale Deployment
  command: "kubectl scale deployment nginx-deployment --replicas=2"
  delegate_to: localhost
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- name: 5.3 - Wait for Nginx Pods to reach Running
  shell: "kubectl get pods -l app=nginx -o jsonpath='{.items[?(@.status.phase==\"Running\")].metadata.name}' | wc -w"
  delegate_to: localhost
  register: pod_count
  until: pod_count.stdout | trim | int == 2
  retries: 30
  delay: 10
  run_once: true
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"

- name: "5.4 - Verify Pod Networking (The Black Hole Test)"
  environment:
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"
  shell: |
    {% raw %}
    # Set KUBECONFIG if it's not in the default location
    export KUBECONFIG=~/.kube/config 

    # 1. Wait for API to be stable
    until kubectl get nodes &> /dev/null; do
      echo "Waiting for API Server to respond via VIP..."
      sleep 2
    done

    # 2. Get Pod info with explicit namespace if needed
    FIRST_POD=$(kubectl get pods -l app=nginx -o jsonpath='{.items[0].metadata.name}' --ignore-not-found)
    LAST_IP=$(kubectl get pods -l app=nginx -o jsonpath='{.items[-1].status.podIP}' --ignore-not-found)

    if [ -z "$FIRST_POD" ] || [ -z "$LAST_IP" ]; then
      echo "DEBUG: API is up but Pods are not found or not assigned IPs yet."
      kubectl get pods -o wide
      exit 1
    fi

    # 3. Execute the ping test
    kubectl exec "$FIRST_POD" -- ping -c 2 "$LAST_IP"
    {% endraw %}
  delegate_to: localhost
  register: ping_test
  retries: 5
  delay: 10
  until: ping_test.rc == 0
  run_once: true