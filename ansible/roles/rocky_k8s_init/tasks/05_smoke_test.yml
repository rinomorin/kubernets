- name: 5.0 - Ensure KUBECONFIG is present on localhost
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: yes
  delegate_to: "{{ groups['control_nodes'][0] }}"

- name: 5.1 - Deploy Nginx Smoke Test
  command: "kubectl apply -f https://k8s.io/examples/controllers/nginx-deployment.yaml --validate=false"
  delegate_to: localhost
  run_once: true
  environment:
    # Force it to use the exact config we fetched and fixed permissions for
    KUBECONFIG: "/home/{{ lookup('env', 'USER') }}/.kube/config"
  register: nginx_deploy
  until: nginx_deploy.rc == 0
  retries: 5
  delay: 15

- name: 5.2 - Scale Deployment
  command: "kubectl scale deployment nginx-deployment --replicas={{ groups['worker_nodes'] | length }}"
  delegate_to: localhost
  run_once: true

- name: 5.3 - Wait for Nginx Pods
  # Using jsonpath is more reliable than grep/wc
  shell: "kubectl get pods -l app=nginx -o jsonpath='{.items[?(@.status.phase==\"Running\")].metadata.name}' | wc -w"
  delegate_to: localhost
  register: pod_count
  until: pod_count.stdout | trim | int == (groups['worker_nodes'] | length)
  retries: 20
  delay: 10
  run_once: true

- name: "5.4 - Verify Pod Networking (The Black Hole Test)"
  shell: |
    {% raw %}
    # 1. Get the first pod name
    FIRST_POD=$(kubectl get pods -l app=nginx -o jsonpath='{.items[0].metadata.name}')
    
    # 2. Get the last pod IP
    LAST_IP=$(kubectl get pods -l app=nginx -o jsonpath='{.items[-1].status.podIP}')
    
    # 3. Execute the ping test
    if [ -n "$FIRST_POD" ] && [ -n "$LAST_IP" ]; then
      kubectl exec "$FIRST_POD" -- ping -c 2 "$LAST_IP"
    else
      echo "Failed to retrieve Pod information"
      exit 1
    fi
    {% endraw %}
  delegate_to: localhost
  register: ping_test
  run_once: true