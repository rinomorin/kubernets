- name: Fetch Kubeconfig from Primary Master
  fetch:
    src: /etc/kubernetes/admin.conf
    dest: /tmp/admin.conf
    flat: yes
  delegate_to: "{{ groups['control_nodes'][0] }}"
  run_once: true

- name: Distribute Kubeconfig to all nodes
  copy:
    src: /tmp/admin.conf
    dest: "{{ item }}"
    owner: core
    group: core
    mode: '0600'
  loop:
    - /etc/kubernetes/admin.conf
    - /home/core/.kube/config
  become: yes

- name: Configure Firewalld for Kubernetes Networking
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ item }}"
    state: enabled
    permanent: yes
    immediate: yes
  loop:
    - enp2s0
    - flannel.1
    - cni0

- name: Allow intra-zone forwarding in trusted zone (Permanent)
  ansible.posix.firewalld:
    zone: trusted
    target: ACCEPT
    permanent: yes
    state: enabled

- name: Reload firewalld to apply zone target changes
  service:
    name: firewalld
    state: reloaded

- name: Enable Masquerading for Pod Network
  ansible.posix.firewalld:
    masquerade: yes
    state: enabled
    permanent: yes
    immediate: yes

- name: Set Bridge and Routing Sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.ipv4.conf.all.rp_filter', value: '2' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '2' }

- name: Post-Bootstrap Kubeconfig Distribution
  hosts: all
  become: yes
  tasks:
    - name: Ensure .kube directory exists for core user
      file:
        path: /home/core/.kube
        state: directory
        owner: core
        group: core
        mode: '0755'

    - name: Copy admin.conf to core user's home (On Master 01)
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/core/.kube/config
        remote_src: yes
        owner: core
        group: core
        mode: '0600'
      when: inventory_hostname == 'msrlv9mast01'

    - name: Fetch config to Helper
      fetch:
        src: /etc/kubernetes/admin.conf
        dest: /tmp/kube_admin.conf
        flat: yes
      when: inventory_hostname == 'msrlv9mast01'

    - name: Distribute config to Workers and Secondary Masters
      copy:
        src: /tmp/kube_admin.conf
        dest: /home/core/.kube/config
        owner: core
        group: core
        mode: '0600'
      when: inventory_hostname != 'msrlv9mast01'