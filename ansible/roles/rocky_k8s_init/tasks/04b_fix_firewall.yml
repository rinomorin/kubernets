---
- name: Fix HAProxy routing priority for external traffic
  become: true
  delegate_to: "{{ item }}"
  run_once: true
  loop: "{{ groups['hahost'] }}"
  vars:
    # Gets 192.168.100.21
    current_lb_ip: "{{ hostvars[item].ansible_host }}"
    # Splits to ['192','168','100','21'], takes first 3, joins them, adds .1
    current_lb_gw: "{{ hostvars[item].ansible_host.split('.')[0:3] | join('.') }}.1"
  ansible.builtin.shell: |
    nmcli connection modify enp3s0 ipv4.routes "{{ current_lb_ip }}/24 {{ current_lb_gw }} 50"
    nmcli connection up enp3s0
  when: groups['hahost'] is defined

- name: Configure Firewalld for Kubernetes Networking
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ item }}"
    state: enabled
    permanent: yes
    immediate: yes
  loop:
    - enp2s0
    - flannel.1
    - cni0

- name: Allow intra-zone forwarding in trusted zone (Permanent)
  ansible.posix.firewalld:
    zone: trusted
    target: ACCEPT
    permanent: yes
    state: enabled

- name: Reload firewalld to apply zone target changes
  service:
    name: firewalld
    state: reloaded

- name: Enable Masquerading for Pod Network
  ansible.posix.firewalld:
    masquerade: yes
    state: enabled
    permanent: yes
    immediate: yes

- name: Set Bridge and Routing Sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.ipv4.conf.all.rp_filter', value: '2' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '2' }


