---
- name: Fix HAProxy routing priority for external traffic
  become: true
  # This tells the current host (Master) to run this command ON the LB nodes
  delegate_to: "{{ item }}"
  ansible.builtin.shell: |
    # Calculate gateway from the looped host's IP
    LB_IP="{{ hostvars[item].ansible_host }}"
    GATEWAY="$(echo $LB_IP | cut -d'.' -f1-3).1"
    
    nmcli connection modify enp3s0 ipv4.routes "$LB_IP/24 $GATEWAY 50"
    nmcli connection up enp3s0
  loop: "{{ groups['hahost'] }}"
  # We only need one Master to perform this delegation once for all LBs
  run_once: true
  # Ensure we have hostvars for the LBs
  when: groups['hahost'] is defined

- name: Configure Firewalld for Kubernetes Networking
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ item }}"
    state: enabled
    permanent: yes
    immediate: yes
  loop:
    - enp2s0
    - flannel.1
    - cni0

- name: Allow intra-zone forwarding in trusted zone (Permanent)
  ansible.posix.firewalld:
    zone: trusted
    target: ACCEPT
    permanent: yes
    state: enabled

- name: Reload firewalld to apply zone target changes
  service:
    name: firewalld
    state: reloaded

- name: Enable Masquerading for Pod Network
  ansible.posix.firewalld:
    masquerade: yes
    state: enabled
    permanent: yes
    immediate: yes

- name: Set Bridge and Routing Sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.ipv4.conf.all.rp_filter', value: '2' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '2' }


