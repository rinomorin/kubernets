
- name: Fix HAProxy routing priority for external traffic
  ansible.builtin.shell: |
    # Derive gateway from the first 3 octets of the current host's IP
    {% set ip_parts = ansible_host.split('.') %}
    {% set dynamic_gw = ip_parts[0] + '.' + ip_parts[1] + '.' + ip_parts[2] + '.1' %}
    
    sudo nmcli connection modify enp3s0 ipv4.routes "{{ ansible_host }}/24 {{ dynamic_gw }} 50"
    sudo nmcli connection up enp3s0
  # This ensures it ONLY runs on your HAProxy nodes
  when: inventory_hostname in groups['hahost']

- name: Configure Firewalld for Kubernetes Networking
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ item }}"
    state: enabled
    permanent: yes
    immediate: yes
  loop:
    - enp2s0
    - flannel.1
    - cni0

- name: Allow intra-zone forwarding in trusted zone (Permanent)
  ansible.posix.firewalld:
    zone: trusted
    target: ACCEPT
    permanent: yes
    state: enabled

- name: Reload firewalld to apply zone target changes
  service:
    name: firewalld
    state: reloaded

- name: Enable Masquerading for Pod Network
  ansible.posix.firewalld:
    masquerade: yes
    state: enabled
    permanent: yes
    immediate: yes

- name: Set Bridge and Routing Sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.ipv4.conf.all.rp_filter', value: '2' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '2' }


