- name: Initialize master node via kubeadm
  delegate_to: "{{ cloud_master }}"
  command: kubeadm init --cri-socket=/var/run/crio/crio.sock --apiserver-advertise-address=192.168.100.30
  register: kubeadm_init
  when: "{{ groups['control_nodes'][0] }}"

- name: Extract join command
  delegate_to: "{{ cloud_master }}"
  command: kubeadm token create --print-join-command
  register: join_cmd

- name: Save join command for workers
  set_fact:
    kubeadm_join: "{{ join_cmd.stdout }}"

- name: Run kubeadm join
  command: "{{ hostvars['helper']['kubeadm_join'] }}"