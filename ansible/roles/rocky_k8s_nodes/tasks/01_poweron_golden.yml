- name: 1.1 - Ensure golden-base is running
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if ! sudo virsh list --name | grep -q "^golden-base$"; then
      sudo virsh start golden-base
    else
      echo "Already running"
    fi
  register: start_vm
  changed_when: "'Already running' not in start_vm.stdout"

- name: 1.2 - Wait for VM state to reach 'running'
  delegate_to: "{{ VM_HOST_IP }}"
  shell: "sudo virsh domstate golden-base"
  register: vm_state
  until: vm_state.stdout == "running"
  retries: 15
  delay: 5
  changed_when: false

- name: 1.3 - Get golden-base Maintenance IP (br-nat)
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    # Get MAC specifically for the br-nat interface
    MAC=$(sudo virsh domiflist golden-base | grep 'br-nat' | awk '{print $5}')
    # Get Lease
    sudo virsh net-dhcp-leases br-nat | grep "$MAC" | awk '{print $5}' | cut -d/ -f1
  register: gold_ip_raw
  until: gold_ip_raw.stdout != ""
  retries: 12
  delay: 10

- name: 1.4 - Set Golden IP Fact
  set_fact:
    golden_ip: "{{ gold_ip_raw.stdout | trim }}"

- name: 1.5 - Wait for SSH availability (Local Probe)
  delegate_to: localhost
  wait_for:
    host: "{{ golden_ip }}"
    port: 22
    state: started
    delay: 5
    timeout: 300