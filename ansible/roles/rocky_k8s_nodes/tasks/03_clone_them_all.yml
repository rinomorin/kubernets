---
# ============================================================
# 3.1 - Seal the Silver Image (Lead Master)
# ============================================================
- name: 3.1.1 - Power off msrlv9mast01 for cloning
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if sudo virsh list --all | grep -q "msrlv9mast01"; then
      sudo virsh destroy msrlv9mast01 || true
      # Wait for state to settle
      for i in {1..15}; do
        STATE=$(sudo virsh domstate msrlv9mast01)
        if [ "$STATE" == "shut off" ]; then
          exit 0
        fi
        sleep 2
      done
    fi
  changed_when: true

# ============================================================
# 3.2 - Clone to the remaining cluster nodes
# ============================================================
- name: 3.2.1 - Clone Remaining Nodes from Silver Image
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-clone --original msrlv9mast01 
    --name {{ item.split('.')[0] }} 
    --file /var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - item != 'msrlv9mast01'
  args:
    creates: "/var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2"

- name: 3.2.2 - Power On All Nodes
  delegate_to: "{{ VM_HOST_IP }}"
  shell: "sudo virsh start {{ item.split('.')[0] }}"
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'
  ignore_errors: true

# ============================================================
# 3.3 - Discovery & FQDN Identity
# ============================================================
- name: 3.3.1 - Discover Maintenance Tunnel IPs
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    VM="{{ item.split('.')[0] }}"
    N_MAC=$(sudo virsh domiflist $VM | grep 'br-nat' | awk '{print $5}')
    sudo virsh net-dhcp-leases br-nat | grep "$N_MAC" | awk '{print $5}' | cut -d/ -f1
  register: m_tunnel_ips
  until: m_tunnel_ips.stdout != ""
  retries: 20
  delay: 10
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'

- name: 3.3.2.1 - Set FQDN Hostname
  delegate_to: localhost
  become: false  # Ensure we use the 'cloud_helper' user's SSH keys
  vars:
    m_ip: "{{ (m_tunnel_ips.results | selectattr('item', 'equalto', item) | first).stdout | trim }}"
    fqdn: "{{ item.split('.')[0] }}.{{ c_zone }}"
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
    core@{{ m_ip }} "sudo hostnamectl set-hostname {{ fqdn }}"
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'

- name: 3.3.2.2 - Configure Cluster IP (br-cluster)
  delegate_to: localhost
  become: false
  vars:
    m_ip: "{{ (m_tunnel_ips.results | selectattr('item', 'equalto', item) | first).stdout | trim }}"
    c_mac: "{{ (net_map.results | selectattr('item', 'equalto', item) | first).stdout | regex_search('C_MAC=([0-9a-fA-F:]+)', '\\1') | first }}"
    node_ip: "{{ hostvars[item].node_ip }}"
  shell: |
    # Find the device name (e.g., enp2s0) inside the VM using the MAC
    C_DEV=$(ssh -o StrictHostKeyChecking=no core@{{ m_ip }} "ip -o link show | grep -i '{{ c_mac }}' | awk '{print \$2}' | sed 's/://'")
    
    # Apply static IP via nmcli
    ssh -o StrictHostKeyChecking=no core@{{ m_ip }} "sudo nmcli con add type ethernet con-name cluster-net ifname $C_DEV ipv4.method manual ipv4.addresses {{ node_ip }}/24 connection.autoconnect yes && sudo nmcli con up cluster-net"
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'

- name: 3.3.2.3 - Configure Provider IP (Masters Only)
  delegate_to: localhost
  become: false
  vars:
    m_ip: "{{ (m_tunnel_ips.results | selectattr('item', 'equalto', item) | first).stdout | trim }}"
    p_mac: "{{ (net_map.results | selectattr('item', 'equalto', item) | first).stdout | regex_search('P_MAC=([0-9a-fA-F:]+)', '\\1') | first }}"
    prov_ip: "{{ hostvars[item].provider_ip | default('') }}"
  shell: |
    P_DEV=$(ssh -o StrictHostKeyChecking=no core@{{ m_ip }} "ip -o link show | grep -i '{{ p_mac }}' | awk '{print \$2}' | sed 's/://'")
    
    ssh -o StrictHostKeyChecking=no core@{{ m_ip }} "sudo nmcli con add type ethernet con-name provider-net ifname $P_DEV ipv4.method manual ipv4.addresses {{ prov_ip }}/24 connection.autoconnect yes && sudo nmcli con up provider-net"
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - hostvars[item].provider_ip is defined

- name: 3.3.2.4 - Black Hole Worker Provider NIC
  delegate_to: "{{ VM_HOST_IP }}"
  become: true
  vars:
    p_mac: "{{ (net_map.results | selectattr('item', 'equalto', item) | first).stdout | regex_search('P_MAC=([0-9a-fA-F:]+)', '\\1') | first }}"
  shell: |
    VM="{{ item.split('.')[0] }}"
    cat <<EOF > /tmp/${VM}_p_dead.xml
    <interface type='network'>
      <mac address='{{ p_mac }}'/>
      <source network='black-hole'/>
      <link state='down'/>
    </interface>
    EOF
    virsh update-device $VM /tmp/${VM}_p_dead.xml --live --config
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - "'wrk' in item"

# ============================================================
# 3.4 - Black Hole Provider (Workers Only)
# ============================================================
- name: 3.4.1 - Isolate Worker Provider Interface
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    VM="{{ item.split('.')[0] }}"
    P_MAC=$(sudo virsh domiflist $VM | grep 'default' | awk '{print $5}')
    cat <<EOF > /tmp/${VM}_p_dead.xml
    <interface type='network'>
      <mac address='$P_MAC'/>
      <source network='black-hole'/>
      <link state='down'/>
    </interface>
    EOF
    sudo virsh update-device $VM /tmp/${VM}_p_dead.xml --live --config
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - "'wrk' in item"