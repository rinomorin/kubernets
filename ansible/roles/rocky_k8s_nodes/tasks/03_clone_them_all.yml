---
# ============================================================
# 3.1 - Prepare and "Wash" the Lead Master (Silver Image)
# ============================================================
- name: "3.1.1 - Power off msrlv9mast01 for cleaning"
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if sudo virsh list --all | grep -q "msrlv9mast01"; then
      sudo virsh destroy msrlv9mast01 || true
      for i in {1..15}; do
        STATE=$(sudo virsh domstate msrlv9mast01)
        if [ "$STATE" == "shut off" ]; then exit 0; fi
        sleep 2
      done
    fi
  changed_when: true

- name: "3.1.2 - Sysprep Lead Master (The Silver Image)"
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-sysprep -d msrlv9mast01
    --operations machine-id,net-hostname,net-hwaddr,ssh-hostkeys,customize
    --hostname msrlv9mast01.{{ c_zone }}

- name: "3.2.4 - Force Remove Cluster Nodes from known_hosts"
  delegate_to: localhost
  become: false
  shell: |
    # Remove any line containing the node name or the maintenance subnet
    rm -f ~/.ssh/known_hosts*
    
# ============================================================
# 3.2 - Clone and Prepare the Remaining Nodes
# ============================================================
- name: "3.2.1 - Clone Nodes with Unique MACs"
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-clone --original msrlv9mast01 
    --name {{ item.split('.')[0] }} 
    --file /var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2
    --mac RANDOM --mac RANDOM --mac RANDOM
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - item != 'msrlv9mast01'
  args:
    creates: "/var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2"

- name: "3.2.2 - Sysprep the Clones"
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-sysprep -d {{ item.split('.')[0] }}
    --operations machine-id,net-hostname,net-hwaddr,ssh-hostkeys,customize
    --hostname {{ item.split('.')[0] }}.{{ c_zone }}
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - item != 'msrlv9mast01'

- name: "3.2.3 - Power On All Nodes"
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if [ "$(sudo virsh domstate {{ item.split('.')[0] }})" == "shut off" ]; then
      sudo virsh start {{ item.split('.')[0] }}
    fi
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'

# ============================================================
# 3.3 - Discovery (Mapping KVM MACs to Maintenance IPs)
# ============================================================
- name: "3.3.1 - Discovery: Map KVM MACs and Maintenance IPs"
  delegate_to: "{{ VM_HOST_IP }}"
  become: true
  shell: |
    VM="{{ item.split('.')[0] }}"
    # Get MACs from the XML/Domiflist
    P_MAC=$(virsh domiflist $VM | grep 'default' | awk '{print $5}')
    C_MAC=$(virsh domiflist $VM | grep 'br-cluster' | awk '{print $5}')
    N_MAC=$(virsh domiflist $VM | grep 'br-nat' | awk '{print $5}')
    
    # Get the Maintenance IP from the NAT bridge leases
    M_IP=$(virsh net-dhcp-leases br-nat | grep -i "$N_MAC" | awk '{print $5}' | cut -d/ -f1)
    
    if [ -z "$M_IP" ]; then exit 1; fi

    # Output a structured string for easy parsing
    echo "NODE: $VM | NAT_IP: $M_IP | NAT_MAC: $N_MAC | CLUSTER_MAC: $C_MAC | PROVIDER_MAC: $P_MAC"
  register: temp_net_map
  until: temp_net_map.rc == 0
  retries: 50
  delay: 10
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'

- name: "3.3.2 - Visual Network Map"
  debug:
    msg: "{{ item.stdout }}"
  loop: "{{ temp_net_map.results }}"
  when: item.stdout is defined

- name: "3.3.1 - Discovery: Map KVM MACs to Intended IPs"
  delegate_to: "{{ VM_HOST_IP }}"
  become: true
  shell: |
    VM="{{ item.split('.')[0] }}"
    # Get MACs from virsh
    P_MAC=$(virsh domiflist $VM | grep 'default' | awk '{print $5}')
    C_MAC=$(virsh domiflist $VM | grep 'br-cluster' | awk '{print $5}')
    N_MAC=$(virsh domiflist $VM | grep 'br-nat' | awk '{print $5}')
    
    # Get the Maintenance (NAT) IP
    M_IP=$(virsh net-dhcp-leases br-nat | grep -i "$N_MAC" | awk '{print $5}' | cut -d/ -f1)
    
    if [ -z "$M_IP" ]; then exit 1; fi

    # Create the formatted row (VM | Provider | Cluster | NAT/Maint)
    # Using printf for alignment
    printf "%-12s | P: %s (%-12s) | C: %s (%-12s) | N: %s (%-12s)" \
      "$VM" \
      "$P_MAC" "{{ hostvars[item].provider_ip | default('N/A') }}" \
      "$C_MAC" "{{ hostvars[item].node_ip }}" \
      "$N_MAC" "$M_IP"
  register: temp_net_map
  until: temp_net_map.rc == 0
  retries: 50
  delay: 10
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'

- name: "3.3.2 - DISPLAY NETWORK MAP TABLE"
  debug:
    msg: 
      - "----------------------------------------------------------------------------------------------------------------------"
      - "VM NAME      | PROVIDER (MAC/STATIC)            | CLUSTER (MAC/STATIC)             | NAT/MAINT (MAC/DHCP)"
      - "----------------------------------------------------------------------------------------------------------------------"
      - "{{ temp_net_map.results | selectattr('stdout', 'defined') | map(attribute='stdout') | list | join('\n') }}"
      - "----------------------------------------------------------------------------------------------------------------------"

- name: "3.3.1.b - Set Discovery Facts on Nodes"
  set_fact:
    discovery_data: "{{ item.stdout }}"
  loop: "{{ temp_net_map.results }}"
  when: 
    - item.skipped is not defined
    - item.stdout is defined
    - item.item != 'helper'
  delegate_to: localhost

- name: "3.3.2 - Print Network Mapping Summary"
  debug:
    msg: "VM: {{ item.item }} -> {{ item.stdout }}"
  loop: "{{ discovery_data }}"
  when: item.stdout is defined

# ============================================================
# 3.4 - Network Customization (MAC-to-Device Matching)
# ============================================================
- name: "3.4.1 - Final Network Injection via SSH Jump"
  delegate_to: localhost
  become: false
  shell: |
    # Variables from discovery_data
    DATA="{{ hostvars[item].discovery_data }}"
    M_IP=$(echo "$DATA" | grep -oP 'M_IP=\K[0-9.]+')
    C_MAC=$(echo "$DATA" | grep -oP 'C_MAC=\K[0-9a-f:]+')
    P_MAC=$(echo "$DATA" | grep -oP 'P_MAC=\K[0-9a-f:]+')
    
    # Node Configuration from Inventory
    TARGET_NODE_IP="{{ hostvars[item].node_ip }}"
    TARGET_PROV_IP="{{ hostvars[item].provider_ip | default('') }}"

    # 1. Wait for SSH availability on Maintenance IP
    until nc -z -w 2 $M_IP 22; do sleep 3; done

    SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    # 2. Match Cluster NIC (enpX) by MAC and Assign IP
    C_DEV=$(ssh $SSH_OPTS core@$M_IP "ip -o link show | grep -i '$C_MAC' | awk '{print \$2}' | sed 's/://'")
    if [ -n "$C_DEV" ]; then
      ssh $SSH_OPTS core@$M_IP "sudo nmcli con add type ethernet con-name cluster-net ifname $C_DEV ipv4.method manual ipv4.addresses $TARGET_NODE_IP/24 connection.autoconnect yes && sudo nmcli con up cluster-net"
    fi

    # 3. Match Provider NIC (enpY) by MAC (Masters Only)
    if [ -n "$TARGET_PROV_IP" ] && [ -n "$P_MAC" ]; then
      P_DEV=$(ssh $SSH_OPTS core@$M_IP "ip -o link show | grep -i '$P_MAC' | awk '{print \$2}' | sed 's/://'")
      if [ -n "$P_DEV" ]; then
        ssh $SSH_OPTS core@$M_IP "sudo nmcli con add type ethernet con-name provider-net ifname $P_DEV ipv4.method manual ipv4.addresses $TARGET_PROV_IP/24 connection.autoconnect yes && sudo nmcli con up provider-net"
      fi
    fi
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - hostvars[item].discovery_data is defined
  async: 300
  poll: 0
  register: network_config_jobs

- name: "3.4.2 - Wait for Network Configuration to Finish"
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: job_result
  until: job_result.finished
  retries: 30
  delay: 5
  loop: "{{ network_config_jobs.results }}"
  when: item.ansible_job_id is defined