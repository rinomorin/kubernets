---
# ============================================================
# PHASE 1: Prepare Silver Image
# ============================================================
- name: "3.1.1 - Power off msrlv9mast01 for cloning"
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if sudo virsh list --all | grep -q "msrlv9mast01"; then
      sudo virsh destroy msrlv9mast01 || true
      for i in {1..15}; do
        STATE=$(sudo virsh domstate msrlv9mast01)
        if [ "$STATE" == "shut off" ]; then exit 0; fi
        sleep 2
      done
    fi
  changed_when: true

# ============================================================
# PHASE 2: Clone and Power On
# ============================================================
- name: "3.2.1 - Clone Remaining Nodes from Silver Image"
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-clone --original msrlv9mast01 
    --name {{ item.split('.')[0] }} 
    --file /var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - item != 'msrlv9mast01'
  args:
    creates: "/var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2"

- name: "3.2.2 - Power On All Nodes (Idempotent)"
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if [ "$(sudo virsh domstate {{ item.split('.')[0] }})" == "shut off" ]; then
      sudo virsh start {{ item.split('.')[0] }}
      echo "starting"
    else
      echo "already_active"
    fi
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'
  register: start_output
  changed_when: "'starting' in start_output.stdout"

# ============================================================
# PHASE 3: Discovery (Now pinning data to hostvars)
# ============================================================
- name: "3.3.1 - Discovery: Map MACs and Maintenance IPs"
  delegate_to: "{{ VM_HOST_IP }}"
  become: true
  shell: |
    VM="{{ item.split('.')[0] }}"
    P_MAC=$(virsh domiflist $VM | grep 'default' | awk '{print $5}')
    C_MAC=$(virsh domiflist $VM | grep 'br-cluster' | awk '{print $5}')
    N_MAC=$(virsh domiflist $VM | grep 'br-nat' | awk '{print $5}')
    M_IP=$(virsh net-dhcp-leases br-nat | grep "$N_MAC" | awk '{print $5}' | cut -d/ -f1)
    echo "P_MAC=$P_MAC|C_MAC=$C_MAC|M_IP=$M_IP"
  register: temp_net_map
  until: temp_net_map.stdout is search('M_IP=[0-9]')
  retries: 30
  delay: 5
  loop: "{{ groups['cluster_nodes'] }}"
  when: item != 'helper'

- name: "3.3.1.b - Set Facts for Networking"
  set_fact:
    discovery_data: "{{ item.stdout }}"
  loop: "{{ temp_net_map.results }}"
  when: item.skipped is not defined
  delegate_to: localhost

# ============================================================
# PHASE 4: Identity and Network Customization
# ============================================================

- name: "3.3.2.1 - Set FQDN Hostname"
  delegate_to: localhost
  become: false
  shell: |
    # Extract M_IP directly from the host's own fact
    M_IP=$(echo "{{ hostvars[item].discovery_data }}" | grep -oP 'M_IP=\K[0-9.]+')
    FQDN="{{ item.split('.')[0] }}.{{ c_zone }}"
    
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null core@$M_IP "sudo hostnamectl set-hostname $FQDN"
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - hostvars[item].discovery_data is defined

- name: "3.3.2.2 - Configure Cluster IP"
  delegate_to: localhost
  become: false
  shell: |
    M_IP=$(echo "{{ hostvars[item].discovery_data }}" | grep -oP 'M_IP=\K[0-9.]+')
    C_MAC=$(echo "{{ hostvars[item].discovery_data }}" | grep -oP 'C_MAC=\K[0-9a-f:]+')
    NODE_IP="{{ hostvars[item].node_ip }}"
    
    # 1. Find Dev Name
    C_DEV=$(ssh -o StrictHostKeyChecking=no core@$M_IP "ip -o link show | grep -i '$C_MAC' | awk '{print \$2}' | sed 's/://'")
    
    # 2. Configure
    ssh -o StrictHostKeyChecking=no core@$M_IP "sudo nmcli con add type ethernet con-name cluster-net ifname $C_DEV ipv4.method manual ipv4.addresses $NODE_IP/24 connection.autoconnect yes && sudo nmcli con up cluster-net"
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - hostvars[item].discovery_data is defined

- name: "3.3.2.3 - Configure Provider IP (Masters Only)"
  delegate_to: localhost
  become: false
  shell: |
    M_IP=$(echo "{{ hostvars[item].discovery_data }}" | grep -oP 'M_IP=\K[0-9.]+')
    P_MAC=$(echo "{{ hostvars[item].discovery_data }}" | grep -oP 'P_MAC=\K[0-9a-f:]+')
    PROV_IP="{{ hostvars[item].provider_ip }}"
    
    P_DEV=$(ssh -o StrictHostKeyChecking=no core@$M_IP "ip -o link show | grep -i '$P_MAC' | awk '{print \$2}' | sed 's/://'")
    
    ssh -o StrictHostKeyChecking=no core@$M_IP "sudo nmcli con add type ethernet con-name provider-net ifname $P_DEV ipv4.method manual ipv4.addresses $PROV_IP/24 connection.autoconnect yes && sudo nmcli con up provider-net"
  loop: "{{ groups['cluster_nodes'] }}"
  when: 
    - item != 'helper'
    - hostvars[item].discovery_data is defined
    - hostvars[item].provider_ip is defined