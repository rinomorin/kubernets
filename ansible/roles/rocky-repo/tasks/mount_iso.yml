- name: Ensure web repo directory exists
  file:
    path: "{{ web_repo }}"
    state: directory
    mode: '0755'

- name: Check if ISO is already mounted
  command: "mountpoint -q {{ web_repo }}"
  register: mount_check
  ignore_errors: true

- name: Mount ISO manually
  command: >
    mount -o loop,ro,context=system_u:object_r:httpd_sys_content_t:s0
    {{ iso_repo }}/{{ rocky_iso }} {{ web_repo }}
  when: mount_check.rc != 0
  
- name: Define SELinux context for mounted repo
  community.general.sefcontext:
    target: "{{ web_repo }}(/.*)?"
    setype: httpd_sys_content_t
    state: present
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: Apply SELinux context
  command: "restorecon -Rv {{ web_repo }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
