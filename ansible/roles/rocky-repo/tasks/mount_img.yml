- name: Ensure repo root exists
  file:
    path: "{{ web_repo }}"
    state: directory
    mode: '0755'

- name: Ensure mount device exists
  stat:
    path: "{{ mount_dev }}"
  register: mount_dev_check

- name: Fail if mount device does not exist
  fail:
    msg: "Mount device {{ mount_dev }} not found"
  when: not mount_dev_check.stat.exists

- name: Check if repo is already mounted
  command: "mountpoint -q {{ web_repo }}"
  register: repo_mount_check
  ignore_errors: true

- name: Mount repo device
  mount:
    path: "{{ web_repo }}"
    src: "{{ mount_dev }}"
    fstype: "{{ mount_fstype | default('xfs') }}"
    state: mounted
    opts: "defaults,ro,context=system_u:object_r:httpd_sys_content_t:s0"
  when: repo_mount_check.rc != 0

- name: Define SELinux context for repo (command version)
  command: >
    semanage fcontext -a -t httpd_sys_content_t "{{ web_repo }}(/.*)?"
  register: semanage_result
  failed_when: semanage_result.rc not in [0,1]

- name: Apply SELinux context
  command: "restorecon -Rv {{ iso_repo }}"
