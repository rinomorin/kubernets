---
- name: Normalize Rocky ISO variant
  set_fact:
    rocky_variant: "{{ rocky_variant | default('dvd') | lower | regex_replace('\\.iso$', '') }}"

- name: Fetch Rocky CHECKSUM file
  uri:
    url: "https://download.rockylinux.org/pub/rocky/{{ rocky_major }}/isos/x86_64/CHECKSUM"
    return_content: true
  register: rocky_checksum

- name: Extract all ISO filenames
  set_fact:
    rocky_all_isos: "{{ rocky_checksum.content | regex_findall('\\(([^)]+\\.iso)\\)') }}"

- name: Filter ISO filenames by variant
  set_fact:
    rocky_iso_candidates: "{{ rocky_all_isos | select('search', rocky_variant ~ '\\.iso$') | list }}"

- name: Fail if no ISO candidates found
  fail:
    msg: "No Rocky ISO files found for variant '{{ rocky_variant }}'. Found: {{ rocky_all_isos }}"
  when: rocky_iso_candidates | length == 0

- name: Select newest Rocky ISO
  set_fact:
    rocky_iso: "{{ rocky_iso_candidates | sort | last }}"

- name: Show detected ISO
  debug:
    msg: "{{ {'rocky_iso': rocky_iso, 'candidates': rocky_iso_candidates} | to_json }}"
