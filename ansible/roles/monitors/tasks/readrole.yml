    
  
- name: build list of tasks for role {{ role_to_read }}
  become: false
  run_once: yes
  shell: |
    for f in $(ls -1t {{ playbook_dir }}/../roles/{{ role_to_read }}/tasks/*.yml); do
      grep -a1 'name:' "$f" \
      | grep -vE '#|debug' \
      | grep 'name:' \
      | awk -F: '{print $1,$3}' \
      | sed 's/.yml/,/g' \
      | sed 's/tasks\///g' \
      | awk -F\/ '{print $NF}' \
      | sed 's/,[[:space:]]*/;/' \
      | grep -v '\\$'
    done >> /tmp/tasks.txt
  delegate_to: localhost
  
- name: Get list of tasks for role {{ role_to_read }}
  become: false
  run_once: yes
  shell: |
    cat /tmp/tasks.txt
  register: role_task_output

- name: Set default status
  set_fact:
    default_status: "completed"
  when: role_to_read == 'monitors'

- name: Set default status
  set_fact:
    default_status: "pending"
  when: role_to_read != 'monitors'

- name: Reset task_rows for {{ role_to_read }}
  set_fact:
    task_rows: []
  delegate_to: localhost
  run_once: true
  

- name: Build task rows for {{ role_to_read }}
  set_fact:
    task_rows: "{{ task_rows + [ task_item ] }}"
  loop: "{{ role_task_output.stdout_lines | reject('equalto','') | list }}"
  loop_control:
    label: "{{ item }}"
  vars:
    task_item:
      role: "{{ item.split(';') | first | default('') }}"
      task_name: "{{ item.split(';') | last | default('') }}"
      status: "{{ default_status }}"
      rc: "none"
  delegate_to: localhost
  become: false

- name: Append {{ role_to_read }} into roles_list
  set_fact:
    roles_list: "{{ (roles_list | default([])) + [ {
      'role_name': role_to_read,
      'tasks': task_rows
    } ] }}"
  delegate_to: localhost
  run_once: true
  become: false
