---
# Builds a roles_dict, writes it to JSON, and renders an HTML summary.

- debug: msg="playbook_name is {{ playbook_name }}"
- name: Load playbook YAML
  set_fact:
    playbook_content: "{{ (lookup('file', playbook_dir ~ '/' ~ playbook_name) | from_yaml_all | list) | flatten }}"
  delegate_to: localhost
  run_once: true

- debug: msg="playbook_content is {{ playbook_content }}"
- name: Collect roles from playbook
  set_fact:
    playbook_roles: "{{ playbook_roles | default([]) + (item.roles | map(attribute='role') | list) }}"
  loop: "{{ playbook_content }}"
  when: item.roles is defined
  delegate_to: localhost
  run_once: true

- debug: msg="playbook_roles is {{ item }}"
  loop: "{{ playbook_roles }}"
  when: item.roles is defined
  delegate_to: localhost
  run_once: true

- debug:
    msg: "playbook_roles is {{ playbook_roles }}"

- name: Get list of tasks for each role
  shell: |
    grep 'name:' {{ playbook_dir }}/../roles/{{ this_role_name }}/tasks/*.yml \
    | grep -vE '#|debug' \
    | awk -F: '{print $1,$3}' \
    | sed 's/.yml/,/g' \
    | sed 's/tasks\///g' \
    | awk -F\/ '{print $NF}' \
    | awk '{print ""$0""}' \
    | sed 's/,[[:space:]]*/;/' \
    | sed 's/tasks\///g' \
    |grep -v '\\$'
  loop: "{{ playbook_roles }}"
  loop_control:
    loop_var: this_role_name
  delegate_to: localhost
  run_once: true
  register: role_task_output

- debug: msg="{{ role_task_output }}"
  run_once: true

