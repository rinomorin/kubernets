- name: Run playbook parser
  ansible.builtin.command:
    cmd: |
      python3 {{ role_path }}/scripts/build_json_list.py -d {{ playbook_dir }} -p {{ playbook_name }} -i {{ playbook_dir }}/../inventory.yml
    chdir: "{{ playbook_dir }}/.."
  register: parse_output
  delegate_to: localhost
  run_once: yes
  become: false

- name: Show ordered task list
  debug:
    msg: "{{ parse_output.stdout_lines }}"
  run_once: yes

