- block:
    - name: Derive role name from file path
      set_fact:
        role_name: "{{ filename | regex_search('roles/([^/]+)') }}"

    - name: Collect task names from file
      shell: |
        grep -a1 'name:' "{{ filename }}" \
          | grep -vE '#|debug' \
          | grep 'name:' \
          | awk -F: '{gsub(/^[ \t]+/, "", $2); print $2}'
      register: file_tasks
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Append role/file/tasks to master list
      set_fact:
        mylist: >-
          {{
            mylist | default([]) +
            [ { 'role': role_name,
                'file': filename,
                'tasks': file_tasks.stdout_lines | default([]) } ]
          }}