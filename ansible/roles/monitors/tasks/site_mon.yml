---
- name: Ensure monitor site directory exists
  delegate_to: localhost
  become: false
  file:
    path: "{{ monitor_target_dir }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: Deploy dynamic HTML monitor page
  delegate_to: localhost
  become: false
  copy:
    dest: "{{ monitor_target_dir }}/index.html"
    mode: '0644'
    content: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Build Monitor</title>
        <meta http-equiv="refresh" content="60;url=index.html">
        <style>
          body { font-family: Arial, sans-serif; margin: 20px; }
          table { border-collapse: collapse; margin-bottom: 30px; width: 100%; }
          th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
          th { background-color: #f2f2f2; }
          h2 { margin-top: 40px; }
          .status-pending { background-color: #fff3cd; }   /* yellow */
          .status-success { background-color: #d4edda; }   /* green */
          .status-error   { background-color: #f8d7da; }   /* red */
        </style>
      </head>
      <body>
        <h1>Server Build Monitor</h1>
        <p>This page reloads every 60 seconds.</p>

        <div id="tables"></div>

       <script>
        async function loadTasks() {
          try {
            const response = await fetch('tasks.json');   // tasks.json must be in same directory
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();

            // Group tasks by role, adding default status/error
            const roleMap = {};
            data.plays.forEach(play => {
              play.tasks.forEach(task => {
                // Skip bookkeeping tasks
                if (task.name === "Update status") {
                  return;   // continue to next task
                }

                // Add defaults
                if (!task.status) {
                  task.status = "pending";
                }
                if (!task.error) {
                  task.error = null;
                }

                if (!roleMap[task.role]) {
                  roleMap[task.role] = [];
                }
                roleMap[task.role].push(task);
              });
            });

            // Render tables
            const container = document.getElementById('tables');
            container.innerHTML = '';
            for (const [role, tasks] of Object.entries(roleMap)) {
              const caption = document.createElement('h2');
              caption.textContent = `Role: ${role} (${tasks.length} tasks)`;
              container.appendChild(caption);

              const table = document.createElement('table');
              const headerRow = document.createElement('tr');
              headerRow.innerHTML = '<th>#</th><th>Task Name</th><th>Status</th><th>Error</th>';
              table.appendChild(headerRow);

              tasks.forEach((task, idx) => {
                const row = document.createElement('tr');
                let statusClass = '';
                if (task.status === 'pending') statusClass = 'status-pending';
                else if (task.status === 'success') statusClass = 'status-success';
                else if (task.status === 'error') statusClass = 'status-error';

                row.innerHTML = `
                  <td>${idx + 1}</td>
                  <td>${task.name}</td>
                  <td class="${statusClass}">${task.status}</td>
                  <td>${task.error !== null ? task.error : ''}</td>
                `;
                table.appendChild(row);
              });

              container.appendChild(table);
            }
          } catch (err) {
            document.getElementById('tables').innerHTML =
              `<p style="color:red;">Failed to load tasks.json: ${err.message}</p>`;
          }
        }

        loadTasks();
      </script>

      </body>
      </html>



