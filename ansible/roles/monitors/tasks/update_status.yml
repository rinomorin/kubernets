---
# Usage: include_tasks: update_status.yml
# Vars required:
#   role_to_read: logical role name (e.g. monitors)
#   task_name: descriptive task name
#   result: registered result from the task

# roles/monitors/tasks/update_status.yml
# roles/monitors/tasks/update_status.yml
- name: Update roles_dict for {{ task_name }}
  set_fact:
    roles_dict: >-
      {{
        (roles_dict | default({})) | combine({
          role_to_read: {
            'role_name': role_to_read,
            'tasks': (
              (roles_dict[role_to_read].tasks | default([]))
              + [
                {
                  'name': task_name,
                  'status': (
                    (result is defined)
                    | ternary(
                        (result is succeeded) | ternary('success','failed'),
                        'complete'
                      )
                  ),
                  'rc': (result.rc | default('none'))
                }
              ]
            )
          }
        }, recursive=True)
      }}
  delegate_to: localhost
  run_once: true
  become: false

- name: Write roles_dict to tasks.json
  copy:
    dest: "{{ workDir }}/buildMon/tasks.json"
    content: "{{ roles_dict | to_nice_json }}"
    mode: '0644'
  delegate_to: localhost
  run_once: true
  become: false
