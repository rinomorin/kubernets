###############################################################################
# TEMPORARY CONSOLE LOGGING TO EXTRACT NAT IP FROM BOOT OUTPUT
###############################################################################

- name: Enable temporary console logging
  delegate_to: "{{ VM_HOST }}"
  shell: |
    virsh qemu-monitor-command {{ item }} \
      --hmp "logfile /var/log/libvirt/qemu/{{ item }}.tmp.log"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- name: Start VM console logging
  delegate_to: "{{ VM_HOST }}"
  shell: |
    virsh qemu-monitor-command {{ item }} --hmp "log on"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- name: Wait for VM boot output
  pause:
    seconds: 10

- name: Read temporary console log
  delegate_to: "{{ VM_HOST }}"
  slurp:
    src: "/var/log/libvirt/qemu/{{ item }}.tmp.log"
  register: vm_logs
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- name: Decode console logs
  set_fact:
    vm_console_map: "{{ vm_console_map | default({}) | combine({ item: (vm_logs.results[idx].content | b64decode) }) }}"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item
    index_var: idx

- name: Extract NAT IP from console output
  set_fact:
    vm_nat_ip_map: "{{ vm_nat_ip_map | default({}) | combine({ item: (vm_console_map[item] | regex_search('([0-9]{1,3}\\.){3}[0-9]{1,3}', '\\0')) }) }}"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- name: Stop VM console logging
  delegate_to: "{{ VM_HOST }}"
  shell: |
    virsh qemu-monitor-command {{ item }} --hmp "log off"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- name: Remove temporary console log
  delegate_to: "{{ VM_HOST }}"
  file:
    path: "/var/log/libvirt/qemu/{{ item }}.tmp.log"
    state: absent
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item
