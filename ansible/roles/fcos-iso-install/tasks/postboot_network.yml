---
# Post-boot network configuration for FCOS VMs
###########################################################################
# STEP 1 — GET MAC ADDRESSES FOR NAT / CLUSTER / PROVIDER
###########################################################################

# STEP 1.5 — SAFELY PARSE NICs
- name: Build vm_nic_map
  set_fact:
    vm_nic_map: "{{ vm_nic_map | default({}) | combine({ item: {
        'nat_mac':     nat_mac,
        'cluster_mac': cluster_mac,
        'provider_mac': provider_mac
    }}) }}"
  vars:
    nic_lines: "{{ vm_nics.results[idx].stdout_lines | default([]) }}"
    nat_mac: >-
      {{ (nic_lines | select('search','br-nat') | list | first | default('ERROR no br-nat')) .split()[0] }}
    cluster_mac: >-
      {{ (nic_lines | select('search','br-cluster') | list | first | default('ERROR no br-cluster')) .split()[0] }}
    provider_mac: >-
      {{ (nic_lines | select('search','default') | list | first | default('ERROR no default')) .split()[0] }}
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item
    index_var: idx


###########################################################################
# STEP 2 — GET NAT IP FROM DHCP LEASE
###########################################################################

- name: Get NAT IP via domifaddr
  delegate_to: "{{ VM_HOST }}"
  shell: |
    iface=$(virsh domiflist {{ item }} | grep nat | awk '{print $NF}')
    virsh domifaddr {{ item }} | grep "$iface" | awk '{print $NF}' | cut -d/ -f1
  register: nat_ip_results
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- debug: msg="nat_ip_results {{ nat_ip_results }}"

# STEP 2.5 — Build vm_nat_ip_map safely (NO loop.* inside Jinja)

- name: Build vm_nat_ip_map
  set_fact:
    vm_nat_ip_map: "{{ vm_nat_ip_map | default({}) | combine({ item: nat_ip }) }}"
  vars:
    nat_ip: "{{ nat_ip_results.results[idx].stdout | default('') }}"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item
    index_var: idx

###########################################################################
# STEP 2.5 — WAIT FOR SSH READINESS (YOUR REQUESTED PROBE)
###########################################################################

- name: show VM before SSH is ready
  debug:
    msg: |
      {{ item }}
      ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 core@{{ vm_nat_ip_map[item] }} "echo sshok" || true
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- name: Write ignition SSH private key to helper
  delegate_to: "{{ VM_HOST }}"
  copy:
    dest: "/tmp/ign_key_{{ item }}"
    content: "{{ ignition_ssh_authorized_key }}"
    mode: '0600'
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- name: Probe VM until SSH is ready
  delegate_to: "{{ VM_HOST }}"
  shell: |
    ssh \
      -i /tmp/ign_key_{{ item }} \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      -o ConnectTimeout=5 \
      core@{{ vm_nat_ip_map[item] }} "echo sshok" || true
  register: ssh_check
  failed_when: false
  changed_when: false
  until: ssh_check.stdout is search("sshok")
  retries: "{{ ssh_retries | default(30) }}"
  delay: 10
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item


###########################################################################
# STEP 3 — CONFIGURE STATIC IPS INSIDE THE VM
###########################################################################

- name: Compute provider gateway
  set_fact:
    provider_gw_map: >-
      {{
        provider_gw_map | default({}) | combine({
          item: node_ip_list[item].provider_ip.split('.')[:-1] | join('.') ~ '.1'
        })
      }}
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item


# Configure cluster NIC (provision network)
- name: Configure cluster NIC
  delegate_to: "{{ VM_HOST }}"
  shell: |
    ssh -o StrictHostKeyChecking=no core@{{ vm_nat_ip_map[item] }} \
      "sudo nmcli con add \
          type ethernet \
          ifname {{ vm_nic_map[item].cluster_mac }} \
          con-name cluster \
          ipv4.addresses {{ node_ip_list[item].provision_ip }}/24 \
          ipv4.method manual \
          ipv6.method ignore"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item


# Configure provider NIC (provider network + gateway)
- name: Configure provider NIC
  delegate_to: "{{ VM_HOST }}"
  shell: |
    ssh -o StrictHostKeyChecking=no core@{{ vm_nat_ip_map[item] }} \
      "sudo nmcli con add \
          type ethernet \
          ifname {{ vm_nic_map[item].provider_mac }} \
          con-name provider \
          ipv4.addresses {{ node_ip_list[item].provider_ip }}/24 \
          ipv4.gateway {{ provider_gw_map[item] }} \
          ipv4.method manual \
          ipv6.method ignore"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item


# Restart NetworkManager
- name: Restart NetworkManager
  delegate_to: "{{ VM_HOST }}"
  shell: |
    ssh core@{{ vm_nat_ip_map[item] }} "sudo systemctl restart NetworkManager"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item


###########################################################################
# VALIDATION
###########################################################################

- name: Validate NIC IPs
  delegate_to: "{{ VM_HOST }}"
  shell: |
    ssh core@{{ vm_nat_ip_map[item] }} "ip -4 a"
  register: ip_output
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item

- debug:
    msg: "{{ ip_output.results[loop.index0].stdout }}"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item
