---
# roles/fcos-iso-install/tasks/define_vms.yml
# Use virsh define/start flow. PCI slots and fallback IPs are computed from node_list index.

- name: Ensure temp dir for domain XML on VM_HOST
  file:
    path: /tmp/fcos-vm-xml
    state: directory
    mode: "0755"
  delegate_to: "{{ VM_HOST }}"
  become: true

- name: Render domain XML for each node to VM_HOST
  template:
    src: "vm-xml.j2"
    dest: "/tmp/fcos-vm-xml/{{ item }}.xml"
    mode: "0644"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item
  delegate_to: "{{ VM_HOST }}"
  become: true

- name: Validate domain XML on VM_HOST with xmllint (install if needed)
  block:
    - name: Check for xmllint on VM_HOST
      command: which xmllint
      register: xmllint_check
      failed_when: false
      changed_when: false
      delegate_to: "{{ VM_HOST }}"
      become: true

    - name: Install xmllint packages on VM_HOST if missing
      package:
        name:
          - libxml2-utils
          - libxml2
        state: present
      when: xmllint_check.rc != 0
      delegate_to: "{{ VM_HOST }}"
      become: true

    - name: Validate domain XML on VM_HOST with xmllint
      command: xmllint --noout /tmp/fcos-vm-xml/{{ item }}.xml
      register: validate_result
      failed_when: validate_result.rc != 0
      loop: "{{ node_list }}"
      loop_control:
        loop_var: item
      delegate_to: "{{ VM_HOST }}"
      become: true
  delegate_to: "{{ VM_HOST }}"

- name: Define domain with virsh (idempotent) on VM_HOST
  command: virsh define /tmp/fcos-vm-xml/{{ item }}.xml
  args:
    creates: "/etc/libvirt/qemu/{{ item }}.xml"
  loop: "{{ node_list }}"
  loop_control:
    loop_var: item
  delegate_to: "{{ VM_HOST }}"
  become: true

- name: Wait briefly for libvirt to register domains on VM_HOST
  pause:
    seconds: 2
  delegate_to: "{{ VM_HOST }}"
  run_once: true
