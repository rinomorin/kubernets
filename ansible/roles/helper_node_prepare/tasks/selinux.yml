---
- name: Ensure SELinux context for FCOS root
  command: >
    semanage fcontext -a -t httpd_sys_content_t "{{ fcos_root }}(/.*)?"
  args:
    creates: "/var/lib/selinux/fcos_fcontext_marker"
  register: semanage_result
  failed_when: semanage_result.rc not in [0, 1]
  changed_when: semanage_result.rc == 0

- name: Touch marker file for FCOS fcontext
  file:
    path: "/var/lib/selinux/fcos_fcontext_marker"
    state: touch

- name: Restore SELinux context on FCOS root
  command: restorecon -Rv "{{ fcos_root }}"
  changed_when: false
