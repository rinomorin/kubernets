- name : Create kubeadm_init/main.yml for ignition role
  copy:
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    dest: "{{ cloud_helper_workdir }}/ansible/roles/kubeadm_init/tasks/main.yml"
    mode: "0644"
    content: |
      {% raw %}
      ---
      - name: Wait for master SSH to be reachable
        delegate_to: "{{ groups['masters'][0] }}"
        wait_for_connection:
          timeout: 600

      - name: Run kubeadm init on master
        delegate_to: "{{ groups['masters'][0] }}"
        become: true
        shell: |
          kubeadm init \
            --pod-network-cidr={{ cluster_pod_cidr }} \
            --service-cidr={{ cluster_service_cidr }} \
            --kubernetes-version={{ kubernetes_version }} \
            --control-plane-endpoint={{ groups['masters'][0] }}:6443 \
            2>&1 | tee /root/kubeadm-init.log
        args:
          executable: /bin/bash
        register: kubeadm_init_run
        changed_when: "'kubeadm init' in kubeadm_init_run.stdout"

      - name: Fetch admin.conf to helper
        delegate_to: "{{ groups['masters'][0] }}"
        fetch:
          src: /etc/kubernetes/admin.conf
          dest: "{{ artifacts_dir }}/admin.conf"
          flat: true

      {% endraw %}

- name : Create kubeadm_join/main.yml for ignition role
  copy:
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    dest: "{{ cloud_helper_workdir }}/ansible/roles/kubeadm_join/tasks/main.yml"
    mode: "0644"
    content: |
      {% raw %}
      ---
      - name: Generate join command on master
        delegate_to: "{{ groups['masters'][0] }}"
        become: true
        shell: kubeadm token create --print-join-command
        register: join_cmd
        changed_when: false

      - name: Join workers to cluster
        delegate_to: "{{ item }}"
        become: true
        shell: "{{ join_cmd.stdout }}"
        args:
          executable: /bin/bash
        loop: "{{ groups['workers'] }}"

      {% endraw %}


- name : Create cluster_validate for ignition role
  copy:
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    dest: "{{ cloud_helper_workdir }}/ansible/roles/cluster_validate/tasks/main.yml"
    mode: "0644"
    content: |
      {% raw %}
      ---
      - name: Set kubeconfig path
        set_fact:
          kubeconfig_path: "{{ artifacts_dir }}/admin.conf"

      - name: Wait for nodes to be Ready
        shell: |
          KUBECONFIG={{ kubeconfig_path }} kubectl get nodes --no-headers | awk '{print $2}' | grep -v Ready && exit 1 || exit 0
        register: node_ready_check
        retries: 30
        delay: 10
        until: node_ready_check.rc == 0
        changed_when: false

      - name: Show nodes
        shell: |
          KUBECONFIG={{ kubeconfig_path }} kubectl get nodes -o wide
        register: nodes_out
        changed_when: false

      - debug:
          var: nodes_out.stdout

      - name: Show pods
        shell: |
          KUBECONFIG={{ kubeconfig_path }} kubectl get pods -A
        register: pods_out
        changed_when: false

      - debug:
          var: pods_out.stdout

      {% endraw %}


