
- name : Create tasks/main.yml for ignition role
  copy:
    dest: "{{ cloud_helper_workdir }}/ansible/roles/ignition/tasks/main.yml"
    mode: "0644"
    content: |
      {% raw %}
      ---
      - name: Ensure ignition directory exists
        delegate_to: localhost
        become: false
        file:
          path: "{{ cloud_helper_workdir }}/ignition"
          state: directory
          mode: "0755"

      - name: Generate master Ignition configs
        delegate_to: localhost
        become: false
        template:
          src: "master.ign.j2"
          dest: "{{ cloud_helper_workdir }}/ignition/{{ item }}.ign"
          mode: "0644"
        loop: "{{ groups['masters'] }}"
        loop_control:
          loop_var: item

      - name: Generate worker Ignition configs
        delegate_to: localhost
        become: false
        template:
          src: "worker.ign.j2"
          dest: "{{ cloud_helper_workdir }}/ignition/{{ item }}.ign"
          mode: "0644"
        loop: "{{ groups['workers'] }}"
        loop_control:
          loop_var: item
      {% endraw %}

- name : Create templates/worker.ign.j2 for ignition role
  copy:
    dest: "{{ cloud_helper_workdir }}/ansible/roles/ignition/templates/worker.ign.j2"
    mode: "0644"
    content: |
      {% raw %}
            {
        "ignition": { "version": "{{ ignition_version }}" },
        "storage": {},
        "systemd": { "units": [] },
        "passwd": {
          "users": [
            {
              "name": "core",
              "sshAuthorizedKeys": [
                "{{ lookup('file', cloud_helper_workdir + '/.ssh/cluster_automation.pub') | default('', true) }}"
              ]
            }
          ]
        }
      }
      {% endraw %}

