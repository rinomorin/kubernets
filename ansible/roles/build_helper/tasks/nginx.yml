---
- name: Install nginx
  package:
    name: nginx
    state: present

- name: insure http as been restarted
  command: ipactl restart
  delegate_to: helper

- name: Ensure nginx conf.d exists
  file:
    path: /etc/nginx/conf.d
    state: directory

- name: Install minimal nginx.conf
  run_once: true
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
    force: true
  notify: restart nginx

- name: Disable ALL listeners in nginx.conf.default
  replace:
    path: /etc/nginx/nginx.conf.default
    regexp: '^\s*listen\s+.*;'
    replace: '# listen disabled by helper_node_prepare'
  notify: restart nginx

# Install HTTP listener
- name: Install nginx HTTP listener for FCOS assets
  copy:
    dest: /etc/nginx/conf.d/fcos.conf
    mode: '0644'
    content: |
      server {
          listen {{ nat_ip_device }}:80;
          server_name {{ inventory_hostname }};

          disable_symlinks off;
          autoindex on;

          location /boot/     { alias /srv/fcos/http/; }
          location /ignition/ { alias /srv/fcos/ignition/; }
          location /butane/   { alias /srv/fcos/butane/; }
          location /ipxe/     { alias /srv/fcos/ipxe/; }
      }
  notify: restart nginx

- name: Ensure httpd directories exist
  become: false
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ cloud_helper_workdir }}/ignition"
    - "{{ cloud_helper_workdir }}/fcos"

- name: Ensure httpd is running and enabled
  become: true
  service:
    name: httpd
    state: started
    enabled: true

- name : Create aliases for ignition role
  copy:
    dest: "/etc/nginx/conf.d/cloud_helper.conf"
    mode: "0644"
    content: |
      # FCOS installer content server for {{ inventory_hostname }}
      # Serves Ignition and FCOS rootfs to VMs on provisioning/NAT networks

      server {
          listen {{ nat_ip_device }}:80;
          server_name _;

          # Serve Ignition files
          location /ignition/ {
              alias {{ cloud_helper_workdir }}/ignition/;
              autoindex on;
              access_log /var/log/nginx/ignition_access.log;
          }

          # Serve FCOS rootfs + other installer artifacts
          location /fcos/ {
              alias {{ cloud_helper_workdir }}/fcos/;
              autoindex on;
              access_log /var/log/nginx/fcos_access.log;
          }
      }
  notify: restart nginx
  
# Validate configuration
- name: Validate Nginx configuration
  command: nginx -t
  register: nginx_test
  changed_when: false
  failed_when: nginx_test.rc != 0

