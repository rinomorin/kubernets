---
# ============================================================
# 05_render_ignitions.yml — Render all ignition templates
# ============================================================

- name: set ignition_path
  set_fact:
    ignition_path: "/var/lib/libvirt/images/ignitions"

# Ensure ignition output directory exists on KVM host
- name: Ensure ignition directory exists
  become: yes
  file:
    path: "{{ ignition_path }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ VM_HOST_IP }}"

# ------------------------------------------------------------
# Render kubeadm-init.yaml locally for control plane nodes
# ------------------------------------------------------------
- name: Render kubeadm init config locally
  when: "'control_nodes' in group_names"
  delegate_to: localhost
  template:
    src: kubeadm-init.yaml.j2
    dest: "/tmp/{{ inventory_hostname_short }}-kubeadm-init.yaml"
    mode: "0644"

# ------------------------------------------------------------
# Render control plane ignition files locally
# ------------------------------------------------------------
- name: Render control plane ignition files locally
  when: "'control_nodes' in group_names"
  delegate_to: localhost
  template:
    src: controlplane.ign.j2
    dest: "/tmp/{{ inventory_hostname_short }}.ign"
    mode: "0644"
  vars:
    kubeadm_init_config: "{{ lookup('file', '/tmp/' + inventory_hostname_short + '-kubeadm-init.yaml') }}"
    crio_config: "{{ hostvars[inventory_hostname].crio_config }}"
    kubelet_config: "{{ hostvars[inventory_hostname].kubelet_config }}"

# ------------------------------------------------------------
# Render kubeadm-join.yaml locally for worker nodes
# ------------------------------------------------------------
- name: Render kubeadm join config locally
  when: "'worker_nodes' in group_names"
  delegate_to: localhost
  template:
    src: kubeadm-join.yaml.j2
    dest: "/tmp/{{ inventory_hostname_short }}-kubeadm-join.yaml"
    mode: "0644"

# ------------------------------------------------------------
# Render worker ignition files locally
# ------------------------------------------------------------
- name: Render worker ignition files locally
  when: "'worker_nodes' in group_names"
  delegate_to: localhost
  template:
    src: worker.ign.j2
    dest: "/tmp/{{ inventory_hostname_short }}.ign"
    mode: "0644"
  vars:
    kubeadm_join_config: "{{ lookup('file', '/tmp/' + inventory_hostname_short + '-kubeadm-join.yaml') }}"

# ------------------------------------------------------------
# Copy ignition files to KVM host
# ------------------------------------------------------------
- name: Copy ignition files to KVM host
  become: yes
  delegate_to: "{{ VM_HOST_IP }}"
  copy:
    src: "/tmp/{{ inventory_hostname_short }}.ign"
    dest: "{{ ignition_path }}/{{ inventory_hostname_short }}.ign"
    mode: "0644"
  when: inventory_hostname in groups['control_nodes'] or
        inventory_hostname in groups['worker_nodes']

# ------------------------------------------------------------
# Generate ignition ISO for each node
# ------------------------------------------------------------
- name: Generate ignition ISO for each node
  loop: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"
  loop_control:
    loop_var: node
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    genisoimage \
      -output {{ ignition_path }}/{{ node }}.iso \
      -volid cidata \
      -joliet -rock \
      {{ ignition_path }}/{{ node }}.ign
  args:
    creates: "{{ ignition_path }}/{{ node }}.iso"

# ------------------------------------------------------------
# Attach ignition ISO to each VM
# ------------------------------------------------------------
- name: Attach ignition ISO to each VM
  loop: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"
  loop_control:
    loop_var: node
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if ! virsh domblklist "{{ node }}" | grep -q "{{ node }}.iso"; then
      virsh attach-disk "{{ node }}" \
        {{ ignition_path }}/{{ node }}.iso \
        sdc --type cdrom --mode readonly --persistent
    fi
