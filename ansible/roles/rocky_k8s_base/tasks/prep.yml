---
# Ensure directories exist
- name: Ensure build directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ build_root }}"
    - "{{ build_root }}/rootfs"
    - "{{ build_root }}/mnt"
    - "{{ build_root }}/rootfs/etc/yum.repos.d"

###############################################################
# CRI-O Repository (INSIDE INSTALLROOT)
###############################################################
- name: Set CRI-O repository versions from environment
  set_fact:
    crio_repo_ver: "{{ lookup('env','kubetnet_version') | default('1.34', true) }}"

- name: Set CRI-O repository URLs
  set_fact:
    crio_repo_url: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_repo_ver }}/rpm/"
    crio_repo_gpg: "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v{{ crio_repo_ver }}/rpm/repomd.xml.key"

- name: Install CRI‑O repository into install root  
  copy:
    dest: "{{ build_root }}/rootfs/etc/yum.repos.d/crio.repo"
    owner: root
    group: root
    mode: '0644'
    content: |
      [crio]
      name=CRI-O {{ crio_repo_ver }}
      baseurl={{ crio_repo_url }}
      enabled=1
      gpgcheck=1
      gpgkey={{ crio_repo_gpg }}

###############################################################
# Kubernetes Repository (INSIDE INSTALLROOT)
###############################################################
- name: Set Kubernetes repository versions from environment
  set_fact:
    kubernetes_repo_ver: "{{ lookup('env','kubetnet_version') | default('1.34', true) }}"

- name: Set Kubernetes repository URLs
  set_fact:
    kubernetes_repo_url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_repo_ver }}/rpm/"
    kubernetes_repo_gpg: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_repo_ver }}/rpm/repodata/repomd.xml.key"

- name: Install Kubernetes repository into installroot
  copy:
    dest: "{{ build_root }}/rootfs/etc/yum.repos.d/kubernetes.repo"
    owner: root
    group: root
    mode: '0644'
    content: |
      [kubernetes]
      name=Kubernetes {{ kubernetes_repo_ver }}
      baseurl={{ kubernetes_repo_url }}
      enabled=1
      gpgcheck=1
      gpgkey={{ kubernetes_repo_gpg }}

- name: Copy Rocky 10 repo files from vm_host server
  become: false
  command: >
    scp -o StrictHostKeyChecking=no
    {{ VM_HOST_IP }}:/etc/yum.repos.d/rocky*.repo
    /tmp/.

- name: wait_for copy Rocky 10 repo files
  wait_for:
    timeout: 2
  

- name: Move Rocky 10 repo files into installroot
  command: >
    mv /tmp/rocky*.repo
    {{ build_root }}/rootfs/etc/yum.repos.d/

###############################################################
# Refresh metadata inside installroot
###############################################################
- name: Clean metadata inside installroot
  command: dnf --installroot={{ build_root }}/rootfs clean all
  changed_when: false
