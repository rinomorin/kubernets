- name: Wait for SSH on golden-base 
  wait_for: 
    timeout: 15

- name: Start golden-base VM
  shell: sudo virsh start golden-base
  delegate_to: "{{ VM_HOST_IP }}"

- name: Wait for golden-base VM to be running
  shell: |
    sudo virsh list --all | grep golden-base | awk '{print $NF}'
  register: vm_state
  delegate_to: "{{ VM_HOST_IP }}"
  failed_when: false
  changed_when: false
  until: vm_state.stdout == "running"
  retries: "{{ build_loops | int }}"
  delay: 10

- name: Get golden-base VM IP
  shell: |
    sudo virsh net-dhcp-leases br-nat | \
    grep $(sudo virsh domiflist golden-base | grep br-nat | awk '{print $NF}') | \
    awk -F/ '{print $1}' | awk '{print $NF}'
  register: gold_ip
  delegate_to: "{{ VM_HOST_IP }}"

- name: wait 20 seconds
  shell: sleep 20
  delegate_to: localhost

- set_fact:
    golden_ip: "{{ gold_ip.stdout }}"

- name: show golden_ip
  debug:
    msg: "{{ golden_ip }}"

- name: Probe ssh until service is ready on golden-base
  delegate_to: localhost
  become: false
  shell: |
    ssh core@"{{ golden_ip }}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null echo sshok
  register: ssh_check
  failed_when: false
  changed_when: false
  until: ssh_check.stdout == "sshok"
  retries: "{{ build_loops | int }}"
  delay: 10

- name: Mark golden-base as ready
  set_fact:
    golden_ready: true

# Clone only the hosts defined in the 'hahost' group in inventory
- name: Clone Load Balancer nodes from Golden Image
  delegate_to: "{{ VM_HOST_IP }}"
  run_once: true
  command: >
    sudo virt-clone --original golden-base 
    --name {{ item }} 
    --file /var/lib/libvirt/images/{{ item }}.qcow2
  loop: "{{ groups['hahost'] }}"
  register: lb_clones
  # We ignore the error if the VM already exists, but fail on anything else
  failed_when: 
    - lb_clones.rc != 0 
    - "'already exists' not in lb_clones.stderr"