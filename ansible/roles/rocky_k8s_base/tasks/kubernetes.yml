
###############################################################
# 3. Ensure .kube directory exists for helper user
###############################################################
- name: Ensure .kube directory exists for helper user
  become: true
  ansible.builtin.file:
    path: "/home/{{ cloud_helper_user }}/.kube"
    state: directory
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: "0750"

###############################################################
# 4. Ensure kubeconfig placeholder exists (non-destructive)
###############################################################
- name: Ensure kubeconfig placeholder exists
  become: true
  ansible.builtin.copy:
    dest: "/home/{{ cloud_helper_user }}/.kube/config"
    content: |
      # kubeconfig will be populated after cluster bootstrap
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: "0600"
    force: no

###############################################################
# 5. Validate kubeadm installation
###############################################################
- name: Validate kubeadm installation
  become: false
  become_user: "{{ cloud_helper_user }}"
  ansible.builtin.command: kubeadm version
  register: kubeadm_check
  changed_when: false
  failed_when: kubeadm_check.rc != 0

###############################################################
# 6. Validate kubectl installation
###############################################################
- name: Validate kubectl installation
  become: false
  become_user: "{{ cloud_helper_user }}"
  ansible.builtin.command: kubectl version --client=true
  register: kubectl_check
  changed_when: false
  failed_when: kubectl_check.rc != 0

###############################################################
# 7. Validate crictl installation
###############################################################
- name: Validate crictl installation
  become: false
  become_user: "{{ cloud_helper_user }}"
  ansible.builtin.command: crictl --version
  register: crictl_check
  changed_when: false
  failed_when: crictl_check.rc != 0

