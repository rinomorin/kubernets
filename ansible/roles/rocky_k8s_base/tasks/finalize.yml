---
###############################################################
# Create raw disk
###############################################################
- name: Create raw disk
  command: truncate -s {{ disk_size }} {{ build_root }}/rocky-k8s-base.raw
  args:
    creates: "{{ build_root }}/rocky-k8s-base.raw"

###############################################################
# Partition disk
###############################################################
- name: Partition disk (GPT + ESP + root)
  command: >
    parted {{ build_root }}/rocky-k8s-base.raw --script
    mklabel gpt
    mkpart ESP fat32 1MiB 201MiB
    set 1 esp on
    mkpart root ext4 201MiB 100%

###############################################################
# Map loop device + format
###############################################################
- name: Map loop device
  command: losetup -fP --show {{ build_root }}/rocky-k8s-base.raw
  register: loopdev

- name: Format ESP
  command: mkfs.vfat {{ loopdev.stdout }}p1

- name: Format root
  command: mkfs.ext4 {{ loopdev.stdout }}p2

###############################################################
# Mount + populate
###############################################################
- name: Mount root partition
  mount:
    path: "{{ build_root }}/mnt"
    src: "{{ loopdev.stdout }}p2"
    fstype: ext4
    opts: defaults
    state: mounted

- name: Ensure /boot exists on ext4
  file:
    path: "{{ build_root }}/mnt/boot"
    state: directory

- name: Ensure /boot/efi exists
  file:
    path: "{{ build_root }}/mnt/boot/efi"
    state: directory

- name: Mount ESP at /boot/efi
  mount:
    path: "{{ build_root }}/mnt/boot/efi"
    src: "{{ loopdev.stdout }}p1"
    fstype: vfat
    opts: defaults
    state: mounted

- name: Debug mounts
  command: mount
  register: mount_output

- debug:
    var: mount_output.stdout_lines

- name: Copy rootfs into disk (exclude /boot/efi and symvers link)
  command: >
    rsync -aH --numeric-ids
    --exclude=boot/efi
    --exclude=boot/symvers-*.gz
    {{ build_root }}/rootfs/ {{ build_root }}/mnt/

###############################################################
# Install GRUB
###############################################################
- name: Rebuild RPM database in target
  command: rpm --root {{ build_root }}/mnt --rebuilddb

- name: Install GRUB packages into target
  command: >
    dnf --installroot={{ build_root }}/mnt
    --setopt=install_weak_deps=False
    install grub2-efi-x64 shim-x64
  args:
    creates: "{{ build_root }}/mnt/usr/sbin/grub2-install"

- name: Install GRUB bootloader
  command: >
    grub2-install --target=x86_64-efi
    --efi-directory={{ build_root }}/mnt/boot/efi
    --boot-directory={{ build_root }}/mnt/boot
    --removable
    --no-nvram

- name: Generate GRUB config
  command: grub2-mkconfig -o {{ build_root }}/mnt/boot/grub2/grub.cfg
