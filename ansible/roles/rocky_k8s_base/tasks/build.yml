---
- name: Detect Rocky major version
  delegate_to: localhost
  become: false
  shell: "source /etc/os-release && echo ${VERSION_ID%%.*}"
  register: rocky_major_raw

- name: Set Rocky major version fact
  set_fact:
    rocky_major: "{{ rocky_major_raw.stdout }}"

###############################################################
# Install minimal Rocky rootfs with CRI-O + Kubernetes
###############################################################
- name: Install Rocky rootfs with CRI-O + Kubernetes
  command: >
    dnf --releasever={{ rocky_major }}
    --installroot={{ build_root }}/rootfs
    --setopt=reposdir={{ build_root }}/rootfs/etc/yum.repos.d
    --disablerepo="*"
    --enablerepo=baseos
    --enablerepo=appstream
    --enablerepo=extras
    --enablerepo=crio
    --enablerepo=kubernetes
    --setopt=install_weak_deps=False
    --nodocs
    install -y
    rocky-release systemd bash coreutils util-linux iproute iputils
    openssh-server dracut kernel podman kubeadm kubectl
  args:
    creates: "{{ build_root }}/rootfs/usr/bin/bash"

###############################################################
# Install crictl from official GitHub release
###############################################################
- name: Set crictl version
  set_fact:
    crictl_version: "{{ lookup('env','crictl_version') | default('1.34.0', true) }}"

- name: Download crictl tarball
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{ crictl_version }}/crictl-v{{ crictl_version }}-linux-amd64.tar.gz"
    dest: "/tmp/crictl-{{ crictl_version }}.tar.gz"
    mode: "0644"

- name: Extract crictl binary
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/crictl-{{ crictl_version }}.tar.gz"
    dest: "{{ build_root }}/rootfs/usr/local/bin"
    remote_src: true

- name: Ensure crictl binary permissions
  become: true
  ansible.builtin.file:
    path: "{{ build_root }}/rootfs/usr/local/bin/crictl"
    mode: "0755"
    owner: root
    group: root

###############################################################
# Make it immutable-ish
###############################################################
- name: Remove package managers
  file:
    path: "{{ build_root }}/rootfs/usr/bin/{{ item }}"
    state: absent
  loop:
    - dnf
    - yum

- name: Install overlayfs units
  template:
    src: "{{ item.src }}"
    dest: "{{ build_root }}/rootfs/usr/lib/systemd/system/{{ item.dest }}"
  loop:
    - { src: "overlay-etc.service.j2", dest: "overlay-etc.service" }
    - { src: "overlay-var.service.j2", dest: "overlay-var.service" }

###############################################################
# Ensure systemd unit directory exists inside rootfs
###############################################################
- name: Ensure systemd unit directory exists
  file:
    path: "{{ build_root }}/rootfs/usr/lib/systemd/system"
    state: directory
    mode: '0755'

###############################################################
# Install overlayfs units into rootfs
###############################################################
- name: Install overlayfs units
  template:
    src: "{{ item.src }}"
    dest: "{{ build_root }}/rootfs/usr/lib/systemd/system/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "overlay-etc.service.j2", dest: "overlay-etc.service" }
    - { src: "overlay-var.service.j2", dest: "overlay-var.service" }

###############################################################
# Enable overlayfs units inside rootfs
###############################################################
- name: Enable overlayfs units inside rootfs
  command: >
    chroot {{ build_root }}/rootfs systemctl enable {{ item }}
  loop:
    - overlay-etc.service
    - overlay-var.service
