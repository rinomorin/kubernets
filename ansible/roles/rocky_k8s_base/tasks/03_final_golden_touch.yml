- name: set ssh user for golden-base
  set_fact:
    ansible_ssh_user: "core"
    
# ============================================================
# PLAY 2 — Provision Golden Image (runs inside VM)
# ============================================================
# --------------------------------------------------------
# Install podman
# --------------------------------------------------------
- name: Install podman
  become: true
  delegate_to: localhost
  shell: |
    ssh core@"{{ golden_ip }}" sudo dnf install -y podman
# --------------------------------------------------------
# Install kubeadm, kubelet, kubectl
# --------------------------------------------------------
- name: Install kubeadm, kubelet, kubectl
  become: true
  delegate_to: localhost
  shell: |
    ssh core@"{{ golden_ip }}" sudo dnf install -y kubeadm kubelet   kubectl

# --------------------------------------------------------
# Install crictl
# --------------------------------------------------------
- name: Set crictl version
  set_fact:
    crictl_version: "{{ lookup('env','crictl_version') | default('1.34.0', true) }}"

- name: Download crictl
  become: true
  delegate_to: localhost
  shell: |
    curl -L -o /tmp/crictl.tar.gz \
    "https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{ crictl_version }}/crictl-v{{ crictl_version }}-linux-amd64.tar.gz"

- name: Extract crictl
  become: true
  delegate_to: "{{ golden_ip }}"
  unarchive:
    src: "/tmp/crictl.tar.gz"
    dest: "/usr/local/bin"
    remote_src: true

- name: Ensure crictl permissions
  become: true
  delegate_to: "{{ golden_ip }}"
  file:
    path: "/usr/local/bin/crictl"
    mode: "0755"

# --------------------------------------------------------
# Prepare directories
# --------------------------------------------------------
- name: Ensure .kube directory exists
  become: true
  delegate_to: "{{ golden_ip }}"
  file:
    path: "/home/core/.kube"
    state: directory
    owner: "core"
    group: "core"
    mode: "0750"

- name: Create kubeconfig placeholder
  become: true
  delegate_to: "{{ golden_ip }}"
  copy:
    dest: "/home/core/.kube/config"
    content: |
      # kubeconfig will be populated after cluster bootstrap
    owner: "core"
    group: "core"
    mode: "0600"
    force: no

# --------------------------------------------------------
# Validate binaries
# --------------------------------------------------------
- name: Validate kubeadm
  become: false
  delegate_to: "{{ golden_ip }}"
  command: kubeadm version
  register: kubeadm_check
  changed_when: false
  failed_when: kubeadm_check.rc != 0

- name: Validate kubectl
  become: false
  delegate_to: "{{ golden_ip }}"
  command: kubectl version --client=true
  register: kubectl_check
  changed_when: false
  failed_when: kubectl_check.rc != 0

- name: Validate crictl
  command: crictl --version
  register: crictl_check
  changed_when: false
  failed_when: crictl_check.rc != 0

# --------------------------------------------------------
# Clean dynamic state before freezing image
# --------------------------------------------------------
- name: Clean machine-id
  become: true
  delegate_to: "{{ golden_ip }}"
  shell: |
    rm -f /etc/machine-id
    touch /etc/machine-id

- name: Clear logs
  become: true
  delegate_to: "{{ golden_ip }}"
  shell: |
    rm -rf /var/log/*

- name: Clear dnf cache
  become: true
  delegate_to: "{{ golden_ip }}"
  shell: dnf clean all

# --------------------------------------------------------
# Power off the golden image
# --------------------------------------------------------
- name: Power off golden image
  become: true
  delegate_to: "{{ golden_ip }}"
  shell: shutdown -h now
