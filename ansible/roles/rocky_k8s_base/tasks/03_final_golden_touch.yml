- name: set ssh user for golden-base
  set_fact:
    ansible_ssh_user: "core"
    
# ============================================================
# PLAY 2 — Provision Golden Image (runs inside VM)
# ============================================================
# --------------------------------------------------------
# Install podman
# --------------------------------------------------------
- name: Install podman
  become: true
  package:
    name: podman
    state: present

# --------------------------------------------------------
# Install kubeadm, kubelet, kubectl
# --------------------------------------------------------
- name: Install kubeadm, kubelet, kubectl
  become: true
  package:
    name:
      - kubeadm
      - kubelet
      - kubectl
    state: present

# --------------------------------------------------------
# Install crictl
# --------------------------------------------------------
- name: Set crictl version
  set_fact:
    crictl_version: "{{ lookup('env','crictl_version') | default('1.34.0', true) }}"

- name: Download crictl
  become: true
  get_url:
    url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{ crictl_version }}/crictl-v{{ crictl_version }}-linux-amd64.tar.gz"
    dest: "/tmp/crictl.tar.gz"

- name: Extract crictl
  become: true
  unarchive:
    src: "/tmp/crictl.tar.gz"
    dest: "/usr/local/bin"
    remote_src: true

- name: Ensure crictl permissions
  become: true
  file:
    path: "/usr/local/bin/crictl"
    mode: "0755"

# --------------------------------------------------------
# Prepare directories
# --------------------------------------------------------
- name: Ensure .kube directory exists
  become: true
  file:
    path: "/home/{{ cloud_helper_user }}/.kube"
    state: directory
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: "0750"

- name: Create kubeconfig placeholder
  become: true
  copy:
    dest: "/home/{{ cloud_helper_user }}/.kube/config"
    content: |
      # kubeconfig will be populated after cluster bootstrap
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: "0600"
    force: no

# --------------------------------------------------------
# Validate binaries
# --------------------------------------------------------
- name: Validate kubeadm
  command: kubeadm version
  register: kubeadm_check
  changed_when: false
  failed_when: kubeadm_check.rc != 0

- name: Validate kubectl
  command: kubectl version --client=true
  register: kubectl_check
  changed_when: false
  failed_when: kubectl_check.rc != 0

- name: Validate crictl
  command: crictl --version
  register: crictl_check
  changed_when: false
  failed_when: crictl_check.rc != 0

# --------------------------------------------------------
# Clean dynamic state before freezing image
# --------------------------------------------------------
- name: Clean machine-id
  become: true
  shell: |
    rm -f /etc/machine-id
    touch /etc/machine-id

- name: Clear logs
  become: true
  shell: |
    rm -rf /var/log/*

- name: Clear dnf cache
  become: true
  shell: dnf clean all

# --------------------------------------------------------
# Power off the golden image
# --------------------------------------------------------
- name: Power off golden image
  become: true
  shell: shutdown -h now
