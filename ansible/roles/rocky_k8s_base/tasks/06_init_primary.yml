---
- name: set provision_ip  from control_nodes
  set_fact:
    provision_ip: "{{ hostvars[groups['control_nodes'][0]]['provision_ip'] }}"
  run_once: true


- name: Initialize Kubernetes Cluster on Primary Master
  become: true
  shell: |
    kubeadm init \
      --control-plane-endpoint "{{ hostvars[groups['control_nodes'][0]]['inventory_hostname_short'] }}:6443" \
      --upload-certs \
      --pod-network-cidr=10.244.0.0/16 \
      --apiserver-advertise-address={{ provision_ip }}
  register: kubeadm_init_output
  args:
    creates: /etc/kubernetes/admin.conf

- name: Setup kubeconfig for core user
  become: true
  file:
    path: "/home/core/.kube"
    state: directory
    owner: core
    group: core

- name: Copy admin.conf
  become: true
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/core/.kube/config
    remote_src: yes
    owner: core
    group: core

- name: Install Flannel CNI
  become: false
  command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  register: cni_result

- name: Capture Join Commands
  shell: |
    echo "MASTER_JOIN=$(kubeadm token create --print-join-command) --control-plane --certificate-key $(kubeadm init phase upload-certs --upload-certs | tail -1)"
    echo "WORKER_JOIN=$(kubeadm token create --print-join-command)"
  register: join_cmds

- name: Share Join Commands via localhost
  set_fact:
    master_join_cmd: "{{ join_cmds.stdout_lines | grep 'MASTER_JOIN' | sed 's/MASTER_JOIN=//' }}"
    worker_join_cmd: "{{ join_cmds.stdout_lines | grep 'WORKER_JOIN' | sed 's/WORKER_JOIN=//' }}"
  delegate_to: localhost
  delegate_facts: true