---
- name: Prepare Manual Initialization (Primary Master)
  block:
    - name: Ensure Swap is off (Permanent)
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Disable swap immediately
      command: swapoff -a
      ignore_errors: true

    - name: Create the manual init script
      copy:
        dest: /home/core/manual_k8s_init.sh
        mode: '0755'
        owner: core
        group: core
        content: |
          #!/bin/bash
          echo "--- Disabling Firewalld ---"
          sudo systemctl disable --now firewalld
          echo "--- Ensuring CRI-O is active ---"
          sudo systemctl enable --now crio
          echo "--- Initializing Cluster ---"
          sudo kubeadm init \
            --control-plane-endpoint '{{ hostvars[groups["control_nodes"][0]].inventory_hostname }}:6443' \
            --upload-certs \
            --pod-network-cidr=10.244.0.0/16 \
            --apiserver-advertise-address={{ hostvars[groups["control_nodes"][0]].ansible_host }} \
            --cri-socket unix:///var/run/crio/crio.sock \
            --ignore-preflight-errors=Swap,SystemVerification

    - name: Final Instructions for Master
      debug:
        msg: 
          - "=========================================================="
          - "RUN ON PRIMARY MASTER: {{ inventory_hostname }}"
          - "Command: sudo /home/core/manual_k8s_init.sh"
          - "=========================================================="
  when: inventory_hostname == groups['control_nodes'][0]