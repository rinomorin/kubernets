---
- name: set provision_ip  from control_nodes
  set_fact:
    provision_ip: "{{ hostvars[groups['control_nodes'][0]]['provision_ip'] }}"
    prime_vm_name: "{{hostvars[groups['control_nodes'][0]]['hostname'].split('.')[0] }}"
  run_once: true

- name: "Bootstrap Master (CRI-O) and Initialize Cluster"
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR core@{{ this_vm_ip }} << 'EOF'
    # 1. Fix Kernel parameters (Required for CRI-O and K8s)
    cat << 'SYS' | sudo tee /etc/sysctl.d/k8s.conf
    net.bridge.bridge-nf-call-iptables  = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward                 = 1
    SYS
    sudo sysctl --system

    # 2. Ensure CRI-O and Kubelet are running
    sudo systemctl enable --now crio
    sudo systemctl enable --now kubelet

    # 3. Initialize K8s using the CRI-O socket
    if [ ! -f /etc/kubernetes/admin.conf ]; then
      sudo kubeadm init \
        --control-plane-endpoint "{{ hostvars[groups['control_nodes'][0]]['inventory_hostname_short'] }}:6443" \
        --upload-certs \
        --pod-network-cidr=10.244.0.0/16 \
        --apiserver-advertise-address={{ provision_ip }} \
        --cri-socket unix:///var/run/crio/crio.sock \
        --ignore-preflight-errors=Swap,SystemVerification
      
      echo "INITIALIZED_SUCCESS"
    fi

    # 4. Setup .kube config
    mkdir -p $HOME/.kube
    sudo cp -f /etc/kubernetes/admin.conf $HOME/.kube/config
    sudo chown $(id -u):$(id -g) $HOME/.kube/config

    # 5. Apply Flannel CNI
    kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
    EOF
  register: init_result
  when: 
    - "'kvm' in groups"
    - prime_vm_name is defined
    - "'mast01' in prime_vm_name"
  changed_when: "'INITIALIZED_SUCCESS' in init_result.stdout" 

- name: "Generate and Capture Join Commands"
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR core@{{ this_vm_ip }} << 'EOF'
    # Generate tokens and certificate keys
    M_TOKEN=$(sudo kubeadm token create --print-join-command)
    CERT_KEY=$(sudo kubeadm init phase upload-certs --upload-certs | tail -1)
    W_TOKEN=$(sudo kubeadm token create --print-join-command)

    echo "MASTER_JOIN=${M_TOKEN} --control-plane --certificate-key ${CERT_KEY}"
    echo "WORKER_JOIN=${W_TOKEN}"
    EOF
  register: join_cmds_raw
  when: 
    - "'kvm' in groups"
    - prime_vm_name is defined
    - "'mast01' in prime_vm_name"

- name: "Distribute Join Commands to Global Facts"
  set_fact:
    master_join_cmd: "{{ join_cmds_raw.stdout_lines | select('match', '^MASTER_JOIN=') | first | replace('MASTER_JOIN=', '') }}"
    worker_join_cmd: "{{ join_cmds_raw.stdout_lines | select('match', '^WORKER_JOIN=') | first | replace('WORKER_JOIN=', '') }}"
  delegate_to: localhost
  delegate_facts: true
  when: 
    - "'kvm' in groups"
    - prime_vm_name is defined
    - "'mast01' in prime_vm_name"
