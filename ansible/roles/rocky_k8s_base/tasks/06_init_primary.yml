---
- name: Configure Firewalld via SSH (Bypass Python dependency)
  vars:
    opt1: "-o StrictHostKeyChecking=no"
    opt2: "-o UserKnownHostsFile=/dev/null"
    opt3: "-o ConnectTimeout=10"  # Good safety for unreachable nodes
  shell: |
    ssh {{ opt1 }} {{ opt2 }} {{ opt3 }} core@{{ ansible_host }} \
    "sudo systemctl enable --now firewalld && \
     sudo firewall-cmd --permanent --add-port=10250/tcp --add-port=8472/udp \
     {% if 'control_nodes' in group_names %}
     --add-port=6443/tcp --add-port=2379-2380/tcp --add-port=10257/tcp --add-port=10259/tcp \
     {% else %}
     --add-port=30000-32767/tcp \
     {% endif %}
     && sudo firewall-cmd --reload"
  delegate_to: localhost
  register: firewall_out
  # Since firewall-cmd usually returns "success", we track that for "changed" status
  changed_when: "'success' in firewall_out.stdout or 'ALREADY_ENABLED' not in firewall_out.stderr"
  when: "'kvm' not in group_names"

- name: Install etcdctl via SSH (Bypass Python dependency)
  vars:
    etcd_ver: "v3.5.12"
    opt1: "-o StrictHostKeyChecking=no"
    opt2: "-o UserKnownHostsFile=/dev/null"
  block:
    - name: Download etcd tarball to Localhost
      delegate_to: localhost
      become: false
      get_url:
        url: "https://github.com/etcd-io/etcd/releases/download/{{ etcd_ver }}/etcd-{{ etcd_ver }}-linux-amd64.tar.gz"
        dest: "/tmp/etcd-{{ etcd_ver }}.tar.gz"
        mode: '0644'

    - name: SCP etcd tarball to remote node
      delegate_to: localhost
      become: false
      shell: |
        scp {{ opt1 }} {{ opt2 }} /tmp/etcd-{{ etcd_ver }}.tar.gz {{ ansible_user }}@{{ ansible_host }}:/tmp/etcd.tar.gz

    - name: Extract and Install etcdctl via SSH
      delegate_to: localhost
      become: false
      shell: |
        ssh {{ opt1 }} {{ opt2 }} {{ ansible_user }}@{{ ansible_host }} \
        "sudo tar -xzvf /tmp/etcd.tar.gz -C /tmp/ --strip-components=1 etcd-{{ etcd_ver }}-linux-amd64/etcdctl && \
         sudo mv /tmp/etcdctl /usr/local/bin/etcdctl && \
         sudo chmod +x /usr/local/bin/etcdctl && \
         sudo ln -sf /usr/local/bin/etcdctl /usr/bin/etcdctl && \
         rm -f /tmp/etcd.tar.gz"
      when: "'kvm' not in group_names"
  
    - name: Verify etcdctl version
      delegate_to: localhost
      become: false
      shell: |
        ssh {{ opt1 }} {{ opt2 }} {{ ansible_user }}@{{ ansible_host }} "etcdctl version"
      register: etcd_check
      changed_when: false
      when: "'kvm' not in group_names"
    

    - name: Show etcdctl version for {{ inventory_hostname }}
      debug:
        msg: "{{ etcd_check.stdout_lines[0] }}"
      when: "'kvm' not in group_names"
- name: Debug Firewall Output for {{ inventory_hostname }}
  debug:
    msg: "{{ firewall_out.stdout_lines }}"
  when: firewall_out.stdout is defined

- name: Prepare Manual Initialization (Primary Master)
  block:
    # This part still runs on the remote master to fix its fstab
    # - name: Ensure Swap is off (Permanent)
    #   replace:
    #     path: /etc/fstab
    #     regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    #     replace: '# \1'

    # This creates the file LOCALLY on your helper machine/laptop
    - name: Create the manual init script locally
      delegate_to: localhost
      become: false
      copy:
        dest: /tmp/manual_k8s_init.sh
        mode: '0755'
        content: |
          #!/bin/bash
          {% raw %}
          echo "--- Cleaning and Resetting ---"
          sudo kubeadm reset -f
          
          echo "--- Ensuring CRI-O is active ---"
          sudo systemctl enable --now crio
          
          echo "--- Initializing Cluster ---"
          sudo kubeadm init \
          {% endraw %}
            --control-plane-endpoint '{{ hostvars[groups["control_nodes"][0]].inventory_hostname }}:6443' \
            --upload-certs \
            --pod-network-cidr=10.244.0.0/16 \
            --apiserver-advertise-address={{ hostvars[groups["control_nodes"][0]].ansible_host }} \
            --cri-socket unix:///var/run/crio/crio.sock \
            --ignore-preflight-errors=Swap,SystemVerification | tee /tmp/kubeadm_output
          
          {% raw %}
          # Extract variables
          TOKEN=$(grep "kubeadm join" /tmp/kubeadm_output | head -n 1 | awk '{print $5}')
          HASH=$(grep "sha256:" /tmp/kubeadm_output | head -n 1 | awk '{print $2}')
          CERT_KEY=$(grep -A 1 "Using certificate key:" /tmp/kubeadm_output | tail -n 1 | xargs)

          if [ -z "$CERT_KEY" ] || [ ${#CERT_KEY} -lt 60 ]; then
             CERT_KEY=$(grep -E '^[a-f0-9]{64}$' /tmp/kubeadm_output | head -n 1)
          fi

          echo -e "\n\n=========================================================="
          echo "K8S INITIALIZATION COMPLETE"
          echo "=========================================================="
          {% endraw %}

          echo ############################
          echo # hint run the config
          echo ############################
          echo "--- To configure kubectl for your user, run: ---"
          echo "mkdir -p \$HOME/.kube"
          echo "sudo cp -i /etc/kubernetes/admin.conf \$HOME/.kube/config"
          # Escape both the $ and the opening ( to prevent immediate execution
          echo "sudo chown \$(id -u):\$(id -g) \$HOME/.kube/config"          echo
          echo kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

          echo ETCD_VER=v3.5.12
          echo ETCD_GOOGLE_URL=https://storage.googleapis.com/etcd
          echo DOWNLOAD_URL=\${GOOGLE_URL}
          echo
          echo  curl -L \${DOWNLOAD_URL}/\${ETCD_VER}/etcd-\${ETCD_VER}-linux-amd64.tar.gz -o /tmp/etcd.tar.gz
          echo  tar xzvf /tmp/etcd.tar.gz -C /tmp/ --strip-components=1
          echo  sudo mv /tmp/etcdctl /usr/local/bin/
          echo  rm -f /tmp/etcd.tar.gzS
          echo  sudo ln -s /usr/local/bin/etcdctl /usr/bin/etcdctl
          echo  sudo -f /tmp/etcd.tar.gz
          echo

          echo -e "\n--- COPY THIS FOR SECONDARY MASTERS ---"
          echo "sudo kubeadm join {{ hostvars[groups['control_nodes'][0]].ansible_host }}:6443 \\"
          echo "  --token $TOKEN \\"
          echo "  --discovery-token-ca-cert-hash $HASH \\"
          echo "  --control-plane --certificate-key $CERT_KEY \\"
          echo "  --ignore-preflight-errors=Swap,SystemVerification"

          echo -e "\n--- COPY THIS FOR WORKER NODES ---"
          echo "sudo kubeadm join {{ hostvars[groups['control_nodes'][0]].ansible_host }}:6443 \\"
          echo "  --token $TOKEN \\"
          echo "  --discovery-token-ca-cert-hash $HASH \\"
          echo "  --ignore-preflight-errors=Swap,SystemVerification"
          echo -e "\n==========================================================\n"

    # Now scp it from /tmp/ to the remote node
    - name: scp file to host
      delegate_to: localhost
      become: false
      shell: |
        scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
        /tmp/manual_k8s_init.sh core@{{ ansible_host }}:~/manual_k8s_init.sh

    - name: Instructions for Master
      debug:
        msg: "Run this on {{ inventory_hostname }}: sudo bash ~/manual_k8s_init.sh"

  when: inventory_hostname == groups['control_nodes'][0]