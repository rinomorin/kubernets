- name: "Initialize Primary Master Cluster"
  delegate_to: localhost
  run_once: true
  # REMOVED the 'when' clause that caused the skip
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
    core@{{ hostvars[groups['control_nodes'][0]]['provision_ip'] }} << 'EOF'
    # 1. Kernel Prerequisites
    cat << 'SYS' | sudo tee /etc/sysctl.d/k8s.conf
    net.bridge.bridge-nf-call-iptables  = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward                 = 1
    SYS
    sudo sysctl --system

    # 2. Ensure CRI-O and Kubelet are running
    sudo systemctl enable --now crio || sudo systemctl enable --now cri-o
    sudo systemctl enable --now kubelet

    # 3. Initialize K8s
    if [ ! -f /etc/kubernetes/admin.conf ]; then
      sudo kubeadm init \
        --control-plane-endpoint "{{ hostvars[groups['control_nodes'][0]]['hostname'].split('.')[0] }}:6443" \
        --upload-certs \
        --pod-network-cidr=10.244.0.0/16 \
        --apiserver-advertise-address={{ hostvars[groups['control_nodes'][0]]['provision_ip'] }} \
        --cri-socket unix:///var/run/crio/crio.sock \
        --ignore-preflight-errors=Swap,SystemVerification
      
      echo "INITIALIZED_SUCCESS"
    fi

    # 4. Config Setup
    mkdir -p $HOME/.kube
    sudo cp -f /etc/kubernetes/admin.conf $HOME/.kube/config
    sudo chown $(id -u):$(id -g) $HOME/.kube/config

    # 5. Network Setup (Flannel)
    kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
    EOF
  register: init_result
  when: inventory_hostname == groups['control_nodes'][0]
  changed_when: "'INITIALIZED_SUCCESS' in init_result.stdout"


- name: "Persist Init Output to Localhost"
  set_fact:
    primary_init_output: "{{ init_result.stdout }}"
  delegate_to: localhost
  delegate_facts: true
  run_once: true

- name: "Show Initialization Success"
  debug:
    msg: "{{ hostvars['localhost']['primary_init_output'] }}"
  run_once: true

- name: "Verify Master Initialization"
  fail:
    msg: "K8s Initialization failed! Check the output above."
  when: "'Your Kubernetes control-plane has initialized successfully!' not in hostvars['localhost']['primary_init_output']"
  run_once: true

- name: "Capture Join Commands"
  delegate_to: localhost
  run_once: true
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR \
    core@{{ hostvars[groups['control_nodes'][0]]['provision_ip'] }} << 'EOF'
    M_TOKEN=$(sudo kubeadm token create --print-join-command)
    CERT_KEY=$(sudo kubeadm init phase upload-certs --upload-certs | tail -1)
    echo "MASTER_JOIN=${M_TOKEN} --control-plane --certificate-key ${CERT_KEY}"
    echo "WORKER_JOIN=$(sudo kubeadm token create --print-join-command)"
    EOF
  register: join_cmds_raw

- name: show join_cmds_raw
  debug:
    msg: "{{ join_cmds_raw.stdout }}"

- name: "Set Global Join Facts"
  set_fact:
    master_join_cmd: "{{ join_cmds_raw.stdout_lines | select('match', '^MASTER_JOIN=') | first | replace('MASTER_JOIN=', '') }}"
    worker_join_cmd: "{{ join_cmds_raw.stdout_lines | select('match', '^WORKER_JOIN=') | first | replace('WORKER_JOIN=', '') }}"
  delegate_to: localhost
  delegate_facts: true
  run_once: true

- name: show *_join_cmd
  debug:
    msg: |
      MASTER_JOIN: "{{ master_join_cmd }}"
      WORKER_JOIN: "{{ worker_join_cmd }}"



