---
# ============================================================
# 05_cloning_golden.yml — TASKS ONLY (role‑compatible)
# ============================================================

# Golden image is always the same
- name: Set golden image variables
  set_fact:
    golden_vm: "golden-base"
    golden_disk: "/var/lib/libvirt/images/golden-base.qcow2"

# Build clone list from inventory groups
- name: Build clone node list (control + worker)
  set_fact:
    clone_nodes: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"

- name: Show clone targets
  debug:
    msg: "Cloning nodes: {{ clone_nodes }} from golden image {{ golden_vm }}"

# ------------------------------------------------------------
# Ensure golden-base is powered off
# ------------------------------------------------------------
- name: Ensure golden-base VM is shut down
  community.libvirt.virt:
    name: "{{ golden_vm }}"
    state: shutdown
  delegate_to: "{{ VM_HOST_IP }}"

- name: Wait for golden image to be powered off
  shell: sudo virsh domstate golden-base
  register: golden_power
  until: golden_power.stdout == "shut off"
  retries: 30
  delay: 2
  delegate_to: "{{ VM_HOST_IP }}"

# ------------------------------------------------------------
# Define cloned VMs using virt-clone
# ------------------------------------------------------------
- name: Define cloned VMs
  loop: "{{ clone_nodes }}"
  loop_control:
    loop_var: node
  shell: |
    sudo virt-clone \
      --original "{{ golden_vm }}" \
      --name "{{ node }}" \
      --file "/var/lib/libvirt/images/{{ node }}.qcow2" \
      --auto-clone
  args:
    creates: "/etc/libvirt/qemu/{{ node }}.xml"
  delegate_to: "{{ VM_HOST_IP }}"

# ------------------------------------------------------------
# Remove default NAT NIC from worker nodes (keep only br-*)
# ------------------------------------------------------------
- name: Remove default network interface from worker nodes
  loop: "{{ groups['worker_nodes'] }}"
  loop_control:
    loop_var: node
  shell: |
    # Find the NIC attached to the default network (usually 'default')
    nic=$(sudo virsh domiflist "{{ node }}" | awk '/default/ {print $1}')
    if [ -n "$nic" ]; then
      sudo virsh detach-interface "{{ node }}" network --mac $(sudo virsh domiflist "{{ node }}" | awk '/default/ {print $5}') --persistent
    fi
  delegate_to: "{{ VM_HOST_IP }}"

- name: Attach NoCloud ISO to each cloned VM
  delegate_to: "{{ VM_HOST_IP }}"
  block:
    - name: Run node check tasks
      include_tasks: chck_node.yml
      loop: "{{ clone_nodes }}"
      loop_control:
        loop_var: node
      vars:
        iso_path: "/var/lib/libvirt/images/nocloud/{{ node }}.iso"
  
- name: Start all cloned VMs
  delegate_to: "{{ VM_HOST_IP }}"
  community.libvirt.virt:
    name: "{{ item }}"
    state: running
  loop: "{{ clone_nodes }}"

- name: Wait for SSH to become available on all cloned VMs
  wait_for:
    host: "{{ hostvars[item]['ansible_host'] | default(item) }}"
    port: 22
    delay: 10
    timeout: 600
  loop: "{{ clone_nodes }}"
  delegate_to: localhost

- name: Collect DHCP leases from KVM Host
  shell: |
    for i in $(virsh list | grep msrlv | awk '{print $2}'); do 
      MAC=$(virsh domiflist $i | grep br-nat | awk '{print $NF}')
      IP=$(virsh net-dhcp-leases br-nat | grep "$MAC" | awk '{print $6}' | sed 's/\/24$//')
      echo "$i=$IP"
    done
  register: kvm_ips_output
  # Only run this on the KVM host(s)
  when: inventory_hostname in groups['kvm']

- name: Trigger configuration for each discovered VM
  include_tasks: node_config.yml
  loop: "{{ hostvars[groups['kvm'][0]].kvm_ips_output.stdout_lines | default([]) }}"
  loop_control:
    loop_var: vm_mapping