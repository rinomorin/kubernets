---
# ============================================================
# 05_cloning_golden.yml — TASKS ONLY (role‑compatible)
# ============================================================

# Golden image is always the same
- name: Set golden image variables
  set_fact:
    golden_vm: "golden-base"
    golden_disk: "/var/lib/libvirt/images/golden-base.qcow2"

# Build clone list from inventory groups
- name: Build clone node list (control + worker)
  set_fact:
    clone_nodes: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"

- name: Show clone targets
  debug:
    msg: "Cloning nodes: {{ clone_nodes }} from golden image {{ golden_vm }}"

# ------------------------------------------------------------
# Ensure golden-base is powered off
# ------------------------------------------------------------
- name: Ensure golden-base VM is shut down
  community.libvirt.virt:
    name: "{{ golden_vm }}"
    state: shutdown
  delegate_to: "{{ VM_HOST_IP }}"

- name: Wait for golden image to be powered off
  shell: sudo virsh domstate golden-base
  register: golden_power
  until: golden_power.stdout == "shut off"
  retries: 30
  delay: 2
  delegate_to: "{{ VM_HOST_IP }}"

# ------------------------------------------------------------
# Define cloned VMs using virt-clone
# ------------------------------------------------------------
- name: Define cloned VMs
  loop: "{{ clone_nodes }}"
  loop_control:
    loop_var: node
  shell: |
    sudo virt-clone \
      --original "{{ golden_vm }}" \
      --name "{{ node }}" \
      --file "/var/lib/libvirt/images/{{ node }}.qcow2" \
      --auto-clone
  args:
    creates: "/etc/libvirt/qemu/{{ node }}.xml"
  delegate_to: "{{ VM_HOST_IP }}"

# ------------------------------------------------------------
# Remove default NAT NIC from worker nodes (keep only br-*)
# ------------------------------------------------------------
- name: Remove default network interface from worker nodes
  loop: "{{ groups['worker_nodes'] }}"
  loop_control:
    loop_var: node
  shell: |
    # Find the NIC attached to the default network (usually 'default')
    nic=$(sudo virsh domiflist "{{ node }}" | awk '/default/ {print $1}')
    if [ -n "$nic" ]; then
      sudo virsh detach-interface "{{ node }}" network --mac $(sudo virsh domiflist "{{ node }}" | awk '/default/ {print $5}') --persistent
    fi
  delegate_to: "{{ VM_HOST_IP }}"

- name: Attach NoCloud ISO to each cloned VM
  delegate_to: "{{ VM_HOST_IP }}"
  block:
    - name: Run node check tasks
      include_tasks: chck_node.yml
      loop: "{{ clone_nodes }}"
      loop_control:
        loop_var: node
      vars:
        iso_path: "/var/lib/libvirt/images/nocloud/{{ node }}.iso"
  
- name: Start all cloned VMs
  delegate_to: "{{ VM_HOST_IP }}"
  community.libvirt.virt:
    name: "{{ item }}"
    state: running
  loop: "{{ clone_nodes }}"

- name: Wait for all msrlv VMs to obtain a DHCP lease
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    # 1. Get the list of VMs we are tracking
    VMS=$(sudo virsh list --all | grep msrlv | awk '{print $2}')
    TOTAL_VMS=$(echo "$VMS" | wc -l)
    
    # 2. Get the network prefix (e.g., "172.16") to ensure we grab the right lease
    NET_PREFIX=$(sudo virsh net-dumpxml br-nat | grep range | cut -d\' -f2 | cut -d\. -f1-2)

    while true; do
      FOUND_COUNT=0
      for i in $VMS; do
        # Check if this specific VM has a lease in our prefix
        MAC=$(sudo virsh domiflist $i | grep br-nat | awk '{print $NF}')
        HAS_IP=$(sudo virsh net-dhcp-leases br-nat | grep "$MAC" | grep "$NET_PREFIX" | wc -l)
        
        if [ "$HAS_IP" -gt 0 ]; then
          ((FOUND_COUNT++))
        fi
      done

      # If we found them all, exit the loop
      if [ "$FOUND_COUNT" -eq "$TOTAL_VMS" ] && [ "$TOTAL_VMS" -gt 0 ]; then
        echo "All $TOTAL_VMS VMs are up with IPs."
        break
      fi

      echo "Waiting... Found $FOUND_COUNT out of $TOTAL_VMS"
      sleep 5
    done
  register: wait_result
  when: "'kvm' in groups"

- name: Collect final mapping of Name to IP
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    # Re-run once to get the final list for Ansible looping
    # for i in $(sudo virsh list --all | grep msrlv|grep -E "mast|wrk" | awk '{print $2}'); do 
      MAC=$(sudo virsh domiflist $i | grep br-nat | awk '{print $NF}')
      IP=$(sudo virsh net-dhcp-leases br-nat | grep "$MAC" | awk '{print $5}' | sed 's/\/24$//')
      echo "$i=$IP"
    done
  register: kvm_ips_output
  when: "'kvm' in groups"

- name: Trigger configuration for discovered VMs
  include_tasks: node_config.yml
  loop: "{{ hostvars[groups['kvm'][0]].kvm_ips_output.stdout_lines | default([]) }}"
  loop_control:
    loop_var: vm_mapping
  when: "'kvm' in groups"

