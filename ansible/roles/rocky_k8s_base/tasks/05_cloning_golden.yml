---
# ============================================================
# 05_cloning_golden.yml — TASKS ONLY (role‑compatible)
# ============================================================

# Golden image is always the same
- name: Set golden image variables
  set_fact:
    golden_vm: "golden-base"
    golden_disk: "/var/lib/libvirt/images/golden-base.qcow2"

# Build clone list from inventory groups
- name: Build clone node list (control + worker)
  set_fact:
    clone_nodes: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"

- name: Show clone targets
  debug:
    msg: "Cloning nodes: {{ clone_nodes }} from golden image {{ golden_vm }}"

# ------------------------------------------------------------
# Ensure golden-base is powered off
# ------------------------------------------------------------
- name: Check golden-base power state
  shell: sudo virsh domstate golden-base
  register: golden_state
  delegate_to: "{{ VM_HOST_IP }}"

- name: Shutdown golden-base if running
  when: golden_state.stdout == "running"
  shell: sudo virsh shutdown golden-base
  delegate_to: "{{ VM_HOST_IP }}"

- name: Wait for golden image to be powered off
  shell: sudo virsh domstate golden-base
  register: golden_power
  until: golden_power.stdout == "shut off"
  retries: 30
  delay: 2
  delegate_to: "{{ VM_HOST_IP }}"

# ------------------------------------------------------------
# Define cloned VMs using virt-clone
# ------------------------------------------------------------
- name: Define cloned VMs
  loop: "{{ clone_nodes }}"
  loop_control:
    loop_var: node
  shell: |
    sudo virt-clone \
      --original "{{ golden_vm }}" \
      --name "{{ node }}" \
      --file "/var/lib/libvirt/images/{{ node }}.qcow2" \
      --auto-clone
  args:
    creates: "/etc/libvirt/qemu/{{ node }}.xml"
  delegate_to: "{{ VM_HOST_IP }}"

# ------------------------------------------------------------
# Remove default NAT NIC from worker nodes (keep only br-*)
# ------------------------------------------------------------
- name: Remove default network interface from worker nodes
  loop: "{{ groups['worker_nodes'] }}"
  loop_control:
    loop_var: node
  shell: |
    # Find the NIC attached to the default network (usually 'default')
    nic=$(sudo virsh domiflist "{{ node }}" | awk '/default/ {print $1}')
    if [ -n "$nic" ]; then
      sudo virsh detach-interface "{{ node }}" network --mac $(sudo virsh domiflist "{{ node }}" | awk '/default/ {print $5}') --persistent
    fi
  delegate_to: "{{ VM_HOST_IP }}"

- name: Attach all NoCloud ISOs to matching VMs
  delegate_to: "{{ VM_HOST_IP }}"
  when: "'kvm' in group_names"
  shell: |
    ISO_DIR="/var/lib/libvirt/images/nocloud"

    for iso in "${ISO_DIR}"/*.iso; do
      [ -e "$iso" ] || continue

      filename="$(basename "$iso")"
      vm="${filename%.iso}"

      # Check if VM exists
      if ! sudo virsh list --all --name | grep -qx "$vm"; then
        echo "VM '$vm' does not exist, skipping."
        continue
      fi

      # Check if ISO already attached
      if sudo virsh domblklist "$vm" | grep -q "$filename"; then
        echo "ISO already attached to $vm, skipping."
        continue
      fi

      echo "Attaching $iso to $vm"
      sudo virsh attach-disk "$vm" "$iso" sdc --type cdrom --mode readonly --persistent
    done

- name: Start all control + worker VMs from hypervisor
  delegate_to: "{{ VM_HOST_IP }}"
  when: "'kvm' in group_names"
  shell: |
    # Build VM list from Ansible inventory
    VM_LIST="{{ groups['control_nodes'] | join(' ') }} {{ groups['worker_nodes'] | join(' ') }}"

    for vm in $VM_LIST; do
      # Check VM exists
      if ! sudo virsh list --all --name | grep -qx "$vm"; then
        echo "VM '$vm' does not exist on this hypervisor, skipping."
        continue
      fi

      # Check if already running
      if sudo virsh domstate "$vm" | grep -q "running"; then
        echo "VM '$vm' already running, skipping."
        continue
      fi

      echo "Starting VM '$vm'"
      sudo virsh start "$vm" || echo "Failed to start $vm"
    done

- name: Wait for cloud-init to finish
  wait_for:
    host: "{{ ansible_host }}"
    port: 22
    delay: 10
    timeout: 600

- name: Check cloud-init status
  become: yes
  command: cloud-init status --wait
  register: cloudinit_status
  changed_when: false
  when: 
    - inventory_hostname != 'kvmdc01'
    - inventory_hostname in groups['control_nodes'] or inventory_hostname in groups['worker_nodes']
