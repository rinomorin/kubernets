---
- name: "Parse mapping for {{ vm_mapping }}"
  set_fact:
    this_vm_name: "{{ (vm_mapping.split('='))[0] }}"
    this_vm_ip: "{{ (vm_mapping.split('='))[1] }}"

- debug:
    msg: |
      this_vm_name is {{ this_vm_name }}
      this_vm_ip is {{ this_vm_ip }}
      vm_mapping is {{ vm_mapping }}

- name: "Wait for SSH Login to be successful on {{ this_vm_ip }}"
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
        -o ConnectTimeout=5 -o BatchMode=yes \
        core@{{ this_vm_ip }} /bin/true
  register: ssh_check
  until: ssh_check.rc == 0
  retries: 60
  delay: 5
  # This acts as your 300-second timeout (60 retries * 5s delay)

---
- name: "Parse mapping for {{ vm_mapping }}"
  set_fact:
    this_vm_name: "{{ vm_mapping.split('=')[0] }}"
    this_vm_ip: "{{ vm_mapping.split('=')[1] }}"

- name: "Wait for SSH Login to {{ this_vm_name }}"
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
        -o ConnectTimeout=5 -o BatchMode=yes \
        core@{{ this_vm_ip }} /bin/true
  register: ssh_check
  until: ssh_check.rc == 0
  retries: 60
  delay: 5

- name: "Apply static networking and verify"
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null core@{{ this_vm_ip }} << EOF
    # Set Provisioning IP
    {% if hostvars[this_vm_name]['provision_ip'] is defined %}
    sudo nmcli con modify enp2s0 ipv4.addresses {{ hostvars[this_vm_name]['provision_ip'] }}/24 ipv4.method manual ipv4.gateway ""
    sudo nmcli con up enp2s0
    {% endif %}

    # Set Provider IP
    {% if hostvars[this_vm_name]['provider_ip'] is defined %}
    sudo nmcli con modify enp3s0 ipv4.addresses {{ hostvars[this_vm_name]['provider_ip'] }}/24 ipv4.method manual
    sudo nmcli con up enp3s0
    {% endif %}

    # Wait a second for NM to settle and then show current IPs
    sleep 2
    echo "--- FINAL IP STATE ---"
    ip -4 -br addr show
    EOF
  register: fix_ip_result
  when: this_vm_name in groups['cluster_nodes']

- name: Show Final IP State for {{ this_vm_name }}
  debug:
    var: fix_ip_result.stdout_lines

- name: "Show results"
  debug:
    msg: |
    
      fix_ip_result is {{ fix_ip_result.stdout }}

- name: Get update ipa
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null core@{{ this_vm_ip }} ip a s
  register: ip_result

    
- debug:
    msg: |
      ip_result is {{ ip_result.stdout }}
