- name: Find Butane files
  find:
    paths: "{{ butane_input_dir }}"
    patterns: "*.bu"
  register: bu_files

- name: Compile Butane to Ignition
  command: >
    {{ butane_binary }} {{ item.path }} --pretty --strict=false
  register: ign_output
  loop: "{{ bu_files.files }}"
  changed_when: true
  args:
    chdir: "{{ ignition_output_dir }}"

- name: Write Ignition output to file
  copy:
    content: "{{ item.1.stdout }}"
    dest: "{{ ignition_output_dir }}/{{ item.0.path | basename | replace('.bu', '.ign') }}"
    mode: '0644'
  with_together:
    - "{{ bu_files.files }}"
    - "{{ ign_output.results }}"
