- name: Install CRI-O
  become: true
  package:
    name:
      - cri-o
      - cri-tools
    state: present

- name: Enable and start CRI-O
  become: true
  systemd:
    name: crio
    enabled: true
    state: started

- name: Install kubeadm, kubelet, kubectl
  become: true
  package:
    name:
      - kubeadm
      - kubelet
      - kubectl
    state: present

- name: Enable kubelet
  become: true
  systemd:
    name: kubelet
    enabled: true
