---
# Run only on the first control-plane node

- name: Initialize Kubernetes control plane on first master
  become: yes
  delegate_to: "{{ groups['control_nodes'][0] }}"
  run_once: true
  block:
    - name: Stop kubelet before kubeadm init
      raw: systemctl stop kubelet || true

    - name: Enable IPv4 forwarding
      raw: sysctl -w net.ipv4.ip_forward=1

    - name: Persist IPv4 forwarding
      raw: echo "net.ipv4.ip_forward=1" > /etc/sysctl.d/99-kubernetes-ipforward.conf

    - name: Run kubeadm init on first master
      raw: kubeadm init --config=/etc/kubernetes/kubeadm-config.yaml --v=5
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Configure kubeconfig for core user
      raw: |
        mkdir -p /home/core/.kube
        cp /etc/kubernetes/admin.conf /home/core/.kube/config
        chown core:core /home/core/.kube/config
        chmod 600 /home/core/.kube/config
