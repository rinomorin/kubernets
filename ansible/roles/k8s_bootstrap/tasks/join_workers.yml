---
- name: Generate worker join command on first master
  become: yes
  delegate_to: "{{ groups['control_nodes'][0] }}"
  run_once: true
  command: kubeadm token create --print-join-command --ttl 24h
  register: worker_join_cmd

- name: Join worker nodes to the cluster
  become: yes
  command: "{{ worker_join_cmd.stdout }} --v=5"
  args:
    creates: /etc/kubernetes/kubelet.conf
  loop: "{{ groups['worker_nodes'] | default([]) }}"
  loop_control:
    loop_var: worker_node
  delegate_to: "{{ worker_node }}"
