---
- name: Show remote user
  debug:
    msg:
      - "Ansible configured user: {{ ansible_user }}"
      - "Actual remote user: {{ ansible_user_id }}"

# Install Kubernetes prerequisites (CRI-O, kubelet, kubeadm, kubectl)
- name: Install Kubernetes prerequisites
  include_tasks: install_prereqs.yml

# Initialize the control plane on the master node(s)
- name: Initialize Kubernetes control plane
  include_tasks: init_master.yml

# Install the CNI plugin (Calico, Cilium, etc.)
- name: Install CNI plugin
  include_tasks: install_cni.yml

# Join worker nodes to the cluster
- name: Join worker nodes
  include_tasks: join_workers.yml

# Validate cluster health
- name: Validate cluster state
  include_tasks: validate_cluster.yml
