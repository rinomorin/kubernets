---
#
# cloud_helper_prep — KVM Host Preparation
# Ensures libvirt is running, networks exist, are active, and autostart.
# All KVM interactions are executed FROM the helper node AS cloud_helper_user.
#
# ============================================================
# cloud_prechecks: Detect-only — KVM host readiness
# ============================================================
- name: Install libvirt sudoers policy
  delegate_to: "{{kvm_host}}"
  become: yes
  vars:
    this_group: "libvirt"
    kvm_host_pattern: "{{VM_HOST.split('.')[0][:5]}}[0-9][0-9]*"
  template:
    src: libvirt_sudoers.j2
    dest: /etc/sudoers.d/DFLT_LIBVIRT_LCL
    owner: root
    group: root
    mode: '0440'

- name: Insert libvirt include into /etc/sudoers
  delegate_to: "{{kvm_host}}"
  become: yes
  lineinfile:
    path: /etc/sudoers
    line: "#include /etc/sudoers.d/DFLT_LIBVIRT_LCL"
    insertafter: "^##include /etc/sudoers.d/3xx_MORINSOFT_{application}_LCL"
    state: present
    validate: "/usr/sbin/visudo -cf %s"


###############################################################
# 1. Ensure helper user exists
###############################################################
- name: Ensure helper user exists
  delegate_to: "{{kvm_host}}"
  become: true
  user:
    name: "{{ cloud_helper_user }}"
    shell: /bin/bash
    create_home: yes
  become: true

- name: Ensure helper user is in required groups
  become: true
  user:
    name: "{{ cloud_helper_user }}"
    groups:
      - kvm
      - libvirt
      - awx_automate
    append: true
  delegate_to: "{{kvm_host}}"

###############################################################
# 2. Ensure libvirtd is running on the KVM host
###############################################################
- name: Ensure libvirtd is enabled and running on KVM host
  delegate_to: helper
  become: true
  become_user: "{{ cloud_helper_user }}"
  shell: >
    ssh {{ kvm_host }} "sudo systemctl enable --now libvirtd"
  changed_when: false

###############################################################
# 3. Debug libvirt networks from inventory
###############################################################
- name: Debug libvirt networks from inventory
  debug:
    msg: "{{ kvm_libvirt_networks }}"

###############################################################
# 4. Detect libvirt networks on KVM host (plain SSH)
###############################################################
- name: Detect libvirt networks on KVM host
  delegate_to: helper
  become: true
  become_user: "{{ cloud_helper_user }}"
  shell: >
    ssh {{ kvm_host }} "virsh -c qemu:///system net-info {{ item.name }}" || true
  register: libvirt_net_check
  ignore_errors: true
  changed_when: false
  loop: "{{ kvm_libvirt_networks }}"

###############################################################
# 5. Ensure libvirt networks are defined on KVM host
###############################################################
- name: Ensure libvirt networks are defined on KVM host
  delegate_to: helper
  become: true
  become_user: "{{ cloud_helper_user }}"
  shell: >
    ssh {{ kvm_host }}
    "virsh -c qemu:///system net-info {{ item.name }} >/dev/null 2>&1 ||
     virsh -c qemu:///system net-define /etc/libvirt/qemu/networks/{{ item.name }}.xml"
  loop: "{{ kvm_libvirt_networks }}"
  changed_when: false

###############################################################
# 6. Ensure libvirt networks are active
###############################################################
- name: Ensure libvirt networks are active
  delegate_to: helper
  become: true
  become_user: "{{ cloud_helper_user }}"
  shell: >
    ssh {{ kvm_host }}
    "virsh -c qemu:///system net-info {{ item.name }} | grep -q 'Active:.*yes' ||
     virsh -c qemu:///system net-start {{ item.name }}"
  loop: "{{ kvm_libvirt_networks }}"
  changed_when: false

###############################################################
# 7. Ensure libvirt networks autostart
###############################################################
- name: Ensure libvirt networks autostart
  delegate_to: helper
  become: true
  become_user: "{{ cloud_helper_user }}"
  shell: >
    ssh {{ kvm_host }} "virsh -c qemu:///system net-autostart {{ item.name }}"
  loop: "{{ kvm_libvirt_networks }}"
  changed_when: false

###############################################################
# 8. Validate libvirt networks exist on KVM host
###############################################################
- name: Validate libvirt networks exist on KVM host
  delegate_to: helper
  become: true
  become_user: "{{ cloud_helper_user }}"
  shell: >
    ssh {{ kvm_host }} "virsh -c qemu:///system net-info {{ item.name }}"
  loop: "{{ kvm_libvirt_networks }}"
  register: kvm_net_info
  failed_when: kvm_net_info.rc != 0
  changed_when: false

###############################################################
# 9. Validate reachability to KVM host (only the host itself)
###############################################################
- name: Validate reachability to KVM host
  delegate_to: helper
  become: true
  become_user: "{{ cloud_helper_user }}"
  command: ping -c 1 {{ kvm_host }}
  register: ping_kvm
  failed_when: ping_kvm.rc != 0
  changed_when: false

###############################################################
# 10. Debug NIC ordering for VM provisioning (documentation only)
###############################################################
- name: Debug VM NIC ordering (FCOS)
  debug:
    msg:
      vm_nic_1: "enp3s0 → maintenance → br-nat"
      vm_nic_2: "enp4s0 → provisioning → br-cluster"
      vm_nic_3: "enp5s0 → provider → default"

###############################################################
# 11. Debug NIC ordering for helper node (documentation only)
###############################################################
- name: Debug helper NIC ordering
  debug:
    msg:
      helper_nic_1: "enp1s0 → provider → default"
      helper_nic_2: "enp2s0 → provisioning → br-cluster"
      helper_nic_3: "enp3s0 → maintenance → br-nat"
