---
- name: Ensure base ansible directory exists
  file:
    path: "{{ cloud_helper_workdir }}/ansible"
    state: directory
    mode: "0755"

- name: Create roles directory structure
  file:
    path: "{{ cloud_helper_workdir }}/ansible/roles/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ignition
    - vm_create
    - coreos_install
    - kubeadm_init
    - kubeadm_join
    - cluster_validate

- name: Create cloud_build.yml placeholder
  copy:
    dest: "{{ cloud_helper_workdir }}/ansible/cloud_build.yml"
    content: |
      # cloud_build.yml
      # This file is intentionally empty. Populate with playbook logic.
    mode: "0644"
  when: not lookup('fileglob', cloud_helper_workdir ~ '/ansible/cloud_build.yml', errors='ignore')

- name: Create env_vars.sh with environment-driven values
  blockinfile:
    path: "{{ cloud_helper_workdir }}/ansible/env_vars.sh"
    create: yes
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED ENV VARS"
    block: |
      #!/usr/bin/env bash
      {% for key, value in cloud_helper_env_vars.items() %}
      export {{ key }}="{{ value }}"
      {% endfor %}

- name: Create cloud_build.yml playbook
  copy:
    dest: "{{ cloud_helper_workdir }}/ansible/cloud_build.yml"
    mode: "0644"
    content: |
      - name: Build the cloud (1 master, 2 workers)
        hosts: helper
        become: true
        become_user: "{{ cloud_helper }}"
        gather_facts: false

        roles:
          - ignition
          - vm_create
          - coreos_install
          - kubeadm_init
          - kubeadm_join
          - cluster_validate
  when: not lookup('fileglob', cloud_helper_workdir ~ '/ansible/cloud_build.yml', errors='ignore')

- name: Ensure inventory directory exists
  file:
    path: "{{ cloud_helper_workdir }}/ansible/inventory"
    state: directory
    mode: "0755"

- name: Create hosts.ini inventory
  copy:
    dest: "{{ cloud_helper_workdir }}/ansible/inventory/hosts.ini"
    mode: "0644"
    content: |
      [helper]
      helper ansible_host=192.168.100.10 cloud_helper=secops cloud_helper_workdir=/opt/cloud_helper

      [kvm]
      kvmhost ansible_host=192.168.100.20

      [masters]
      msrlv9mast01 vm_cpu=4 vm_ram_mb=8192 vm_disk_gb=40 vm_fcos_channel=stable

      [workers]
      msrlv9wrk01 vm_cpu=4 vm_ram_mb=8192 vm_disk_gb=40 vm_fcos_channel=stable
      msrlv9wrk02 vm_cpu=4 vm_ram_mb=8192 vm_disk_gb=40 vm_fcos_channel=stable
  when: not lookup('fileglob', cloud_helper_workdir ~ '/ansible/inventory/hosts.ini', errors='ignore')
