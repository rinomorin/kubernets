---
#
# cloud_helper_prep — Helper Node Preparation
# Prepares the helper node environment, user, SSH keys, venv, and packages.
#

###############################################################
# 1. Ensure helper user exists
###############################################################
- name: Ensure helper user exists
  user:
    name: "{{ cloud_helper_user }}"
    shell: /bin/bash
    create_home: yes
  become: true

###############################################################
# 2. Ensure helper working directories exist
###############################################################
- name: Ensure helper working directory exists
  file:
    path: "{{ cloud_helper_workdir }}"
    state: directory
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: '0755'
  become: true

- name: Ensure helper bin directory exists
  file:
    path: "{{ cloud_helper_bin_dir }}"
    state: directory
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: '0755'
  become: true

###############################################################
# 3. Ensure SSH keypair for helper exists
###############################################################
- name: Ensure helper SSH private key exists
  become: true
  become_user: "{{ cloud_helper_user }}"
  command: >
    ssh-keygen -t rsa -b 4096 -N '' -f {{ cloud_helper_ssh_key }}
  args:
    creates: "{{ cloud_helper_ssh_key }}"

- name: Ensure helper SSH public key exists
  file:
    path: "{{ cloud_helper_ssh_pubkey }}"
    state: file
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: '0644'
  become: true

###############################################################
# 4. Ensure helper packages are installed
###############################################################
- debug:
    msg: "Installing helper packages: {{ cloud_helper_packages }}"
- name: Install helper packages
  package:
    name: "{{ cloud_helper_packages }}"
    state: present
  become: true

###############################################################
# 5. Ensure Python venv exists
###############################################################
- name: Ensure python3-venv tools installed
  package:
    name:
      - python3
      - python3-pip
    state: present
  become: true

- name: Ensure cloud_helper venv directory exists
  file:
    path: "{{ cloud_helper_venv_path }}"
    state: directory
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: '0755'
  become: true

- name: Create venv if missing
  become: true
  become_user: "{{ cloud_helper_user }}"
  command: python3 -m venv "{{ cloud_helper_venv_path }}"
  args:
    creates: "{{ cloud_helper_venv_path }}/bin/activate"

###############################################################
# 6. Upgrade pip inside venv
###############################################################
- name: Upgrade pip inside venv
  become: true
  become_user: "{{ cloud_helper_user }}"
  shell: "{{ cloud_helper_venv_path }}/bin/pip install --upgrade pip"

###############################################################
# 7. Install ansible inside venv
###############################################################
- name: Install ansible inside venv
  become: true
  become_user: "{{ cloud_helper_user }}"
  shell: "{{ cloud_helper_venv_path }}/bin/pip install ansible"
