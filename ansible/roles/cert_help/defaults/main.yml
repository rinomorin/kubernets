ipa_domain: "{{ ipa_domain }}"
cloud_zone: "{{ cloud_zone }}"
# ipa_admin_principal: "admin"
ipa_admin_password: "{{ lookup('env', 'ipa_admin_password')}}"

# ipa_domain: "{{ lookup('env', 'ipa_domain') |lower}}"
# ipa_master: "{{ lookup('env', 'ipa_master') |lower}}"
# ipa_realm:  "{{ lookup('env', 'ipa_domain') |upper}}"
# ipa_dm_password: "{{ lookup('env', 'ipa_dm_password')}}"
#

cert_common_name: "{{ inventory_hostname }}"
cert_principal: "host/{{ inventory_hostname }}.{{ ipa_domain }}@{{ ipa_domain|upper }}"
cert_key_path: "/etc/pki/tls/private/{{ inventory_hostname_short }}.key"
cert_csr_path: "/etc/pki/tls/certs/{{ inventory_hostname_short }}.csr"
cert_crt_path: "/etc/pki/tls/certs/{{ inventory_hostname_short }}.crt"
cert_ca_chain_path: "/etc/pki/tls/certs/ipa-ca.crt"
ipa_admin_principal:  "{{ lookup('env', 'ipa_admin_principal')}}"

nginx_root: "/srv/fcos/http"
nat_ip: "{{ lookup('env', 'nat_ip_device') | default('172.16.0.20', true) }}"
nat_ip_device: "{{ lookup('env', 'nat_ip_device') | default('172.16.0.20', true) }}"

