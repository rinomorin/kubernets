- name: Ensure cloud_helper venv directory exists
  file:
    path: /opt/cloud_helper/venv
    state: directory
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: '0755'

- name: Create Python venv for cloud_helper
  become: yes
  become_user: "{{ cloud_helper_user }}"
  command: python3 -m venv /opt/cloud_helper/venv
  args:
    creates: /opt/cloud_helper/venv/bin/activate

- name: Install Ansible inside cloud_helper venv
  become: yes
  become_user: "{{ cloud_helper_user }}"
  command: /opt/cloud_helper/venv/bin/pip install --upgrade ansible

- name: Add venv activation to cloud_helper shell profile
  become: yes
  become_user: "{{ cloud_helper_user }}"
  lineinfile:
    path: ~/.bashrc
    line: 'source /opt/cloud_helper/venv/bin/activate'
    state: present

- set_fact:
    cloud_helper_ansible_bin: "/opt/cloud_helper/venv/bin/ansible"
    cloud_helper_python_bin: "/opt/cloud_helper/venv/bin/python"

- name: Ensure virsh-remote wrapper uses cloud_helper venv
  template:
    src: virsh-remote.j2
    dest: /opt/cloud_helper/bin/virsh-remote
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: '0755'
