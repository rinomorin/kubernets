- name: who am I
  command: whoami
  become: false
  register: whoami_out
- debug:
    msg: "Current user is {{ whoami_out.stdout }}"
 
- name: set vm_host to inventory_hostname if not defined
  set_fact:
    vm_host: "{{ inventory_hostname_short }}"
  when: vm_host is not defined
  delegate_to: localhost
  become: false

- name: Create local sudoers staging directory
  become: false
  file:
    path: "/tmp/{{ vm_host }}/etc/sudoers.d"
    state: directory
    mode: '0755'
    recurse: true
  delegate_to: localhost

- name: Render sudoers template
  template:
    src: "{{ item.1 }}.j2"
    dest: "/tmp/{{ vm_host }}/etc/sudoers.d/{{ item.1 }}"
    mode: '0440'
    force: true
  vars:
    this_group: "{{ item.0.key }}"
  loop: "{{ template_map | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }}/{{ item.1 }}"
  when: 
    - item is defined
    - item.0.key in default_groups
  become: false
  delegate_to: localhost

- name: Render main  sudoers template
  become: false
  vars:
    this_host: "{{ vm_host }}"
    THiS_ACCOUNT: "{{ ACCOUNT | upper}}"
    TMPPATH: "/tmp/{{ vm_host }}"
  template:
    src: "sudoers.j2"
    dest: "/tmp/{{ vm_host }}/etc/sudoers"
    mode: '0440'
    force: true
  delegate_to: localhost


- name: Validate sudoers template with visudo
  become: false
  command: >
    visudo -cf /tmp/{{ vm_host }}/etc/sudoers.d/{{ item.1 }}
  loop: "{{ template_map | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.1 }}"
  delegate_to: localhost

- name: Rename sudoers files with ACCOUNT in filename
  find:
    paths: "/tmp/{{ vm_host }}/etc/sudoers.d"
    patterns: "*ACCOUNT*"
    use_regex: false
  register: account_files
  delegate_to: localhost
  become: false

- name: Rename each ACCOUNT file to uppercase ACCOUNT
  command: >
    mv "{{ item.path }}"
       "{{ item.path | regex_replace('ACCOUNT', ACCOUNT | upper) }}"
  loop: "{{ account_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  delegate_to: localhost
  become: false

- name: Validate sudoers with visudo
  command: >
    visudo -cf /tmp/{{ vm_host }}/etc/sudoers
  delegate_to: localhost
  become: false
  register: visudo_check
  failed_when: visudo_check.rc != 0

- name: Copy validated sudoers files to clean staging path
  copy:
    src: "/tmp/{{ vm_host }}/etc/sudoers.d/"
    dest: "/tmp/{{ vm_host }}/final/etc/sudoers.d/"
    remote_src: false
  delegate_to: localhost
  become: false

- name: Copy validated sudoers file to clean staging path
  copy:
    src: "/tmp/{{ vm_host }}/etc/sudoers"
    dest: "/tmp/{{ vm_host }}/final/etc/sudoers"
    remote_src: false
  delegate_to: localhost
  become: false

- name: Gather staged files from localhost
  slurp:
    src: "{{ item }}"
  register: staged_files
  delegate_to: localhost
  become: false
  loop: "{{ lookup('fileglob', '/tmp/' ~ vm_host ~ '/etc/*', wantlist=True) }}"

- name: Gather remote files from VM
  slurp:
    src: "/etc/{{ item | basename }}"
  register: remote_files
  delegate_to: "{{ vm_host }}"
  # vars:
  #   ansible_user: "{{ admin_id }}"
  #   ansible_ssh_pass: "{{ admin_set }}"
  #   ansible_host: "{{ vm_fqdn }}"
  become: true
  loop: "{{ lookup('fileglob', '/tmp/' ~ vm_host ~ '/etc/*', wantlist=True) }}"

- name: Initialize match flag
  set_fact:
    all_files_match: true

- name: Flip flag if any file differs
  set_fact:
    all_files_match: false
  when: (item.0.content | b64decode) != (item.1.content | b64decode)
  loop: "{{ staged_files.results | zip(remote_files.results) | list }}"

- name: Remove /tmp/{{ vm_host }} from sudoers file
  ansible.builtin.replace:
    path: "/tmp/{{ vm_host }}/etc/sudoers"
    regexp: "/tmp/{{ vm_host }}"
    replace: ""
  delegate_to: localhost
  become: false
  register: clean_sudo
    
- name: run if needed
  block:
    - name: Copy validated main sudoers files to clean staging path
      become: false
      copy:
        src: "/tmp/{{ vm_host }}/etc/sudoers"
        dest: "/tmp/{{ vm_host }}/final/etc/sudoers"
      delegate_to: localhost

    - name: Archive final sudoers bundle starting at etc/
      become: false
      archive:
        path: "/tmp/{{ vm_host }}/final/etc"
        dest: "/tmp/{{ vm_host }}/sudoers_bundle.zip"
        format: zip
      delegate_to: localhost

    - name: Copy sudoers tarball to guest
      copy:
        src: "/tmp/{{ vm_host }}/sudoers_bundle.zip"
        dest: "/tmp/sudoers_bundle.zip"

    - name: Ensure unzip is present on guest
      delegate_to: "{{ vm_host }}"
      package:
        name: unzip
        state: present
      become: true

    - name: Extract sudoers bundle and fix ownership
      become: true
      shell: |
        unzip -o -qq /tmp/sudoers_bundle.zip -d / || true
        chown -R root:root /etc/sudoers /etc/sudoers.d
        chmod -R 0440 /etc/sudoers /etc/sudoers.d
        visudo -cf /etc/sudoers
        for f in /etc/sudoers.d/*; do visudo -cf "$f" || exit 1; done

    - name: Verify sudo shell/su access on guest
      shell: |
        sudo -l | grep -E '(su|/bin/sh|/usr/bin/sh)' 2>/dev/null && echo "SUDO_SHELL_OK" || echo "SUDO_SHELL_FAIL"
      register: sudo_shell_check
      failed_when: "'SUDO_SHELL_OK' not in sudo_shell_check.stdout"
      become: true

    - name: Verify sudo shell/su access on guest
      shell: |
        # Check privileges for the secops user specifically (as root)
        sudo -l -U {{ cloud_helper_user }} | grep -E '(su|/bin/sh|/usr/bin/sh)' 2>/dev/null && echo "SUDO_SHELL_OK" || echo "SUDO_SHELL_FAIL"
      register: sudo_shell_check
      # Ensure we only care about the last line to ignore banner noise
      failed_when: "'SUDO_SHELL_OK' not in sudo_shell_check.stdout_lines"
      become: true
  when: not all_files_match

- name: Remove temporary sudoers scaffolding
  file:
    path: "/tmp/{{ vm_host }}"
    state: absent
  delegate_to: localhost
  become: false
