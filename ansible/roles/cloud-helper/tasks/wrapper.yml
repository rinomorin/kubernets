---
# Deploy wrapper script and environment file on helper

- name: Deploy virsh wrapper script on helper
  template:
    src: "virsh-remote.j2"
    dest: "{{ helper_bin_dir }}/{{ virsh_wrapper_name }}"
    mode: "0755"
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"

- name: Deploy environment file for LIBVIRT_DEFAULT_URI
  copy:
    dest: "{{ env_file_path }}"
    content: |
      # libvirt remote default URI for helper
      export KVM_HOST="${KVM_HOST:-{{ kvm_host }}}"
      export LIBVIRT_DEFAULT_URI="qemu+ssh://{{ cloud_helper_user }}@${KVM_HOST}/system"
      export LIBVIRT_SSH_OPTIONS="${LIBVIRT_SSH_OPTIONS:-{{ ssh_options }}}"
    mode: "0644"
  become: true
