---
#
# cloud_helper_prep — Kubernetes Client Toolchain Setup
# Installs kubeadm, kubectl, and crictl on the helper node.
# Repository configuration is handled in repos.yml.
#
###############################################################
# pre. Install podman for the correct cri-o (repos already configured)
###############################################################
- name: Install kubeadm and kubectl
  become: true
  ansible.builtin.package:
    name:
      - podman
    state: present

###############################################################
# 1. Install kubeadm and kubectl (repos already configured)
###############################################################
- name: Install kubeadm and kubectl
  become: true
  ansible.builtin.package:
    name:
      - kubeadm
      - kubectl
    state: present

###############################################################
# 2. Install crictl from official GitHub release
###############################################################
- name: Set crictl version
  set_fact:
    crictl_version: "{{ lookup('env','crictl_version') | default('1.34.0', true) }}"

- name: Download crictl tarball
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{ crictl_version }}/crictl-v{{ crictl_version }}-linux-amd64.tar.gz"
        # https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.34.1/crictl-v1.34.1-linux-amd64.tar.gz
    dest: "/tmp/crictl-{{ crictl_version }}.tar.gz"
    mode: "0644"

- name: Extract crictl binary
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/crictl-{{ crictl_version }}.tar.gz"
    dest: "/usr/local/bin"
    remote_src: true

- name: Ensure crictl binary permissions
  become: true
  ansible.builtin.file:
    path: "/usr/local/bin/crictl"
    mode: "0755"
    owner: root
    group: root

###############################################################
# 3. Ensure .kube directory exists for helper user
###############################################################
- name: Ensure .kube directory exists for helper user
  become: true
  ansible.builtin.file:
    path: "/home/{{ cloud_helper_user }}/.kube"
    state: directory
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: "0750"

###############################################################
# 4. Ensure kubeconfig placeholder exists (non-destructive)
###############################################################
- name: Ensure kubeconfig placeholder exists
  become: true
  ansible.builtin.copy:
    dest: "/home/{{ cloud_helper_user }}/.kube/config"
    content: |
      # kubeconfig will be populated after cluster bootstrap
    owner: "{{ cloud_helper_user }}"
    group: "{{ cloud_helper_user }}"
    mode: "0600"
    force: no

###############################################################
# 5. Validate kubeadm installation
###############################################################
- name: Validate kubeadm installation
  become: false
  become_user: "{{ cloud_helper_user }}"
  ansible.builtin.command: kubeadm version
  register: kubeadm_check
  changed_when: false
  failed_when: kubeadm_check.rc != 0

###############################################################
# 6. Validate kubectl installation
###############################################################
- name: Validate kubectl installation
  become: false
  become_user: "{{ cloud_helper_user }}"
  ansible.builtin.command: kubectl version --client=true
  register: kubectl_check
  changed_when: false
  failed_when: kubectl_check.rc != 0

###############################################################
# 7. Validate crictl installation
###############################################################
- name: Validate crictl installation
  become: false
  become_user: "{{ cloud_helper_user }}"
  ansible.builtin.command: crictl --version
  register: crictl_check
  changed_when: false
  failed_when: crictl_check.rc != 0
