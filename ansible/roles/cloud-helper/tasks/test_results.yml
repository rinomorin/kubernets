---
# tasks/debug_summary.yml
# Consolidate test outputs and print a readable debug summary.
# Tag: summary

- name: Build test result summary
  set_fact:
    test_summary:
      ssh_connect: "{{ ssh_connect.stdout | default(ssh_connect.stderr) | default('no-output') }}"
      ssh_connect_ok: "{{ 'SSH_OK' in (ssh_connect.stdout | default('') + ssh_connect.stderr | default('')) }}"
      remote_groups: "{{ remote_groups.stdout | default('') }}"
      virsh_list: "{{ virsh_list.stdout | default(virsh_list.stderr) | default('no-output') }}"
      virsh_direct: "{{ virsh_direct.stdout | default(virsh_direct.stderr) | default('no-output') }}"
      qemu_img: "{{ qemu_img_check.stdout | default('not-found') }}"
      virsh_net_list: "{{ virsh_net_list.stdout | default('no-output') }}"
      authkey_check: "{{ authorized_key_check.stdout | default('no-output') }}"
  tags: summary

- name: Print concise debug summary
  debug:
    msg:
      - "==== cloud-helper test summary ===="
      - "Target KVM host: {{ kvm_host }}"
      - "Helper user: {{ cloud_helper_user }}"
      - ""
      - "**SSH connectivity**: {{ 'OK' if test_summary.ssh_connect_ok else 'FAILED' }}"
      - "SSH raw output: {{ test_summary.ssh_connect | default('none') }}"
      - ""
      - "**Remote groups for user**: {{ test_summary.remote_groups | default('none') }}"
      - "**Authorized key check**: {{ test_summary.authkey_check | default('none') }}"
      - ""
      - "**virsh (wrapper) output (first 10 lines)**:"
      - "{{ (test_summary.virsh_list.splitlines()[:10] | join('\n')) | default('no-output') }}"
      - ""
      - "**virsh (direct qemu+ssh) output (first 10 lines)**:"
      - "{{ (test_summary.virsh_direct.splitlines()[:10] | join('\n')) | default('no-output') }}"
      - ""
      - "**qemu-img on KVM host**: {{ test_summary.qemu_img | default('not-found') }}"
      - ""
      - "**libvirt networks (virsh net-list --all)**:"
      - "{{ (test_summary.virsh_net_list.splitlines()[:20] | join('\n')) | default('no-output') }}"
      - "=================================="
  tags: summary

- name: Fail the play if critical checks failed (optional)
  fail:
    msg: >
      One or more critical checks failed: SSH connectivity or authorized key missing.
      See the debug summary above for details.
  when: not test_summary.ssh_connect_ok or (test_summary.authkey_check is defined and test_summary.authkey_check != 'KEY_PRESENT')
  tags: summary
  # This fail is optional; you can comment it out if you prefer non-fatal reporting.
