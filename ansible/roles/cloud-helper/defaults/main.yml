---
# Role defaults for cloud-helper
# All operator-configurable values prefer environment variables.

# KVM host inventory name or IP. Prefer env KVM_HOST, fallback to 'kvmdc01'
kvm_host: "{{ lookup('env', 'VM_HOST') | default('kvmdc01',true) }}"

# Username to create/use on helper and on KVM host. Prefer env CLOUD_HELPER_USER
# roles/cloud-helper/defaults/main.yml
cloud_helper_user: "{{ lookup('env', 'CLOUD_HELPER_USER') | default('cloud_helper') }}"


# Groups to add the cloud_helper user to on the KVM host.
# Provide as comma-separated env KVM_HOST_GROUPS (e.g., "libvirt,kvm")
kvm_host_groups: >-
  {{ (lookup('env', 'KVM_HOST_GROUPS') | default('libvirt,kvm',true)).split(',') }}

# Helper working directory and key paths (on helper). Prefer env values.
helper_workdir: "{{ lookup('env', 'HELPER_WORKDIR') | default('/opt/cloud-helper',true) }}"
helper_bin_dir: "{{ lookup('env', 'HELPER_BIN_DIR') | default(helper_workdir ~ '/bin',true) }}"
helper_ssh_key_path: "{{ lookup('env', 'HELPER_SSH_KEY_PATH') | default(helper_workdir ~ '/id_rsa_cloud_helper',true) }}"
helper_ssh_pubkey_path: "{{ helper_ssh_key_path }}.pub"
# defaults/main.yml
ssh_key_comment: >-
  {{ (lookup('env','SSH_KEY_COMMENT') | default('') | string).strip() | default('cloud_helper@' ~ (lookup('env','HELPER_HOSTNAME') | default(inventory_hostname) | string)) }}

# Install coreos-installer on helper (true/false)
install_coreos_installer_on_helper: "{{ (lookup('env','INSTALL_COREOS_ON_HELPER') | default('true')) | bool }}"

# Minimal packages to ensure on helper and kvm host (env can override with comma-separated list)
cloud_helper_workdir: "{{ lookup('env','HELPER_WORKDIR') | default('/opt/' ~ cloud_helper_user, true) }}"
cloud_helper_bin_dir: "{{ lookup('env','HELPER_BIN_DIR') | default(cloud_helper_workdir ~ '/bin', true) }}"
cloud_helper_venv_path: "{{ lookup('env','CLOUD_HELPER_VENV') | default('/opt/cloud_helper/venv', true) }}"
ssh_authorized_key_path: "{{ lookup('env','helper_ssh_pubkey_path') | default('~/./ssh/id_rsa.pub', true) }}"
cloud_helper_ssh_pubkey: "{{ lookup('file', ssh_authorized_key_path) }}"
ssh_authorized_keys:
  - "{{ cloud_helper_ssh_pubkey[0] }}"

load_helper_packages: "{{ lookup('env','HELPER_PACKAGES') | default('jq,curl,qemu-img', true) }}"
cloud_helper_packages: "{{ load_helper_packages.split(',') }}"

kvm_packages: >-
  {{ (lookup('env','KVM_PACKAGES') | default('qemu-img,libvirt-client',true)).split(',') }}

# Polkit rule disabled by default to minimize KVM host changes; set env ENABLE_POLKIT_LIBVIRT=true to enable
enable_polkit_libvirt: "{{ (lookup('env','ENABLE_POLKIT_LIBVIRT') | default('false')) | bool }}"

# Wrapper script name (on helper) to run virsh against remote host
virsh_wrapper_name: "{{ lookup('env','VIRSH_WRAPPER_NAME') | default('virsh-remote',true) }}"

# Environment file to set LIBVIRT_DEFAULT_URI for convenience (on helper)
env_file_path: "{{ lookup('env','ENV_FILE_PATH') | default('/etc/profile.d/libvirt_remote.sh',true) }}"

# SSH options for qemu+ssh usage (can be overridden via env LIBVIRT_SSH_OPTIONS)
ssh_options: "{{ lookup('env','LIBVIRT_SSH_OPTIONS') | default('-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null',true) }}"

# Whether to create the cloud_helper user on the KVM host (true) or assume it exists (false)
create_cloud_helper_on_kvm: "{{ (lookup('env','CREATE_CLOUD_HELPER_ON_KVM') | default('true')) | bool }}"
crio_repo_ver: "{{ lookup('env','crictl_version') | default('1.34.0', true) }}"
ipa_master_fqdn: "{{ lookup('env', 'ipa_master') | default('none',true) }}"
nginx_cert_path: "/etc/nginx/certs"
cert_common_name: "{{ inventory_hostname }}"
cert_principal: "host/{{ inventory_hostname_short }}.{{ ipa_domain }}@{{ ipa_domain|upper }}"
cert_key_path: "/etc/pki/tls/private/{{ inventory_hostname_short }}.key"
cert_csr_path: "/etc/pki/tls/certs/{{ inventory_hostname_short }}.csr"
cert_crt_path: "/etc/pki/tls/certs/{{ inventory_hostname_short }}.crt"
cert_ca_chain_path: "/etc/pki/tls/certs/ipa-ca.crt"
ipa_admin_principal:  "{{ lookup('env', 'ipa_admin_principal')}}"
nat_ip_device: "{{ lookup('env','nat_ip_device') | default('172.16.0.20',true) }}"
# default system info
vcpu: "{{ lookup('env', 'VM_CPU') | default(4,true) }}"
ram: "{{ lookup('env', 'VM_MEM') | default(4096,true) }}"
# iso: "/var/lib/libvirt/images/Rocky-9.6-x86_64-dvd.iso"
default_network: "default"
os_variant: "rocky9"
shutdown_max_timeout: 1800
br_maint: "{{ lookup('env', 'KVM_NETWORK_NAT') | default('br-nat', true) }}"
br_provision: "{{ lookup('env', 'KVM_NETWORK_CLUSTER') | default('br-cluster', true) }}"
br_provider: "{{ lookup('env', 'KVM_NETWORK_PROVIDER') | default('default', true) }}"