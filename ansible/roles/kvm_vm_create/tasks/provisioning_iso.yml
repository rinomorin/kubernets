
---
# provisioning_iso.yml
# Install FCOS onto /dev/vda from the live ISO environment

- name: Wait for live ISO SSH to become available
  become: false
  wait_for:
    host: "{{ item }}"
    port: 22
    delay: 5
    timeout: 300
  loop: "{{ groups['cluster_nodes'] }}"
  delegate_to: localhost
  tags: [install]

- name: Upload Ignition config to live ISO
  ansible.builtin.copy:
    src: "/var/www/html/ignition/{{ item }}.ign"
    dest: "/var/tmp/config.ign"
    mode: '0644'
  loop: "{{ groups['cluster_nodes'] }}"
  delegate_to: "{{ item }}"
  tags: [install]

- name: Run coreos-installer inside live ISO
  ansible.builtin.shell: |
    sudo coreos-installer install /dev/vda \
      --ignition /var/tmp/config.ign \
      --copy-network
  loop: "{{ groups['cluster_nodes'] }}"
  delegate_to: "{{ item }}"
  tags: [install]

- name: Power off VM after installation
  ansible.builtin.shell: sudo systemctl poweroff
  loop: "{{ groups['cluster_nodes'] }}"
  delegate_to: "{{ item }}"
  ignore_errors: true
  tags: [install]

