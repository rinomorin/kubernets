---
# ============================================================
# cloud_prechecks: Detect-only — Kubernetes tooling
# ============================================================

# ------------------------------------------------------------
# 1. Detect kubeadm version (venv-aware)
# ------------------------------------------------------------
- name: Locate kubeadm binary
  shell: "command -v kubeadm 2>/dev/null || true"
  register: kubeadm_path
  changed_when: false

- name: Detect kubeadm version
  shell: "{{ kubeadm_path.stdout }} version 2>&1 || true"
  register: kubeadm_version_raw
  changed_when: false
- name: Extract kubeadm GitVersion safely
  set_fact:
    get_kubeadm_version: >-
      {{
        (kubeadm_version_raw.stdout + kubeadm_version_raw.stderr)
        | regex_search('GitVersion:\"[^\"]+\"')
        | default('GitVersion:"unknown"', true)
        | regex_replace('GitVersion:\"', '')
        | regex_replace('\"', '')
      }}

- name: Set kubeadm version fact
  set_fact:
    kubeadm_version: "{{ (get_kubeadm_version | regex_replace('^v','')) .split('.')[:2] | join('.') }}"

# ------------------------------------------------------------
# 2. Detect kubectl version (venv-aware)
# ------------------------------------------------------------
- name: Locate kubctl binary
  shell: "command -v kubectl 2>/dev/null || true"
  register: kubectl_path
  changed_when: false

- name: Detect kubectl version
  shell: "{{ kubectl_path.stdout }} version --client 2>/dev/null|grep -i client|awk '{print $NF }' || true"
  register: get_kubectl_version
  ignore_errors: true
  changed_when: false

- name: Set kubectl version fact
  set_fact:
    kubectl_version: "{{ get_kubectl_version.stdout.split('.')[:2] | join('.')| regex_replace('^v','') }}"

# ------------------------------------------------------------
# 3. Detect CRI-O service status
# ------------------------------------------------------------
# ------------------------------------------------------------
# Detect if kubelet exists (determines if CRI-O is required)
# ------------------------------------------------------------
- name: Check if kubelet is installed
  shell: "command -v kubelet >/dev/null 2>&1 && echo yes || echo no"
  register: kubelet_present
  changed_when: false

- name: Detect CRI-O service status
  shell: "systemctl is-active crio || true"
  register: crio_status_k8s
  ignore_errors: true
  changed_when: false

# ------------------------------------------------------------
# 4. Build Kubernetes precheck dictionary
# ------------------------------------------------------------
- name: Build Kubernetes precheck results
  set_fact:
    precheck_kubernetes:
      kubeadm_version: "{{ kubeadm_version | default('unknown') }}"
      kubectl_version: "{{ kubectl_version | default('unknown') }}"
      crio_service: >-
        {% if kubelet_present.stdout == 'no' %}
        NA
        {% else %}
        {{ 0 if (crio_status.stdout | default('inactive')) == 'active' else 1 }}
        {% endif %}
     
