---
# ============================================================
# cloud_prechecks: Detect-only — summary + JSON + HTML report
# ============================================================

# ------------------------------------------------------------
# 1. Combine all precheck dictionaries
# ------------------------------------------------------------
- name: Combine all precheck results
  set_fact:
    cloud_precheck_report:
      ansible: "{{ precheck_ansible }}"
      helper: "{{ precheck_helper }}"
      kvm: "{{ precheck_kvm }}"
      network: "{{ precheck_network }}"
      fcos: "{{ precheck_fcos }}"
      repos: "{{ precheck_repos }}"
      kubernetes: "{{ precheck_kubernetes }}"
      versions: "{{ precheck_versions }}"
  ignore_errors: true

# ------------------------------------------------------------
# 2. Write JSON report to /tmp
# ------------------------------------------------------------
- name: Write cloud precheck report to JSON file
  delegate_to: localhost
  become: false
  copy:
    dest: /opt/cloud/cloud_precheck_results.json
    content: "{{ cloud_precheck_report | to_nice_json }}"
    mode: '0644'
  ignore_errors: true
  changed_when: false

# ------------------------------------------------------------
# 3. Render HTML report to /tmp
# ------------------------------------------------------------
- name: Render cloud precheck HTML report
  delegate_to: localhost
  become: false
  template:
    src: cloud_precheck_report.html.j2
    dest: /opt/cloud/cloud_precheck_results.html
    mode: '0644'
  vars:
    report: "{{ cloud_precheck_report }}"
  ignore_errors: true
  changed_when: false

# ------------------------------------------------------------
# 4. Display human-readable summary
# ------------------------------------------------------------
- name: Display cloud precheck summary
  debug:
    msg:
      - "============================================================"
      - " Cloud Precheck Summary (Detect-Only)"
      - "============================================================"
      - "JSON report : /tmp/cloud_precheck_results.json"
      - "HTML report : /tmp/cloud_precheck_results.html"
      - ""
      - "Ansible:     {{ precheck_ansible }}"
      - "Helper:      {{ precheck_helper }}"
      - "KVM:         {{ precheck_kvm }}"
      - "Network:     {{ precheck_network }}"
      - "FCOS:        {{ precheck_fcos }}"
      - "Repos:       {{ precheck_repos }}"
      - "Kubernetes:  {{ precheck_kubernetes }}"
      - "Versions:    {{ precheck_versions }}"
      - "============================================================"
  ignore_errors: true
  changed_when: false
