---
- name: Clone Load Balancer nodes from Golden Image
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-clone --original golden-base 
    --name {{ item.split('.')[0] }} 
    --file /var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2
  loop: "{{ groups['hahost'] }}"
  register: lb_clones
  failed_when: 
    - lb_clones.rc != 0 
    - "'already exists' not in lb_clones.stderr"

- name: Start cloned VMs
  delegate_to: "{{ VM_HOST_IP }}"
  community.libvirt.virt:
    name: "{{ item.split('.')[0] }}"
    state: running
  loop: "{{ groups['hahost'] }}"

- name: NIC Discovery and Bootstrap IP Mapping
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    # 1. Get the Bootstrap MAC and IP from br-nat
    B_MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'br-nat' | awk '{print $5}')
    while ! sudo virsh net-dhcp-leases br-nat | grep -q "$B_MAC"; do sleep 2; done
    B_IP=$(sudo virsh net-dhcp-leases br-nat | grep "$B_MAC" | awk '{print $5}' | cut -d/ -f1)

    # 2. Capture MACs for target production networks
    CLOUD_MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'default' | awk '{print $5}' || echo "NONE")
    PROV_MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'br-cluster' | awk '{print $5}' || echo "NONE")

    # Output string for Ansible to parse (4 values)
    echo "$B_IP|$B_MAC|$CLOUD_MAC|$PROV_MAC"
  register: nic_discovery
  loop: "{{ groups['hahost'] }}"

- name: Set Network Discovery Facts
  set_fact:
    discovery_data: "{{ discovery_data | default({}) | combine({ item.item: {
      'bootstrap_ip': item.stdout.split('|')[0],
      'bootstrap_mac': item.stdout.split('|')[1],
      'cloud_mac': item.stdout.split('|')[2],
      'prov_mac': item.stdout.split('|')[3]
    } }) }}"
  loop: "{{ nic_discovery.results }}"

- name: Configure Production NICs (Forceful & Persistent)
  delegate_to: localhost
  vars:
    node: "{{ discovery_data[item] }}"
    # Renamed to provider_ip per your request
    provider_ip: "{{ hostvars[item].ansible_host | default('') }}"
    prov_ip: "{{ hostvars[item].provision_ip | default('') }}"
    
    # Calculate gateway (.1) from the 'default' network CIDR in inventory
    gateway_ip: "{{ hostvars['kvmdc01'].libvirt_networks | selectattr('name', 'equalto', 'default') | map(attribute='cidr') | first | ipaddr('net') | ipaddr('1') | cut -d/ -f1 }}"
    
    key_path: "/home/cloud_helper/.ssh/id_rsa"
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ key_path }} core@{{ node.bootstrap_ip }} << 'EOF'
      
      # 1. Configure Provider/Cloud Interface (Primary)
      if [ -n "{{ provider_ip }}" ] && [ "{{ node.cloud_mac }}" != "NONE" ]; then
        # Identify the device by MAC
        PROV_DEV=$(nmcli -t -f DEVICE,MAC-ADDRESS device show | grep -i "{{ node.cloud_mac }}" | cut -d: -f1 | head -n1)
        
        # Force-delete any existing active connections on this specific hardware
        for uuid in $(nmcli -t -f UUID,DEVICE connection show --active | grep "$PROV_DEV" | cut -d: -f1); do
          sudo nmcli con down "$uuid" || true
          sudo nmcli con delete "$uuid" || true
        done

        # Add the Static IP and the Dynamic Gateway
        sudo nmcli con add type ethernet con-name provider-net ifname $PROV_DEV \
          ipv4.addresses {{ provider_ip }}/24 \
          ipv4.gateway {{ gateway_ip }} \
          ipv4.method manual \
          connection.autoconnect yes
        
        sudo nmcli con up provider-net
      fi

      # 2. Configure Internal Provisioning Interface (Optional)
      if [ -n "{{ prov_ip }}" ] && [ "{{ node.prov_mac }}" != "NONE" ]; then
        INT_DEV=$(nmcli -t -f DEVICE,MAC-ADDRESS device show | grep -i "{{ node.prov_mac }}" | cut -d: -f1 | head -n1)
        for uuid in $(nmcli -t -f UUID,DEVICE connection show --active | grep "$INT_DEV" | cut -d: -f1); do
          sudo nmcli con delete "$uuid" || true
        done
        sudo nmcli con add type ethernet con-name internal-net ifname $INT_DEV \
          ipv4.addresses {{ prov_ip }}/24 ipv4.method manual connection.autoconnect yes
        sudo nmcli con up internal-net
      fi
    EOF
  loop: "{{ groups['hahost'] }}"

