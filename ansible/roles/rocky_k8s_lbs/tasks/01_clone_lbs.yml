---
- name: Clone Load Balancer nodes from Golden Image
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-clone --original golden-base 
    --name {{ item.split('.')[0] }} 
    --file /var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2
  loop: "{{ groups['hahost'] }}"
  register: lb_clones
  failed_when: 
    - lb_clones.rc != 0 
    - "'already exists' not in lb_clones.stderr"

- name: Start cloned VMs
  delegate_to: "{{ VM_HOST_IP }}"
  community.libvirt.virt:
    name: "{{ item.split('.')[0] }}"
    state: running
  loop: "{{ groups['hahost'] }}"

- name: NIC Discovery and Bootstrap IP Mapping
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    # 1. Get the Bootstrap MAC and IP from br-nat
    B_MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'br-nat' | awk '{print $5}')
    while ! sudo virsh net-dhcp-leases br-nat | grep -q "$B_MAC"; do sleep 2; done
    B_IP=$(sudo virsh net-dhcp-leases br-nat | grep "$B_MAC" | awk '{print $5}' | cut -d/ -f1)

    # 2. Capture MACs for target production networks
    CLOUD_MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'default' | awk '{print $5}' || echo "NONE")
    PROV_MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'br-cluster' | awk '{print $5}' || echo "NONE")

    # Output string for Ansible to parse (4 values)
    echo "$B_IP|$B_MAC|$CLOUD_MAC|$PROV_MAC"
  register: nic_discovery
  loop: "{{ groups['hahost'] }}"

- name: Set Network Discovery Facts
  set_fact:
    discovery_data: "{{ discovery_data | default({}) | combine({ item.item: {
      'bootstrap_ip': item.stdout.split('|')[0],
      'bootstrap_mac': item.stdout.split('|')[1],
      'cloud_mac': item.stdout.split('|')[2],
      'prov_mac': item.stdout.split('|')[3]
    } }) }}"
  loop: "{{ nic_discovery.results }}"

- name: Configure Production NICs (Conditional Assignment)
  delegate_to: localhost
  vars:
    node: "{{ discovery_data[item] }}"
    cloud_ip: "{{ hostvars[item].ansible_host | default('') }}"
    prov_ip: "{{ hostvars[item].provision_ip | default('') }}"
    key_path: "/home/cloud_helper/.ssh/id_rsa"
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ key_path }} core@{{ node.bootstrap_ip }} << 'EOF'
      
      # 1. Configure Cloud Interface (default bridge)
      if [ -n "{{ cloud_ip }}" ] && [ "{{ node.cloud_mac }}" != "NONE" ]; then
        CLOUD_DEV=$(nmcli -t -f DEVICE,MAC-ADDRESS device show | grep -i "{{ node.cloud_mac }}" | cut -d: -f1 | head -n1)
        sudo nmcli con add type ethernet con-name cloud-net ifname $CLOUD_DEV \
          ipv4.addresses {{ cloud_ip }}/24 ipv4.method manual connection.autoconnect yes
        sudo nmcli con up cloud-net
      fi

      # 2. Configure Provisioning Interface (br-cluster)
      if [ -n "{{ prov_ip }}" ] && [ "{{ node.prov_mac }}" != "NONE" ]; then
        PROV_DEV=$(nmcli -t -f DEVICE,MAC-ADDRESS device show | grep -i "{{ node.prov_mac }}" | cut -d: -f1 | head -n1)
        sudo nmcli con add type ethernet con-name prov-net ifname $PROV_DEV \
          ipv4.addresses {{ prov_ip }}/24 ipv4.method manual connection.autoconnect yes
        sudo nmcli con up prov-net
      fi
    EOF
  loop: "{{ groups['hahost'] }}"

- name: Final Cleanup - Remove Bootstrap NIC
  delegate_to: "{{ VM_HOST_IP }}"
  block:

    - name: Live Remove Unwanted NICs
      delegate_to: "{{ VM_HOST_IP }}"
      vars:
        short_name: "{{ item.split('.')[0] }}"
        # Extract facts into local task variables to simplify the shell block
        c_mac: "{{ discovery_data[item].cloud_mac }}"
        p_mac: "{{ discovery_data[item].prov_mac }}"
      shell: |
        CURRENT_MACS=$(sudo virsh domiflist {{ short_name }} | awk 'NR>2 {print $5}' | grep -vE '^$|-')
        for m in $CURRENT_MACS; do
          if [ "$m" != "{{ c_mac }}" ] && [ "$m" != "{{ p_mac }}" ]; then
            echo "<interface><mac address='$m'/></interface>" > /tmp/{{ short_name }}-$m.xml
            sudo virsh detach-device {{ short_name }} /tmp/{{ short_name }}-$m.xml --live --config
            rm -f /tmp/{{ short_name }}-$m.xml
          fi
        done
      loop: "{{ groups['hahost'] }}"
      register: cleanup_result
      changed_when: "'successfully' in cleanup_result.stdout"

    - name: Power off VMs
      community.libvirt.virt:
        name: "{{ item.split('.')[0] }}"
        state: shutdown
      loop: "{{ groups['hahost'] }}"

    - name: Wait for shutdown
      shell: "virsh list --name | grep -qx '{{ item.split('.')[0] }}'"
      register: vm_status
      until: vm_status.rc != 0
      retries: 20
      delay: 5
      loop: "{{ groups['hahost'] }}"
      failed_when: false

    - name: Power on Production LBs
      community.libvirt.virt:
        name: "{{ item.split('.')[0] }}"
        state: running
      loop: "{{ groups['hahost'] }}"

- name: Verify SSH reachability on Static IPs
  wait_for:
    host: "{{ hostvars[item].ansible_host }}"
    port: 22
    state: started
    timeout: 60
  loop: "{{ groups['hahost'] }}"