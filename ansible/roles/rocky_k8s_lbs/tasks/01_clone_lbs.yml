---
- name: Clone Load Balancer nodes from Golden Image
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-clone --original golden-base 
    --name {{ item.split('.')[0] }} 
    --file /var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2
  loop: "{{ groups['hahost'] }}"
  register: lb_clones
  failed_when: 
    - lb_clones.rc != 0 
    - "'already exists' not in lb_clones.stderr"

- name: Start cloned VMs
  delegate_to: "{{ VM_HOST_IP }}"
  community.libvirt.virt:
    name: "{{ item.split('.')[0] }}"
    state: running
  loop: "{{ groups['hahost'] }}"

- name: 1.1 - Discover Maintenance IP from br-nat
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    M_MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'br-nat' | awk '{print $5}')
    while ! sudo virsh net-dhcp-leases br-nat | grep -q "$M_MAC"; do sleep 2; done
    sudo virsh net-dhcp-leases br-nat | grep "$M_MAC" | awk '{print $5}' | cut -d/ -f1
  register: maintenance_ip_raw
  loop: "{{ groups['hahost'] }}"

- name: 1.2 - Verify Maintenance SSH (sshok)
  delegate_to: localhost
  vars:
    m_ip: "{{ item.stdout }}"
    key_path: "/home/cloud_helper/.ssh/id_rsa"
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ key_path }} core@{{ m_ip }} "echo sshok"
  register: ssh_test
  until: "'sshok' in ssh_test.stdout"
  retries: 5
  delay: 3
  loop: "{{ maintenance_ip_raw.results }}"

- name: 2.1 - Discover Provider MAC from default network
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    sudo virsh domiflist {{ item.split('.')[0] }} | grep 'default' | awk '{print $5}'
  register: provider_mac_raw
  loop: "{{ groups['hahost'] }}"

- name: 2.2 - Configure Provider IP via Maintenance Tunnel
  delegate_to: localhost
  vars:
    # Inventory values
    provider_ip: "{{ hostvars[item].ansible_host }}"
    # Calculated .1 Gateway
    provider_gw: "{{ hostvars['kvmdc01'].libvirt_networks | selectattr('name', 'equalto', 'default') | map(attribute='cidr') | first | ansible.utils.ipaddr('net') | ansible.utils.ipaddr('1') | split('/') | first }}"
    # Connections
    m_ip: "{{ maintenance_map[item] }}"
    p_mac: "{{ provider_mac_raw.results | selectattr('item', 'equalto', item) | map(attribute='stdout') | first }}"
    key_path: "/home/cloud_helper/.ssh/id_rsa"
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ key_path }} core@{{ m_ip }} << EOF
      # Identify the OS device name (ethX) using the Provider MAC
      DEV=\$(nmcli -t -f DEVICE,MAC-ADDRESS device show | grep -i "{{ p_mac }}" | cut -d: -f1 | head -n1)
      
      # Set Static IP and Gateway on the provider interface
      sudo nmcli con add type ethernet con-name provider-static ifname \$DEV \
        ipv4.addresses {{ provider_ip }}/24 \
        ipv4.gateway {{ provider_gw }} \
        ipv4.method manual \
        connection.autoconnect yes
      
      sudo nmcli con up provider-static
      EOF
  loop: "{{ groups['hahost'] }}"

