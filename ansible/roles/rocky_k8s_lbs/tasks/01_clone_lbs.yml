---
- name: Clone Load Balancer nodes from Golden Image
  delegate_to: "{{ VM_HOST_IP }}"
  command: >
    sudo virt-clone --original golden-base 
    --name {{ item.split('.')[0] }} 
    --file /var/lib/libvirt/images/{{ item.split('.')[0] }}.qcow2
  loop: "{{ groups['hahost'] }}"
  register: lb_clones
  failed_when: 
    - lb_clones.rc != 0 
    - "'already exists' not in lb_clones.stderr"

- name: Start cloned VMs
  delegate_to: "{{ VM_HOST_IP }}"
  community.libvirt.virt:
    name: "{{ item.split('.')[0] }}"
    state: running
  loop: "{{ groups['hahost'] }}"

- name: Wait for DHCP on br-nat
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    # Find the MAC specifically attached to the br-nat bridge
    MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'br-nat' | awk '{print $5}')
    # Loop until the lease appears in the br-nat table
    while ! sudo virsh net-dhcp-leases br-nat | grep -q "$MAC"; do 
      sleep 2
    done
  loop: "{{ groups['hahost'] }}"
  register: wait_for_dhcp

- name: Map DHCP IPs and MACs from br-nat
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'br-nat' | awk '{print $5}')
    IP=$(sudo virsh net-dhcp-leases br-nat | grep "$MAC" | awk '{print $5}' | cut -d/ -f1)
    echo "$MAC|$IP"
  register: lb_net_raw
  loop: "{{ groups['hahost'] }}"

- name: Set Discovery Facts
  set_fact:
    lb_dhcp_map: "{{ lb_dhcp_map | default({}) | combine({ item.item: item.stdout.split('|')[1] }) }}"
    lb_mac_map: "{{ lb_mac_map | default({}) | combine({ item.item: item.stdout.split('|')[0] }) }}"
  loop: "{{ lb_net_raw.results }}"

- name: Inject Static IP via SSH Jump
  delegate_to: localhost
  vars:
    temp_ip: "{{ lb_dhcp_map[item] }}"
    target_ip: "{{ hostvars[item].ansible_host }}"
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null core@{{ temp_ip }} \
    "sudo nmcli con mod 'Wired connection 1' ipv4.addresses {{ target_ip }}/24 ipv4.method manual connection.autoconnect yes && \
     sudo nmcli con up 'Wired connection 1'"
  async: 45
  poll: 0
  loop: "{{ groups['hahost'] }}"

- name: Verify SSH reachability on Static IP
  wait_for:
    host: "{{ hostvars[item].ansible_host }}"
    port: 22
    state: started
    timeout: 90
  loop: "{{ groups['hahost'] }}"