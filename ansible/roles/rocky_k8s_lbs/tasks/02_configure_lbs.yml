- name: Create Isolated Dummy Network
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if ! sudo virsh net-info black-hole >/dev/null 2>&1; then
      cat <<EOF > /tmp/black-hole.xml
      <network>
        <name>black-hole</name>
      </network>
    EOF
      sudo virsh net-define /tmp/black-hole.xml
      sudo virsh net-autostart black-hole
      sudo virsh net-start black-hole
    fi

- name: Final Cleanup - Isolate Cluster and NAT Networks
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    # 1. Get MACs for everything EXCEPT the 'default' network
    # This grabs the MACs for br-cluster and br-nat
    TARGET_MACS=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep -E 'br-nat|br-cluster' | awk '{print $5}')
    
    for MAC in $TARGET_MACS; do
      # 2. Create the "Dead" XML for this specific interface
      cat <<EOF > /tmp/{{ item }}_${MAC}_dead.xml
      <interface type='network'>
        <mac address='$MAC'/>
        <source network='black-hole'/>
        <link state='down'/>
        <model type='virtio'/>
      </interface>
    EOF

      # 3. Apply to the VM (Live and Config)
      sudo virsh update-device {{ item.split('.')[0] }} /tmp/{{ item }}_${MAC}_dead.xml --live --config
    done
  loop: "{{ groups['hahost'] }}"