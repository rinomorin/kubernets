---
- name: Install HA Software Stack
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no core@{{ hostvars[item].ansible_host }} \
    "sudo dnf install -y haproxy keepalived"
  loop: "{{ groups['hahost'] }}"

- name: Push HAProxy and Keepalived Configs
  delegate_to: localhost
  vars:
    target_ip: "{{ hostvars[item].ansible_host }}"
  block:
    - name: Local Templating
      template:
        src: "{{ file_item }}.j2"
        dest: "/tmp/{{ item }}_{{ file_item }}"
      loop: "{{ groups['hahost'] | product(['haproxy.cfg', 'keepalived.conf']) | list }}"
      loop_control:
        loop_var: file_pair
      vars:
        item: "{{ file_pair.0 }}"
        file_item: "{{ file_pair.1 }}"

    - name: Deploy and Enable Services
      shell: |
        scp /tmp/{{ item }}_haproxy.cfg core@{{ target_ip }}:/tmp/haproxy.cfg
        scp /tmp/{{ item }}_keepalived.conf core@{{ target_ip }}:/tmp/keepalived.conf
        ssh core@{{ target_ip }} << 'EOF'
          sudo mv /tmp/haproxy.cfg /etc/haproxy/haproxy.cfg
          sudo mv /tmp/keepalived.conf /etc/keepalived/keepalived.conf
          sudo sysctl -w net.ipv4.ip_nonlocal_bind=1
          sudo setsebool -P haproxy_connect_any 1
          sudo systemctl enable --now keepalived haproxy
        EOF
      loop: "{{ groups['hahost'] }}"

- name: Final Cleanup - Remove Bootstrap NIC
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    MAC=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep 'default' | awk '{print $5}')
    sudo virsh detach-interface {{ item.split('.')[0] }} bridge --mac $MAC --config --live
  loop: "{{ groups['hahost'] }}"