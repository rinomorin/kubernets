---
- name: Install HA Software Stack
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ ssh_key_path }} core@{{ hostvars[item].ansible_host }} "sudo dnf install -y haproxy keepalived policycoreutils-python-utils"
  loop: "{{ groups['hahost'] }}"

- name: Configure Load Balancer Infrastructure
  block:
    - name: Create local staging directories
      delegate_to: localhost
      file:
        path: "/tmp/k8s_lb_configs/{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ groups['hahost'] }}"

    - name: Template HAProxy Config
      delegate_to: localhost
      template:
        src: haproxy.cfg.j2
        dest: "/tmp/k8s_lb_configs/{{ item }}/haproxy.cfg"
        force: true
      loop: "{{ groups['hahost'] }}"

    - name: Template Keepalived Config
      delegate_to: localhost
      template:
        src: keepalived.conf.j2
        dest: "/tmp/k8s_lb_configs/{{ item }}/keepalived.conf"
        force: true
      loop: "{{ groups['hahost'] }}"

    - name: Detect active network interface
      delegate_to: localhost
      shell: ssh -o StrictHostKeyChecking=no -i {{ ssh_key_path }} core@{{ hostvars[item].ansible_host }} "ip -4 -o addr show | grep '192.168.100.' | awk '{print \$2}' | head -n1"
      register: detected_iface
      loop: "{{ groups['hahost'] }}"

    - name: Set interface fact
      set_fact:
        active_iface: "{{ item.stdout }}"
      delegate_to: "{{ item.item }}"
      delegate_facts: true
      loop: "{{ detected_iface.results }}"

    - name: Push and Prepare Node Configuration
      delegate_to: localhost
      loop: "{{ groups['hahost'] }}"
      vars:
        ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ ssh_key_path }}"
        target_ip: "{{ hostvars[item].ansible_host }}"
      shell: |
        # 1. Update local configs with detected interface and VIP
        sed -i "s|interface .*|interface {{ hostvars[item].active_iface }}|g" /tmp/k8s_lb_configs/{{ item }}/keepalived.conf
        sed -i "s|[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/24|{{ k8s_api_vip }}/24|g" /tmp/k8s_lb_configs/{{ item }}/keepalived.conf
        sed -i "s|bind .*:6443|bind {{ k8s_api_vip }}:6443|g" /tmp/k8s_lb_configs/{{ item }}/haproxy.cfg
        
        # 2. SCP configs to temporary location on host
        scp {{ ssh_opts }} /tmp/k8s_lb_configs/{{ item }}/haproxy.cfg core@{{ target_ip }}:/tmp/haproxy.cfg
        scp {{ ssh_opts }} /tmp/k8s_lb_configs/{{ item }}/keepalived.conf core@{{ target_ip }}:/tmp/keepalived.conf

        # 3. Apply Host-Level fixes (Firewall, Sysctl, SELinux, and File Moves)
        ssh {{ ssh_opts }} core@{{ target_ip }} "
          # Firewall
          sudo firewall-cmd --permanent --add-port=6443/tcp
          sudo firewall-cmd --permanent --add-rich-rule='rule protocol value=\"vrrp\" accept'
          sudo firewall-cmd --reload

          # Sysctl for Non-Local Binding (Prevents HAProxy crash)
          sudo sysctl -w net.ipv4.ip_nonlocal_bind=1
          echo 'net.ipv4.ip_nonlocal_bind = 1' | sudo tee /etc/sysctl.d/99-haproxy.conf

          # SELinux for Port 6443
          sudo setsebool -P haproxy_connect_any 1 || true
          sudo semanage port -a -t http_port_t -p tcp 6443 || sudo semanage port -m -t http_port_t -p tcp 6443

          # Deployment
          sudo ip addr del 192.168.100.29/24 dev {{ hostvars[item].active_iface }} || true
          sudo mv /tmp/haproxy.cfg /etc/haproxy/haproxy.cfg
          sudo mv /tmp/keepalived.conf /etc/keepalived/keepalived.conf
          sudo chown root:root /etc/haproxy/haproxy.cfg /etc/keepalived/keepalived.conf
          sudo chmod 644 /etc/haproxy/haproxy.cfg /etc/keepalived/keepalived.conf
          sudo restorecon -Rv /etc/haproxy /etc/keepalived

          # Start Logic
          sudo systemctl daemon-reload
          sudo systemctl enable keepalived haproxy
          sudo systemctl restart keepalived
          sleep 2
          sudo systemctl restart haproxy
        "

    - name: Start and Verify Services
      delegate_to: localhost
      loop: "{{ groups['hahost'] }}"
      shell: |
        ssh -o StrictHostKeyChecking=no -i {{ ssh_key_path }} core@{{ hostvars[item].ansible_host }} "
          sudo systemctl restart keepalived
          sleep 2
          sudo systemctl enable --now haproxy
          systemctl is-active haproxy keepalived
        "
      register: final_verify
      failed_when: final_verify.rc != 0

- name: Create Isolated Dummy Network
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    if ! sudo virsh net-info black-hole >/dev/null 2>&1; then
      cat <<EOF > /tmp/black-hole.xml
      <network><name>black-hole</name></network>
    EOF
      sudo virsh net-define /tmp/black-hole.xml
      sudo virsh net-autostart black-hole
      sudo virsh net-start black-hole
    fi

- name: Final Cleanup - Isolate Cluster and NAT Networks
  delegate_to: "{{ VM_HOST_IP }}"
  shell: |
    TARGET_MACS=$(sudo virsh domiflist {{ item.split('.')[0] }} | grep -E 'br-nat|br-cluster' | awk '{print $5}')
    for MAC in $TARGET_MACS; do
      cat <<EOF > /tmp/{{ item }}_${MAC}_dead.xml
      <interface type='network'>
        <mac address='$MAC'/>
        <source network='black-hole'/>
        <link state='down'/>
        <model type='virtio'/>
      </interface>
    EOF
      sudo virsh update-device {{ item.split('.')[0] }} /tmp/{{ item }}_${MAC}_dead.xml --live --config
    done
  loop: "{{ groups['hahost'] }}"