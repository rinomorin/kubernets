---
- name: Install HA Software Stack
  delegate_to: localhost
  shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ ssh_key_path }} core@{{ hostvars[item].ansible_host }} "sudo dnf install -y haproxy keepalived"
  loop: "{{ groups['hahost'] }}"

- name: Push firewall and Enable LB Services
  delegate_to: localhost
  loop: "{{ groups['hahost'] }}"
  vars:
    ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ ssh_key_path }}"
    target_ip: "{{ hostvars[item].ansible_host }}"
  shell: |
    # Firewall setup
    ssh {{ ssh_opts }} core@{{ target_ip }} sudo firewall-cmd --permanent --add-port=6443/tcp
    ssh {{ ssh_opts }} core@{{ target_ip }} sudo firewall-cmd --permanent --add-rich-rule='rule protocol value="vrrp" accept'
    ssh {{ ssh_opts }} core@{{ target_ip }} sudo firewall-cmd --reload
    
- name: Prepare and Push LB Configs
  block:
    - name: Create local staging directories
      delegate_to: localhost
      file:
        path: "/tmp/k8s_lb_configs/{{ item }}"
        state: directory
        mode: '0755'
      loop: "{{ groups['hahost'] }}"

    - name: Template HAProxy Config
      delegate_to: localhost
      template:
        src: haproxy.cfg.j2
        dest: "/tmp/k8s_lb_configs/{{ item }}/haproxy.cfg"
        force: true
      loop: "{{ groups['hahost'] }}"

    - name: Template Keepalived Config
      delegate_to: localhost
      template:
        src: keepalived.conf.j2
        dest: "/tmp/k8s_lb_configs/{{ item }}/keepalived.conf"
        force: true
      loop: "{{ groups['hahost'] }}"

    - name: Push and Enable LB Services
      delegate_to: localhost
      loop: "{{ groups['hahost'] }}"
      vars:
        ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i {{ ssh_key_path }}"
        target_ip: "{{ hostvars[item].ansible_host }}"
        ghost_ip: "192.168.100.29"
        correct_vip: "{{ k8s_api_vip }}"
      shell: >+
        REMOTE_IFACE=$(ssh {{ ssh_opts }} core@{{ target_ip }} "ip -4 -o addr show | grep '192.168.100.' | awk '{print \$2}' | head -n1") &&
        sed -i "s|interface .*|interface ${REMOTE_IFACE}|g" /tmp/k8s_lb_configs/{{ item }}/keepalived.conf &&
        sed -i "s|[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/24|{{ correct_vip }}/24|g" /tmp/k8s_lb_configs/{{ item }}/keepalived.conf &&
        sed -i "s|bind .*:6443|bind {{ correct_vip }}:6443|g" /tmp/k8s_lb_configs/{{ item }}/haproxy.cfg &&
        scp {{ ssh_opts }} /tmp/k8s_lb_configs/{{ item }}/haproxy.cfg core@{{ target_ip }}:/tmp/haproxy.cfg &&
        scp {{ ssh_opts }} /tmp/k8s_lb_configs/{{ item }}/keepalived.conf core@{{ target_ip }}:/tmp/keepalived.conf &&
        ssh {{ ssh_opts }} core@{{ target_ip }} "
          if ip addr show | grep -q '{{ ghost_ip }}'; then
            sudo ip addr del {{ ghost_ip }}/24 dev ${REMOTE_IFACE} || true;
          fi;
          sudo mv /tmp/haproxy.cfg /etc/haproxy/haproxy.cfg;
          sudo mv /tmp/keepalived.conf /etc/keepalived/keepalived.conf;
          sudo chown root:root /etc/haproxy/haproxy.cfg /etc/keepalived/keepalived.conf;
          sudo chmod 644 /etc/haproxy/haproxy.cfg /etc/keepalived/keepalived.conf;
          sudo restorecon -v /etc/haproxy/haproxy.cfg /etc/keepalived/keepalived.conf;
          sudo systemctl restart keepalived;
          sleep 1;
          sudo systemctl restart haproxy;
        "

