- name: Cleanup Existing LB Nodes (Rebuild Requested)
  delegate_to: "{{ VM_HOST_IP }}"
  when: rebuild_lbs | default(false) | bool
  shell: |
    # Loop through the specific VM name for this iteration
    VM_NAME="{{ item.split('.')[0] }}"
    
    if sudo virsh list --all | grep -q "$VM_NAME"; then
      echo "Removing existing VM: $VM_NAME"
      
      # 1. Force stop if running
      sudo virsh destroy "$VM_NAME" || true
      
      # 2. Undefine with all associated storage (wipes the qcow2 files)
      sudo virsh undefine "$VM_NAME" --remove-all-storage --nvram || true
      
      # 3. Clean up any leftover XML in tmp from previous failed runs
      sudo rm -f /tmp/${VM_NAME}*
    else
      echo "VM $VM_NAME does not exist. Skipping cleanup."
    fi
  loop: "{{ groups['hahost'] }}"
  register: cleanup_output
  changed_when: "'Removing existing VM' in cleanup_output.stdout"