- name: load environment
  hosts: all
  gather_facts: false
  tasks:
    - name: "0.1 - Safety Check: Verify Root Password for Rebuild"
      block:
        - name: Ensure root_set is provided
          fail:
            msg: "CRITICAL: 'root_set' (Root Password) must be defined when force_rebuild is enabled!"
          when: root_set is not defined or root_set | length == 0

        - name: Confirming Rebuild Status
          debug:
            msg: "Force Rebuild is ACTIVE. Proceeding with root_set password."
      # Only run this entire block if force_rebuild is actually TRUE
      when: force_rebuild | default(false) | bool

    - name: Ensure latest stable collections are installed on controller
      delegate_to: localhost
      become: false
      run_once: true
      command: "ansible-galaxy collection install {{ item }} --upgrade"
      loop:
        - community.general
        - ansible.posix
        - kubernetes.core  # Highly recommended for your FCOS/K8s work
      changed_when: false # These commands check for updates every time

    - name: load environment
      set_fact:
        VM_HOST: "{{ lookup('env','VM_HOST')}}"
        ipa_domain: "{{ lookup('env', 'ipa_domain') }}"
        ipa_admin_password: "{{ lookup('env', 'ipa_admin_password') }}"
        dns_zone: "{{ lookup('env', 'dns_zone') }}"
        admin_id: "{{ lookup('env', 'admin_id') }}"
        admin_set: "{{ lookup('env', 'admin_set') }}"
        secops_id: "{{ lookup('env', 'secops_id') }}"
        cloud_id: "{{ lookup('env', 'cloud_id') }}"
        secops_pwd: "{{ lookup('env', 'secops_pwd') }}"
        kubetnet_version: "{{ lookup('env', 'kubetnet_version') }}"
        cluster_ip_addr: "{{ lookup('env', 'cluster_ip_addr') }}"
        cluster_netmask: "{{ lookup('env', 'cluster_netmask') }}"
        cloud_zone: "{{ lookup('env', 'cloud_zone') }}"
        cluster_gateway: "{{ lookup('env', 'cluster_gateway') }}"
        default_netmask: "{{ lookup('env', 'default_netmask') }}"
        default_net_device: "{{ lookup('env', 'default_net_device') }}"
        cluster_net_device: "{{ lookup('env', 'cluster_net_device') }}"
        nat_net_device: "{{ lookup('env', 'nat_net_device') }}"
        default_ansible_pwd: "{{ lookup('env', 'secops_pwd') }}"
        secops_key: "{{ lookup('env','secops_key') }}"
        secops_edkey: "{{ lookup('env','secops_edkey') }}"
        ssh_key_path: "{{ lookup('env', 'ssh_key_path')| to_json }}"
        account_name: "{{ lookup('env', 'account_name') }}"
        masters: "{{ groups['control_nodes'] | default([]) }}"
        workers: "{{ groups['worker_nodes'] | default([]) }}"
        helper_node: "{{ groups['helpers'][0] | default([]) }}"
        helper_node_ip: "{{ hostvars[groups['helpers'][0]].ansible_host }}"
        node_list: "{{ groups['control_nodes'] + groups['worker_nodes'] }}"
        vm_host: "{{ inventory_hostname }}"
        vm_fqdn: >-
          {{ hostvars[inventory_hostname].hostname
            | default(inventory_hostname_short + '.' + (ansible_domain | default(lookup('env', 'ipa_domain')|lower)) ) }}


        # Network layout
        cloud_networks:
          house: "{{ lookup('env', 'VM_HOST_IP').split('/')[0].split('.')[:3] | join('.')}}.0/24"
          private: "{{ lookup('env', 'cluster_ip_addr').split('/')[0].split('.')[:3] | join('.')}}.0/24"
          nat: "{{ lookup('env', 'nat_ip_device').split('/')[0].split('.')[:3] | join('.')}}.0/24"

        # Interface mapping
        cloud_interfaces:
          house: "enp1s0"
          private: "enp2s0"
          nat: "enp3s0"

# prep controller for role images
- hosts: localhost
  connection: ssh
  gather_facts: false
  vars:
    ansible_remote_tmp: "{{ iso_repo }}/repo/.ansible/tmp"
    ansible_user: "{{ lookup('env', 'secops_id') }}"
    ansible_password: "{{ lookup('env', 'secops_pwd') }}"
  roles:
    - rocky-repo


# display which sys being processed
- name: Info VMs from KVM host
  hosts: all
  gather_facts: no
  become: no
  tasks:
    - name: processing systems
      debug: msg="{{ inventory_hostname }} being processed"

- name: Provision VMs from KVM host
  hosts: all
  vars:
    ipa_domain: "{{ lookup('env', 'ipa_domain') }}"
    dns_zone: "{{ lookup('env', 'dns_zone') }}"
    account_name: "{{ lookup('env', 'account_name') }}"
    admin_id: "{{ lookup('env', 'admin_id') }}"
    admin_set: "{{ lookup('env', 'admin_set') }}"
    secops_id: "{{ lookup('env', 'secops_id') }}"
    secops_pwd: "{{ lookup('env', 'secops_pwd') }}"
  become: true
  gather_facts: no
  roles:
    - role: kvm_provision

- name: Build Stage
  hosts: all
  tasks:
    - name: show vm_stage_map
      debug: msg="{{ inventory_hostname }} is in {{ global_vm_build_state }} state"
      when: 
        - "'kvm' not in group_names"
    
    - name: set global state
      set_fact: 
         vm_build_state: '{{ global_vm_build_state | default("skipped") }}'

- hosts: all
  gather_facts: false
  vars:
    vm_build_state: "{{ global_vm_build_state | default('skipped') }}"
  roles:
    - ipa_setup

- hosts: all
  gather_facts: false
  vars:
    vm_build_state: "{{ global_vm_build_state | default('skipped') }}"
  roles:
    - helpers

