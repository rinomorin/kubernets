---
# 1. Prepare Environment
- name: load environment
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure latest stable collections are installed on controller
      delegate_to: localhost
      become: false
      run_once: true
      command: "ansible-galaxy collection install {{ item }} --upgrade"
      loop:
        - community.general
        - ansible.posix
        - kubernetes.core  # Highly recommended for your FCOS/K8s work
      changed_when: false # These commands check for updates every time

# 2. Run your environment check playbook
- import_playbook: ../check_env.yml

# 3. Build Golden Base (Conditional)
- name: Build Golden Base Image
  hosts: kvm
  gather_facts: false
  vars:
    golden_image_name: "{{ lookup('env', 'golden_image_name') | default('golden-base', true) }}"
  
  pre_tasks:
    - name: Check if Golden Base already exists
      delegate_to: "{{ VM_HOST_IP }}"
      shell: "sudo virsh dominfo {{ golden_image_name }}"
      register: base_check
      ignore_errors: true # Important: don't crash if it's missing
      changed_when: false
      run_once: true

  tasks:
    - name: Run Golden Image Build Role
      include_role:
        name: rocky_k8s_golden
      when: base_check.rc != 0 # Only runs if the check failed (image missing)

# 4. Deploy Infrastructure (LBs and Base Config)
- name: Deploy Cluster Infrastructure
  hosts: kvm
  gather_facts: false
  roles:
    - role: rocky_k8s_lbs
    # You can uncomment and add rocky_k8s_base here if needed