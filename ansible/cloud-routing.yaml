apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
spec:
  ingressClassName: nginx  # This fixes the warning you saw
  rules:
  - host: nginx.cloud.morinsoft.ca  # MUST match your /etc/hosts exactly
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-external # Ensure this is the EXACT name of your service
            port:
              number: 80