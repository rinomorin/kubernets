---
- name: Pre-Flight Environment Validation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Verify Shell Environment Variables
      assert:
        that:
          - lookup('env', 'VM_HOST_IP') != ""
          - lookup('env', 'ipa_admin_password') != ""
          - lookup('env', 'secops_key') != ""
          - lookup('env', 'iso_path') != ""
        fail_msg: |
          FATAL: Environment not loaded! 
          Please run 'source env_build.sh' before executing this playbook.
          Missing one or more: VM_HOST_IP, ipa_admin_password, secops_key, iso_path.

    - name: Report Detected Build Profile
      debug:
        msg: 
          - "Target KVM Host: {{ lookup('env', 'VM_HOST_IP') }}"
          - "Domain:          {{ lookup('env', 'ipa_domain') }}"
          - "K8s Version:    {{ lookup('env', 'kubetnet_version') }}"
          - "CRI-O Version:   {{ lookup('env', 'crio_version') }}"
          - "ISO Source:     {{ lookup('env', 'iso_path') }}"

    - name: Verify ISO on KVM Host (Using Find to bypass string issues)
      delegate_to: localhost
      become: false
      # We search the directory for any file containing 'Rocky-9' and 'dvd.iso'
      shell: |
        ssh {{ lookup('env', 'VM_HOST_IP') }} sudo find /var/lib/libvirt/images/ -name "Rocky-9*dvd.iso" -print
      register: iso_found
      failed_when: iso_found.stdout == ""

    - name: Debug The Real Path Found
      debug:
        msg: 
          - "System found the file at: [{{ iso_found.stdout }}]"
          - "Your Env Variable says:  [{{ lookup('env', 'iso_path') }}]"

    - name: Force Update Env Path Fact
      set_fact:
        sanitized_iso_path: "{{ iso_found.stdout | trim }}"

    - name: Final Validation Success
      debug:
        msg: "Environment is VALID. Proceeding to Golden Base build."