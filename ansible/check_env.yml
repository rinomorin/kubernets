---
- name: Pre-Flight Environment Validation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Verify Shell Environment Variables
      assert:
        that:
          - lookup('env', 'VM_HOST_IP') != ""
          - lookup('env', 'ipa_admin_password') != ""
          - lookup('env', 'secops_key') != ""
          - lookup('env', 'iso_path') != ""
        fail_msg: |
          FATAL: Environment not loaded! 
          Please run 'source env_build.sh' before executing this playbook.
          Missing one or more: VM_HOST_IP, ipa_admin_password, secops_key, iso_path.

    - name: Report Detected Build Profile
      debug:
        msg: 
          - "Target KVM Host: {{ lookup('env', 'VM_HOST_IP') }}"
          - "Domain:          {{ lookup('env', 'ipa_domain') }}"
          - "K8s Version:    {{ lookup('env', 'kubetnet_version') }}"
          - "CRI-O Version:   {{ lookup('env', 'crio_version') }}"
          - "ISO Source:     {{ lookup('env', 'iso_path') }}"

    - name: Verify ISO on KVM Host via Root Shell
      delegate_to: "{{ lookup('env', 'VM_HOST_IP') | trim }}"
      become: false
      shell: |
        # We wrap the command in bash -c to use root's environment and globbing
        sudo /bin/bash -c "ls -1 /var/lib/libvirt/images/Rocky-9*.iso"
      register: iso_found
      failed_when: iso_found.rc != 0 or iso_found.stdout == ""

    - name: Final Path Validation
      assert:
        that:
          - "lookup('env', 'iso_path') | trim == iso_found.stdout | trim"
        fail_msg: |
          PATH MISMATCH!
          Environment: [{{ lookup('env', 'iso_path') }}]
          Actual File: [{{ iso_found.stdout }}]

    - name: Verify Locate Result matches Environment
      assert:
        that:
          - "lookup('env', 'iso_path') | trim in locate_iso.stdout"
        fail_msg: "Locate found the ISO at {{ locate_iso.stdout }}, but your env_build.sh says {{ lookup('env', 'iso_path') }}"
    - name: Final Validation Success
      debug:
        msg: "Environment is VALID. Proceeding to Golden Base build."